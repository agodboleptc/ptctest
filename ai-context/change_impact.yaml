# Change Impact Analysis Dataset — for an AI agent to consult BEFORE modifying any of
# these classes. Source of truth: docs/classes/*.md, docs/02_architecture_overview.md,
# docs/04_installation_flow.md, docs/06-11_*.md.
#
# RiskLevel is based on: file size/centrality, number of callers, confirmed bug
# history, concurrency footprint (singleton vs. per-entitlement), and blast radius if
# broken — not on subjective code-quality judgment.
#
# full_detail: true means all 8 fields below are backed by a dedicated docs/classes/*.md
# analysis. full_detail: false means the entry is a lighter, module-level-evidence-only
# summary (see the class's home module doc for what's actually confirmed).

classes:

  - class: pimLoop
    full_detail: true
    doc: docs/classes/pimLoop.md
    purpose: "Abstract base for every threaded, cancelable install step (and pimEntitlement itself)"
    depends_on: [thrThread (external btk), thrMutex, thrSemaphore, pimXmlFile, msgID_sput_buffer (external)]
    called_by: ["every pimLoop subclass's owner (pimCopier, pimMSICopier, pimSFXCopier, pimShortcuts, pimRegEdit, pimServices, pimDownloader — all 7 are singletons, not per-entitlement, see ai-context/ownership.yaml)", "pim/pim_src/pimTop.cxx (Wait() on every entitlement)"]
    risk_level: HIGH
    risk_rationale: "Touching this class affects EVERY install step type in the codebase simultaneously — there is no isolated subset of callers."
    modification_impact:
      - "Changing Execute()/Cancel()/Pause() semantics changes behavior for all 9 concrete Loop subclasses at once"
      - "OnUnhandled crashes the process on any subclass's uncaught exception — changing this changes crash-vs-recover behavior codebase-wide"
      - "Errors/Warnings buffer format changes would require updating every GetErrors/GetWarnings consumer (UI, silent-mode logging)"
    test_areas:
      - "Each of the 9 Loop subclasses' Execute/Cancel/Pause/Resume cycle individually"
      - "Concurrent Cancel() calls while a subclass's OnExecute() is mid-run"
      - "Unhandled-exception path (verify it still crashes intentionally, doesn't silently swallow)"

  - class: pimEntitlement
    full_detail: true
    doc: docs/classes/pimEntitlement.md
    purpose: "One installable product; orchestrates its entire install/update/reconfigure/uninstall/rollback lifecycle"
    loc: 7649
    depends_on: [pimLoop, pimSessionInfo, pimXmlFile, pimConvert, "pimCopier/pimMSICopier/pimSFXCopier/pimShortcuts/pimRegEdit/pimServices/pimDownloader (called as singletons, not owned)"]
    called_by: ["pimSessionInfo (construction, arrays)", "pim/pim_src/pimTop.cxx (metadata reads, SetInstallMe, Wait)", "pim_ui dialogs (StartOrRestartInstall, Cancel, progress polling — not individually traced)", "friend classes upimDlg, upimSilentProgress (direct private-member access)"]
    risk_level: CRITICAL
    risk_rationale: >
      Largest, most central file in the codebase (7649 lines). Owns the entire
      install pipeline, prerequisite graph, and update/rollback logic in one
      place. Two friend classes bypass its public API entirely, so a
      private-layout change can break UI code invisibly. A FURTHER PASS fully
      traced OnReconfigure() (pim_core_src/pimEntitlement.cxx:6866-7222) and
      OnRollback(bool from_during_install) (:7287-7565), both previously
      flagged as not traced in docs/04_installation_flow.md. CONFIRMED BUG,
      HIGH SEVERITY: OnReconfigure()'s first block computes RollbackMe's path
      (the original as-shipped .p.xml) by taking a local copy of xmlPtr's own
      CURRENT cache-file path and, purely as a side effect of extracting its
      bare filename via GetTail(), unconditionally deletes that cache file
      from disk first (`if (src.IsFile()) src.Erase();`) -- there is no
      functional need to delete the file just to read its own filename. Two
      confirmed early-return paths exist before xmlPtr->DoSave() is ever
      called again, leaving the cache file permanently deleted with nothing
      to replace it: PerformServiceAction(StopAction) failing (:6921-6925,
      no DoSave() before the return), and OnInstallCustomActions("PreReconfigure")
      failing (:7023-7024, likewise no DoSave() before the return -- reachable
      via an ordinary custom-action failure, no cancellation needed).
      Reachability: OnReconfigure() only runs against an already-installed,
      already-cached entitlement, so the file being erased is confirmed to
      exist in the realistic common case. CONFIRMED, by direct contrast:
      OnRollback()'s own mirror-image "relocate the cache file" block
      (:7317-7325) computes an equivalent new path via SetXml() with NO
      preceding Erase() -- the 2 sibling relocation blocks are asymmetric.
      Also confirmed: OnRollback() resolves the doc's own open questions --
      exactly 2 from_during_install-specific branches exist (Copier's
      Rollback() vs Uninstall() choice, and a final creobase.xml-only empty-
      directory cleanup), and the function has ZERO early-return points
      (a single uninterrupted sequential run, unlike OnInstall()/
      OnReconfigure()'s many early exits) -- consistent with its
      OnUninstallCustomActions("PreUninstall") failure being logged but not
      fatal, the opposite of OnReconfigure()'s fail-fast custom-actions
      handling.
    modification_impact:
      - "Any change to OnInstall()'s stage ORDER or skip-flag gating affects every product's install (docs/04_installation_flow.md §2)"
      - "Changing PreRequisitesToHandle's map semantics affects docs/05_prerequisite_framework.md's entire mechanism"
      - "Changing private member layout can silently break upimDlg/upimSilentProgress (friend access, no compiler warning across TUs in the same way a public API break would surface)"
      - "Changing PctMutex vs pimLoop::Mutex locking order/scope risks the cross-mutex-consistency issue already flagged in docs/classes/pimEntitlement.md"
      - "PRIORITY: drop the Erase() call in OnReconfigure()'s RollbackMe-path computation (pimEntitlement.cxx:6887-6888) before shipping any change that touches reconfigure -- GetTail()'s correctness does not depend on the file being deleted first, and 2 confirmed failure paths currently leave the entitlement's cache file permanently gone"
      - "If a future change adds a new early-return path to OnReconfigure() between its own Erase() call and the cache relocation/first DoSave(), it inherits this same data-loss risk unless it also calls xmlPtr->DoSave() first"
    test_areas:
      - "Fresh install, update-over-existing, reconfigure, and uninstall paths independently"
      - "Hard vs soft prerequisite gating (both satisfied and never-satisfied cases)"
      - "Every NoXxx skip-flag combination actually used by a real product XML"
      - "Cancellation at each of the ~7+ IsCancelFlagSet() checkpoints in OnInstall()"
      - "upimDlg/upimSilentProgress still compile and behave correctly against any private-member changes"
      - "PRIORITY: force PerformServiceAction(StopAction) to fail during a reconfigure of an already-installed entitlement, then confirm the entitlement's cached XML file under pimGetAppData/pim/ is permanently missing afterward (reproduces the confirmed cache-file-deletion bug via its 1st path)"
      - "Force a PreReconfigure custom action to fail during the same reconfigure scenario and confirm the identical missing-cache-file outcome via the 2nd confirmed path"
      - "Run OnRollback() to completion with an individual stage forced to fail (e.g. RegEdit busy indefinitely) and confirm every OTHER stage still runs to completion regardless (reproduces the confirmed zero-early-return design)"

  - class: pimSessionInfo
    full_detail: true
    doc: docs/classes/pimSessionInfo.md
    purpose: "Top-level session state: entitlement collection, license/security context, generic property bag"
    depends_on: [pimXmlFile, pimInterrogator, pimLicenseSource, pimConvert, pimEntitlement, pimAuthDlg]
    called_by: ["pim/pim_src/pimTop.cxx (primary driver)", "pim_ui dialogs (read/write properties and entitlements)", "pimEntitlement (via pimGetSessionInfo() back-reference)"]
    risk_level: HIGH
    risk_rationale: >
      Single instance per run; every module reads/writes its property bag. The
      read/write lock (thrRWLock) implies concurrent access is expected but
      locking granularity wasn't fully verified against the .cxx. A FURTHER
      PASS fully traced TryAuthorize() (pim_core_src/pimSessionInfo.cxx:1911-1984,
      a 74-line do/while credential-retry loop) and its immediate dependencies.
      CONFIRMED BUG, HIGH SEVERITY: the loop has no handling at all for
      pimAuthorizeToPTC() returning false (a transport/network failure) --
      do_continue stays true and the loop spins forever re-prompting for
      credentials it never re-validates against the server, confirmed by
      direct contrast with the sibling pimGetAvailable::GetSecurity(), which
      aborts with -3 on the identical failure. CONFIRMED BUG: a matching
      pimXmlFile leak -- pimAuthorizeToPTC() (pim_core_src/pimPTCDotCom.cxx:651)
      unconditionally overwrites *out with a freshly allocated pimXmlFile
      without freeing the previous one, on every loop iteration where the
      server rejects the credentials. Confirmed discarded-return-value /
      stale-reused-variable pattern (the same template already found
      repeatedly elsewhere in this codebase):
      pimAuthorizeFailedMsgDirectCall(out, str)'s return value is discarded
      and str is read afterward regardless of whether the call actually
      populated it. Confirmed credential aliasing: SetSecurity()/
      GetSecurity()/DelSecurity()'s own `// HACK` comment maps the media URL
      and the PTC.com production URL to the SAME SecurityArray slot, so
      TryAuthorize()'s credential lookups/deletes alias (not merely mirror)
      pimGetAvailable::GetSecurity()'s. Verified non-issues found along the
      way: the function-local `static pimXmlFile* out` looks suspicious but
      is confirmed harmless (re-initialized to NULL's effective state via the
      do/while's own control flow, not actually carrying state across calls
      in a way that matters); SetSecurity() taking only a read lock while
      mutating is a locking-pattern inconsistency but not independently
      confirmed to be exploitable. A structurally identical, disabled
      duplicate of this exact loop exists behind #if 0 at
      pimSessionInfo.cxx:2005 onward, with its own compile-breaking
      double-declaration of str/str2 -- further confirming this project's
      recurring dead #if 0 pattern.
    modification_impact:
      - "Adding/renaming a *_PROPERTY key requires updating every string-literal call site — no compiler check catches a mismatch"
      - "Changing EntitlementArray/InstalledArray semantics affects every consumer that calls GetEntitlement/DropEntitlement"
      - "Changing LicenseStatus enum values/ordering affects GetStatusTranslateMsg and every UI license-status display"
      - "PRIORITY: fix TryAuthorize() to treat pimAuthorizeToPTC() returning false as a fatal/abort condition (matching pimGetAvailable::GetSecurity()'s -3 handling) before shipping any change that touches this retry loop -- as written, a network/transport failure hangs the loop forever"
      - "Any fix to the pimXmlFile leak must free the previous *out before pimAuthorizeToPTC() reassigns it, not just on the success path"
      - "Do not assume SetSecurity()/GetSecurity()/DelSecurity() operate on distinct URL-keyed credential stores for the media URL vs the production URL -- they are confirmed aliased to the same slot"
    test_areas:
      - "Concurrent property reads while StartValidateThread()'s background thread runs"
      - "Add/Drop entitlement while other threads hold pointers into the array"
      - "Every LicenseStatus value's translated message still resolves correctly"
      - "PRIORITY: force pimAuthorizeToPTC() to fail on transport grounds (e.g. disconnect network mid-call) during TryAuthorize() and confirm whether the wizard actually hangs indefinitely rather than surfacing an error (reproduces the confirmed infinite-loop bug)"
      - "Repeatedly submit rejected credentials through TryAuthorize()'s retry loop and monitor process memory for the confirmed pimXmlFile leak"

  - class: pimXmlFile
    full_detail: true
    doc: docs/classes/pimXmlFile.md
    purpose: "Xerces-C++ DOM wrapper used for every XML document in PIM, with PROPERTY-style convenience API and explicit read/write locking"
    depends_on: [xerces_c]
    called_by: ["pimLoop (xmlPtr member)", "pimEntitlement", "pimSessionInfo", "every pim*Loop subclass", "pim/pim_src/pimTop.cxx (direct DOM manipulation)"]
    risk_level: CRITICAL
    risk_rationale: >
      CONFIRMED REAL BUG HISTORY in this exact class's own revision log: "Fixed xml
      mutex issues" (2026-06-26) and "Added temporary logs to investigate locks
      issue" (2026-04-22). This is not a theoretical risk — it has caused production
      issues before. Every other class in the codebase depends on this one for
      thread-safe XML access.
    modification_impact:
      - "Any change to PreRead/PostRead/PreWrite/PostWrite/PushReadToWrite/PopWriteToRead risks reintroducing the exact class of bug already fixed once"
      - "A locking regression here would manifest as intermittent, hard-to-reproduce corruption/deadlock across EVERY multi-threaded install (i.e., almost every real install, since each entitlement runs on its own thread)"
      - "Changing GetNextNodelistItem's stateful cursor (GNNI_nl/GNNI_index/GNNI_lastList) affects every caller doing multi-step DOM traversal"
    test_areas:
      - "Concurrent PreRead/PreWrite from multiple threads on the SAME pimXmlFile instance (e.g. one entitlement's progress-polling UI thread vs its own install thread)"
      - "PushReadToWrite/PopWriteToRead upgrade path specifically — this is the highest-risk lock transition"
      - "Kill()-mid-write scenario (pimLoop::Kill()'s WriteLockEngaged() check) — verify the lock is actually released"
      - "Long-running stress test with many concurrent entitlement threads, given the confirmed prior lock bug"

  - class: pimCopyLoop
    full_detail: true
    doc: docs/classes/pimCopyLoop.md
    purpose: "File copy + archive extraction/removal install step"
    modified_this_session: true
    depends_on: [pimLoop, btkUnzip (external, libzip-backed), pimConvert, "pim_util pimCab.h (legacy, pimCancelCopy/pimMinimumDiskUsage still used)"]
    called_by: ["pimCopier (process-wide SINGLETON via GetInstance()/GetUninstallInstance() — corrected from an earlier 'owned per-entitlement' assumption; verified directly against pimCopier.cxx)"]
    risk_level: MEDIUM
    risk_rationale: "Recently modified (CAB->ZIP at the pimInstallCab/pimRemoveCab call sites). Method naming now mismatches behavior, which is a maintainability risk for future readers, not a correctness risk by itself. Additionally, because its owner is a process-wide singleton, only one copy operation (install-side) can run at a time across the whole process."
    modification_impact:
      - "Any further archive-format change should follow the same seam (the .GetExt().ToLower() == \"zip\" check) rather than introducing a new dispatch mechanism"
      - "pim_util's legacy pimCab.cxx CAB implementation is now dead code from this call site's perspective but still compiles/links — removing it would require confirming no other caller exists"
      - "Changing this class's threading model must account for the singleton serialization above it — it is never run concurrently with another copy of the same kind by design"
    test_areas:
      - "ZIP extraction of both flat files and nested-directory archives"
      - "pimRemoveCab's relative-path-join-then-erase logic against an archive whose entries use mixed path separators"
      - "Cancel-mid-extraction via pimCancelCopy()"
      - "Two entitlements requesting a copy simultaneously — confirm the busy/retry contract on pimCopier::GetInstance()"

  - class: pimSFXLoop
    full_detail: true
    doc: docs/classes/pimSFXLoop.md
    purpose: "Runs self-extracting-executable (SFX) install payloads as child processes"
    depends_on: [pimLoop, btkProcess (external), pimConvert, pimSessionInfo]
    called_by: ["pimSFXCopier (process-wide SINGLETON, verified direct_read; shares its serialization gate with pimMSICopier -- see docs/classes/pimSFXCopier.md)"]
    risk_level: MEDIUM
    risk_rationale: "Exit-code handling diverges from pimMSILoop's for code 1618 (treated as failure here, cancellation there) -- a confirmed intentional divergence, not a bug, but a trap for anyone trying to 'unify' MSI/SFX error handling."
    modification_impact:
      - "Cancel() cannot interrupt a running child process -- only Kill() can, via a 2-second poll; changing this changes cancellation latency for every SFX-based product"
      - "The dotNetFx40_Full-specific 3010 handling is a hardcoded name match; renaming that payload in any product XML silently loses the special case"
      - "Writes to a SHARED Uninstall_all_utilities.bat file with no visible dedicated lock beyond the owning singleton's own serialization"
    test_areas:
      - "Each named exit code (0/1602/1259/1618/1637/1633/1632/1625/1619/1613/1641/1638/3010) individually, including the dotNetFx40_Full carve-out"
      - "Kill() during a running child process, confirming termination within the 2-second poll window"
      - "Uninstall_all_utilities.bat correctness after multiple SFX installs across product modes (WGM/Schematics/MKS/Creo)"

  - class: pimScriptLoop
    full_detail: true
    doc: docs/classes/pimScriptLoop.md
    purpose: "Generates/removes script files from a template+include+body composition mechanism"
    depends_on: [pimLoop, pimConvert, pimPlatformMgr, pimCommandMgr, pimSessionInfo, LocateXMLFile]
    called_by: ["pimEntitlement::InstallScripts() -- created/destroyed directly, NO singleton wrapper (one of only 2 exceptions to the singleton-owner pattern, along with pimPsfLoop)"]
    risk_level: MEDIUM
    risk_rationale: "No process-wide serialization (unlike the 7 singleton-owned Loop types), so concurrency bugs here would manifest as races BETWEEN entitlements, not just within one -- a different failure shape than most other Loop types."
    modification_impact:
      - "The hardcoded 'silentGroupUninstall' exemption in OnRollback() is a string literal, not an XML attribute -- renaming that script anywhere breaks the exemption silently"
      - "Template composition logic (INCLUDE/BODY concatenation) is duplicated in pimPsfLoop::CreatePsf -- a fix here should be checked against that class too"
      - "[LM_LICENSE_FILE]/[DCAD_TEMP]/[PARAMETRIC]/[SIMULATE] property injection changes affect every script template referencing those placeholders"
    test_areas:
      - "Multiple entitlements generating scripts concurrently (no singleton to serialize them)"
      - "Template caching correctness when consecutive <SCRIPT> nodes reference different 'source' template files"
      - "Rollback correctly skips 'silentGroupUninstall' while removing every other installed=Y script"

  - class: pimShortcutLoop
    full_detail: true
    doc: docs/classes/pimShortcutLoop.md
    purpose: "Creates/removes shortcuts at up to 5 locations (Desktop/StartMenu/ProgramsMenu/QuickLaunch/loadpoint)"
    loc: 1057
    depends_on: [pimLoop, pimConvert, "pimCreateShellLink/pimGetShellLink (external, presumed COM IShellLink wrapper)", pim_util path-resolution functions]
    called_by: ["pimShortcuts (process-wide SINGLETON, verified direct_read; its Cancel() is flag-only and does not stop this Loop -- see docs/classes/pimShortcuts.md)"]
    risk_level: MEDIUM
    risk_rationale: "Largest Loop subclass after pimEntitlement (1057 lines); a single OnInstall() interleaves parsing and 5 separate create-or-remove branches, so shared-parsing changes ripple across all 5 location types at once."
    modification_impact:
      - "Icon/icon-index are never preserved across recreation (unlike target/workdir/args) -- changing this asymmetry changes user-visible behavior on every reconfigure"
      - "Filename sanitization (illegal chars /,*,|,\\) was only confirmed present for the Programs-Menu path in this pass -- extending or fixing it elsewhere needs independent verification per location"
      - "create=Y/N + installed=Y/N 4-state toggle logic in OnInstall() governs both fresh-install AND reconfigure-time enable/disable -- a change here affects both flows simultaneously"
    test_areas:
      - "Each of the 5 location types' create AND remove paths independently"
      - "Reconfigure toggling a shortcut off (create=N with installed=Y) then back on"
      - "Product names containing /, *, |, \\ at each of the 5 locations, not just Programs Menu"
      - "allusers vs. current-user placement for each applicable location"

  - class: pimServiceLoop
    full_detail: true
    doc: docs/classes/pimServiceLoop.md
    purpose: "Creates/starts/stops/removes Windows services declared in product XML"
    depends_on: [pimLoop, "ginst_* functions (external PTC platform DLL, imp_pim_dll.h)", pimSystemCall (pim_util), pimConvert]
    called_by: ["pimServices (process-wide SINGLETON, verified direct_read; also carries the action via a class-STATIC ServiceAction field, an unusual out-of-band parameter-passing mechanism unique to this pair)"]
    risk_level: HIGH
    risk_rationale: "Confirmed concrete consumer of the previously-unidentified ginst_* imports from imp_pim_dll.h -- any investigation into that external DLL's identity should start here. UPGRADED to HIGH: pimServices' own TryLock does NOT actually serialize whole operations (confirmed early xmlMutex.Unlock() bug, see docs/classes/pimServices.md) -- a concurrent second call to pimServices::Create()/Uninstall() while this Loop is still running would delete the live Loop object out from under its own thread. The static-field action-passing mechanism is also fragile if pimServices is ever refactored."
    modification_impact:
      - "OnRollback()'s stop-then-uninstall sequence uses fixed Sleep(2)/Sleep(5) waits rather than polling actual state -- a slow-stopping service could still be mid-transition when uninstall runs"
      - "Adding a new ServiceAction requires updating both the enum on pimServices AND the switch in pimServiceLoop::OnInstall()"
    test_areas:
      - "Each ServiceAction (Install, Start, Stop) individually"
      - "A slow-to-stop service during rollback -- confirm the fixed Sleep() windows are sufficient or identify the failure mode when they aren't"
      - "Explicit XML <INSTALL_COMMAND>/<UNINSTALL_COMMAND>/<START_COMMAND>/<STOP_COMMAND> vs. the ginst_* default path, for each action"
      - "Two overlapping pimServices::Create() calls from different threads while the first's Loop is still running -- reproduce and fix the confirmed use-after-free-class race in pimServices.cxx before this is ever exercised by a real concurrent caller"

  - class: pimPsfLoop
    full_detail: true
    doc: docs/classes/pimPsfLoop.md
    purpose: "Generates a per-product PSF (license-configuration launch file) plus a .bat wrapper; meaning of the PSF acronym itself remains unconfirmed"
    depends_on: [pimLoop, pimConvert, pimXmlFile]
    called_by: ["pimEntitlement::InstallPSF() -- created/destroyed directly, NO singleton wrapper (the other of the 2 exceptions to the singleton-owner pattern)"]
    risk_level: MEDIUM
    risk_rationale: "User-added customizations in an existing PSF file are preserved across regeneration ONLY if an exact 'USER - PSF' marker string is present -- a fragile, string-matched persistence mechanism with no error surfaced on failure to match."
    modification_impact:
      - "Template composition logic is duplicated from pimScriptLoop::CreateScript -- a fix in one should be checked against the other"
      - "RemoveLogicalPsf deliberately leaves the PSF file on disk (only removes the .bat wrapper) -- any uninstall-completeness audit logic must account for this asymmetry"
      - "Changing the PTC_SUPPRESS_LMLIC_ENV suppression rule changes license-environment-variable behavior for any user who previously opted out"
    test_areas:
      - "Regenerating a PSF over an existing file containing user-added lines after the 'USER - PSF' marker -- confirm preservation"
      - "A PSF file where the marker string is missing or altered -- confirm the (currently silent) failure-to-preserve behavior"
      - "RemoveLogicalPsf vs. RemovePsf -- confirm the intended file-retention difference"

  - class: pimDownloadLoop
    full_detail: true
    doc: docs/classes/pimDownloadLoop.md
    purpose: "Downloads a product's payload files (external media, MSI, SFX, CDSECTION archives) from network to local cache"
    loc: 940
    depends_on: [pimLoop, pimEntitlement (bound via SetEntitlement), pimDownloadData, "pimIsDigitiallySignedByPTC (external)", "pimSendNRecvFromPTC/pimRecvFromPTC (network transport)"]
    called_by: ["pimDownloader (process-wide SINGLETON, verified direct_read; also called from a standalone diagnostic entry point pimTestURLDownload(), pim/pim_src/pimTop.cxx -- the only one of the 7 wrappers with a confirmed second caller)"]
    risk_level: HIGH
    risk_rationale: >
      CONFIRMED SECURITY-RELEVANT FINDING: TestDigitialSignature() calls
      pimIsDigitiallySignedByPTC but ALWAYS returns true regardless of the result --
      the only failure-path logging is gated behind ERROR_ON_UNSIGNED, which is not
      #define'd anywhere in this archive (grepped, confirmed absent, same pattern as
      ROLLBACK_CANCELLED_INSTALL). Downloaded .exe/.cab files are not actually
      blocked for failing signature verification in this build. Also has an
      overridden Execute(const btkFSEntry&) that bypasses pimLoop::Execute()'s
      Errors/Warnings-clearing logic.
    modification_impact:
      - "Enabling real signature enforcement requires changing TestDigitialSignature's return value AND verifying every call site actually acts on a false return (not confirmed as currently happening even if it returned false)"
      - "OnExecute()'s per-category (External Media -> MSI -> SFX -> CDSECTION) sequential processing means a change affecting one category's error handling should be checked against the explicit '// TODO handle TIMEOUT/ERRORS' gap in the others"
      - "The custom Execute(const btkFSEntry&) override means this class does not get pimLoop::Execute()'s Errors/Warnings reset -- reusing an instance across multiple downloads (not the observed pattern, but not prevented) would leak stale state"
    test_areas:
      - "A downloaded .exe/.cab that FAILS pimIsDigitiallySignedByPTC -- confirm current behavior is 'silently proceeds' before changing anything security-related here"
      - "Download timeout/network error in each of the 4 categories -- confirm the abort-with-no-retry behavior matches the '// TODO' comment's acknowledged gap"
      - "Progress percentage accuracy when DownloadSize is known vs. unknown (falls back to DownloadUnits/file-count)"

  - class: pimCopier
    full_detail: true
    doc: docs/classes/pimCopier.md
    purpose: "Process-wide SINGLETON owner-wrapper around pimCopyLoop; the reference implementation for the whole 7-class wrapper family"
    depends_on: [pimCopyLoop, pimConvert, pimXmlFile]
    called_by: ["pimEntitlement::StartCopy() (GetInstance(), install-copy)", "pimEntitlement's uninstall/rollback path (GetUninstallInstance())"]
    risk_level: MEDIUM
    risk_rationale: "TWO independent singleton instances (OnlyCopier/OnlyUninstallCopier) -- a caller confusing GetInstance() with GetUninstallInstance() would silently operate on the wrong lock/Loop pair with no compiler check. Cancel() calls the owned Loop's Cancel() without a NULL guard -- a structural (currently unexercised) crash risk."
    modification_impact:
      - "Changing Copy_low()'s lock-hold duration would change the class-wide 'one copy at a time' guarantee that docs/ai-context/ownership.yaml's concurrency_implication_summary depends on"
      - "Pause()/Resume() are flag-only and do not call anything on the owned pimCopyLoop -- confirm no caller actually relies on them pausing the copy thread before changing their semantics"
      - "pctMutex and InMemoryXML are confirmed dead members -- safe to remove, but verify no out-of-archive caller reaches into them via friend/reflection-like access first"
    test_areas:
      - "Concurrent install-copy and uninstall-copy (should run in parallel, on separate singletons)"
      - "Two install-copies requested back to back -- confirm the busy/retry contract"
      - "Cancel() called when no copy is in progress (CopyLoop is NULL) -- currently a null-pointer dereference risk, not observed triggered by any traced caller"

  - class: pimMSICopier
    full_detail: true
    doc: docs/classes/pimMSICopier.md
    purpose: "Process-wide SINGLETON owner-wrapper around pimMSILoop, driving Windows Installer package installs"
    depends_on: [pimMSILoop, "pimOKToRunMsiexec/pimFreeMsiexec (pim_util, SHARED with pimSFXCopier)", pimConvert, pimSessionInfo]
    called_by: ["pimEntitlement (sole call site, pimEntitlement.cxx:5295)"]
    risk_level: CRITICAL

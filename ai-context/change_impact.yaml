      4 corresponding child elements are independently optional per
      shortcut, SetShortcutState() can legitimately return false for a
      CORRECTLY IDENTIFIED shortcut simply because that one specific
      location option was never offered by Eb's template -- and none of
      the 4 array-index call sites check this return value, fix or no fix.
      Same silent, non-crashing, by-design ceiling as the Program-Menu
      bug's own fix, now confirmed to span all 4 location toggles instead
      of 1.
      VERIFIED NON-ISSUE, found while tracing this same call chain:
      A_shtcuts.GetShortcutInfoByID(A_wants[i], unused, unused, sm, pm, dt, ql)
      also discards its own bool return, and sm/pm/dt/ql are declared once,
      outside the loop -- the same shape as the confirmed-live Program-Menu
      and <PROPERTY>-copy staleness bugs elsewhere in this file. Traced
      GetShortcutInfoByID()'s implementation to confirm this instance is
      NOT reachable: it fails only when FindShortcutNode(id) finds no node,
      but A_wants[i] is sourced from A_shtcuts.GetAllShortcutIDs() scanning
      the SAME document by the SAME id attribute FindShortcutNode() matches
      on, so the node is always found. This call site's design is also
      more defensive than its Program-Menu sibling: on success, all 4
      output booleans are unconditionally reset to false BEFORE the
      child-scan, so an absent child yields a correct false rather than a
      carried-over stale value -- the exact safeguard GetShortcutProgramMenu()
      omits.
      ADJACENT PRE-EXISTING RISK, found in the same trace, unrelated to and
      not introduced by the array-index fix: GetAllShortcutIDs()
      (pim_ui/pim_ui_src/pimShortcutMgr.cxx:312-313) dereferences its id
      attribute node's getNodeValue() with no null check -- a latent crash
      if any <SHORTCUT> node in either document ever lacks an id attribute.
      This underlies both A_wants and B_avail alike, so it is a shared
      precondition of this entire function's algorithm.

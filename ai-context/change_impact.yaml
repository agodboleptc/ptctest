  - class: pimEntitlementTree
    full_detail: true
    doc: docs/classes/pimEntitlementTree.md
    module: pim_ui
    purpose: "The checkbox tree driving the wizard's Applications selection/reconfigure step, grouped into runtime-discovered per-family nodes"
    loc: 2323
    depends_on: [pimSessionInfo, pimEntitlement, pimInstallMgrDlg, pimGetMediaDetails, pimTranslateMgr, pimCustomDlg]
    called_by: ["pim_ui/pimEntitlementRefresh.cxx (~35 call sites; pimInstallMgrDlg's EntitlementRefresh()/EntitlementRefresh_low()/EntitlementRefresh_update*() family; read in full in a later pass, see pimInstallMgrDlg's own entry above)", "pim_ui/pimInstallMgrActions.cxx:1436 (single UpdateDisplay(NULL) call)"]
    risk_level: HIGH
    risk_rationale: >
      CONFIRMED BUG (highest severity for this class): OnOptionMenuSelect()
      (pim_ui_src/pimEntitlementTree.cxx:1875-1881) calls
      eptr_new_xml->SetXml(E->GetTag()) unconditionally, immediately after an
      `if (eptr_new_xml)` guard that covers only the 2 preceding lines --
      MD.GetProductXml() returning NULL for the selected media ID crashes the
      installer with a null-pointer dereference. The function's own later
      code (`if (E && new_xml && eptr_new_xml)`) proves the author knew this
      pointer could be NULL, but that check comes after the unconditional
      dereference already executed. CONFIRMED BUG #2:
      ReconfigureDisplay_low()'s only_one branch (line 1519-1520) strips one
      character too many from the computed family-group node id
      ("_Creo_app" -> "_Cre" instead of "_Creo"), confirmed by contrast with
      the correctly-computed sibling extraction in UpdateGroupStatus() in the
      same file -- reachable whenever UpdateDisplay(NULL) runs in reconfigure
      mode with exactly 1 entitlement in the tree. This class is also the
      confirmed 2nd call site for pimCustomDlg (via its per-row "customize"
      icon in OnPushButtonActivate(), which resolves but never forwards the
      clicked row's entitlement -- see pimCustomDlg's own entry above), and
      tracing its callers surfaced a previously-uncatalogued 3rd .cxx file
      for pimInstallMgrDlg's own method bodies, pim_ui_src/pimEntitlementRefresh.cxx
      (1,514 lines, at the time not itself traced in depth -- since read in
      full in a later pass and folded into pimInstallMgrDlg's own entry
      above, which found 4 further confirmed bugs there). Lower-severity confirmed
      findings: 3 of the 7 PIM_SHOW_* column flags are hardcoded to 0
      (permanently dead regardless of caller flags); no explicit destructor
      or AgentHandler unregistration (low practical severity, short-lived
      installer process); GetPrerequisiteSizeRequired() accumulates without
      zeroing its own output parameter (both confirmed callers pre-zero
      correctly, but the contract is unenforced). ENRICHMENT (found while
      documenting pimGetMediaDetails itself): a full read of
      pimGetMediaDetails::GetProductXml() confirms exactly which conditions
      make the CONFIRMED BUG above reachable -- no <url> entry matching the
      requested filename, or 2 consecutive -418 timeouts -- and surfaced a
      confirmed-dead near-duplicate of the identical unconditional-dereference
      pattern inside uiApplicationsList::OnOptionMenuSelect()
      (pim_ui_src/pimInstallMgrActions.cxx:1806-1858, wrapped in #if 0 along
      with the rest of that disabled class's method bodies) -- see
      pimGetMediaDetails's own entry below. CORRECTION, found while giving
      pimTranslateMgr its own dedicated pass: OnOptionMenuSelect() actually
      contains this SAME unconditional-dereference shape 3 TIMES, not once
      -- at :1875-1881 (the "this application changed" arm, already
      documented above) and again at :1940-1946 and :1982-1988 (the
      "sibling"/"parent" media-ID-bump arms) -- 3 near-identical
      `eptr_new_xml = MD.GetProductXml(...); if (eptr_new_xml) {...}
      eptr_new_xml->SetXml(...);` sequences in the same function, each with
      the identical unconditional-dereference gap. A further, distinct
      finding from that same pass: only the FIRST of these 3 arms is
      correctly wired for `pimTranslateMgr`'s own file-scoped translation
      matching -- see the pimTranslateMgr entry below and
      docs/classes/pimTranslateMgr.md's Risk Analysis for the confirmed
      mismatched-guard bug this asymmetry triggers.
    modification_impact:
      - "PRIORITY: fix the eptr_new_xml->SetXml() unconditional dereference in OnOptionMenuSelect() -- move it inside the `if (eptr_new_xml)` guard (or add an early return) before relying on the version/shipcode dropdown for any product not already locally cached; apply the same fix to all 3 occurrences (:1881, :1946 via aPtr->Init(), :1988 via aPtr->Init()), not just the first"
      - "Fix ReconfigureDisplay_low()'s only_one branch: GetLength()-5 should be GetLength()-4 to correctly strip the 4-character \"_app\" suffix"
      - "A new hardcoded product-tag special case (matching the creoviewexpress.xml/mathcadpdsi.xml/ar_plugin_*/WGM pattern) must be added directly in UpdateDisplay_low()'s if/else-if chain -- there is no data-driven mechanism, and ReconfigureDisplay_low() has no equivalent cluster at all (not confirmed whether that asymmetry is intentional)"
      - "pimEntitlementRefresh.cxx's EntitlementRefresh()/EntitlementRefresh_low() have since been read in full and are documented on pimInstallMgrDlg's own entry above, including a confirmed hang bug in the School/Beta trial-license wait loops -- consult that entry before modifying either function"
    test_areas:
      - "PRIORITY: change a row's version/shipcode dropdown selection for a product not already locally known, in a test harness where pimGetMediaDetails::GetProductXml() can be made to return NULL -- confirm the crash (reproduces the confirmed null-dereference bug)"
      - "Start a reconfigure session with exactly 1 entitlement and confirm whether the family-group checkbox ends up checked and insensitive as UpdateDisplay()'s only_one path intends (reproduces the confirmed off-by-one bug)"
      - "Toggle a family-group checkbox and confirm the correct children (and, in WGM mode, the correct parent) update consistently across UpdateDisplay_low()/UpdateDisplay_finish()/SetSelectionStatus()"

  - class: pimFrictionlessTrialDlg
    full_detail: true
    doc: docs/classes/pimFrictionlessTrialDlg.md
    module: pim_ui
    purpose: "The UI for pim_rl.exe's Frictionless/Commercial Trial license-retrieval flow: shows host ID/SCN/application name and drives a background FLEXnet license-retrieval worker to fetch (or, in cleanup mode, remove) a trial license"
    loc: 410
    depends_on: [pimSessionInfo, "pimFrictionlessTrialLicenseGet (read in full for this pass, not its own class doc)", pimPTCLicenseGet, "pimGetInHouseMode/pimSetInHouseMode (pim/pim_src/pimGeneralInit.cxx)"]
    called_by: ["pim/pim_src/pimTop.cxx:1094 (pimFrictionlessTrialRun(), a dedicated top-level Run entry point -- the ONLY confirmed construction site anywhere in this archive)"]
    risk_level: CRITICAL
    risk_rationale: >
      CONFIRMED HIGH-SEVERITY BUG, the single highest-severity finding among
      the pim_ui classes documented so far: for the only confirmed real usage
      of this class (pimFrictionlessTrialRun(), which always calls
      pimSetInHouseMode(1) or pimSetInHouseMode(2) -- the exact 2 values
      Display() checks for -- immediately before Display()), Display()
      (pim_ui_src/pimFrictionlessTrialDlg.cxx:265-270) calls
      FrictionlessLicenseGenerate() (which XNew's a
      pimFrictionlessTrialLicenseGet/pimPTCLicenseGet worker, calls
      ->Execute() to start its background pimLoop-based FLEXnet operation,
      and arms a 1-tick LicenseGenerateTimer) and then blocks on a raw
      Sleep(60000) instead of calling uiDialog::Activate() -- the modal event
      loop that would actually deliver timer ticks. Because Activate() never
      runs, LicenseGenerateTimer never fires, so OnTimerExpired() -- the ONLY
      call site anywhere in this codebase for
      pimFrictionlessTrialLicenseGet::HeartBeat(), confirmed by an
      archive-wide grep -- is never invoked. HeartBeat()'s own body
      (pim_ui_src/pimFrictionlessTrialLicenseGet.cxx:84-427) is where the
      retrieved license text is parsed, saved to disk, registered via
      pimSessionInfo::AddLicenseSource(), and used to update/remove the
      local PSF via pimUpdatePSF()/pimRemovePSF() -- NONE of that completion
      logic ever executes in the confirmed real usage. The background
      network operation may complete within the 60-second sleep, but its
      result is never read, saved, or applied, AND the freshly-XNew'd worker
      object is never deleted (only OnTimerExpired() frees it) -- a
      confirmed memory leak stacked on top of the functional bug.
      Display() unconditionally returns true regardless of what actually
      happened. Lower-severity confirmed findings: OnTimerExpired()'s
      `static int in_timer` reentrancy guard is checked but never set true
      (dead, though moot given the above); SetURL()/the URL member,
      GetAuth(), and the private Refresh() method all have zero confirmed
      callers anywhere in this archive (contrast GetAuth() with its 2
      sibling implementations on pimAuthDlg/rpimDlg, which ARE called); and
      a file-scope `frictionlessDlg` static self-pointer is set in the
      constructor but has no accessor function and is never read (a 3rd,
      never-completed instance of the "static self-registering pointer"
      idiom also seen on pimInstallMgrDlg's MainUIDialog and pimAuthDlg's
      AuthDialog).
    modification_impact:
      - "PRIORITY: fix Display()'s in-house-mode branch to actually process LicenseGenerateTimer ticks (e.g. call uiDialog::Activate() instead of/in addition to Sleep(60000), or otherwise poll HeartBeat() directly) before relying on frictionless/commercial trial license retrieval actually completing and persisting"
      - "Any change to the FrictionlessLicenseGenerate()/OnTimerExpired() pairing must re-verify that the armed timer actually gets a chance to fire under the caller's real Display() code path -- do not assume arming a uiTimer alone is sufficient"
      - "Do not extend SetURL()/GetAuth()/Refresh() assuming they are wired into anything -- confirm a real caller exists first, since all 3 are currently confirmed dead for this class"
    test_areas:
      - "PRIORITY: run the frictionless/commercial trial flow end-to-end (pim_rl.exe -frictionless_reg or -trial_reg) and confirm whether a license .dat file actually appears on disk and the PSF is actually updated after Display() returns (reproduces the confirmed no-op completion bug)"
      - "Trigger a license-retrieval error (e.g. bad SCN) in this flow and confirm whether the user ever sees the mapped error message NoteInfoLabel/ProcessingLabel text sets, given Activate() never runs to display it"
      - "Confirm whether pim_rl.exe's real command line ever passes an argv[6] value other than -frictionless_reg/-trial_reg for this entry point -- if so, the interactive Activate() path would run instead, changing this finding's reachability"


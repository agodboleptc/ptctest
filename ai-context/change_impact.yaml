      - "Re-enabling IsEligibleForInstall()'s commented-out installed=\"Y\" skip (pimMSILoop.cxx:953-958) would close most of the fallback bug's re-install exposure as a side effect -- do both together"
      - "Changing the exit-code table must be applied in BOTH ProcessErrorCode(int,...) (used by pimMSIExec()) AND OnInstall()'s own separate, hand-duplicated if/else if chain -- these are two independently maintained copies of the same mapping"
      - "OnFailure()'s <PACKAGE install=\"N\"> side effect persistently changes install selection state — a change here affects retry/resume behavior"
      - "Note the CONFIRMED divergence from pimSFXLoop's treatment of exit code 1618 (cancel here, failure there) -- do not 'unify' without checking docs/classes/pimSFXLoop.md's Risk Analysis first"
      - "CreateBatchFileUninstallEntry() is called only from pimMSIExec() -- OnInstall()'s API-installed packages never get an uninstall-batch entry, regardless of product mode; any fix assuming symmetry between the two strategies is wrong"
    test_areas:

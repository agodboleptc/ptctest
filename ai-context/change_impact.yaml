  - class: pimGetMediaDetails
    full_detail: true
    doc: docs/classes/pimGetMediaDetails.md
    module: pim_core
    purpose: "Process-wide singleton cache/fetcher for PTC.com media 'details' XML (display info plus per-file download URLs) and the product-definition XML files it references -- the shared lookup every web-media download path in this codebase uses"
    loc: 276
    depends_on: [pimXmlFile, pimDownloadData]
    called_by: ["pim_ui/pimEntitlementTree.cxx:1850 (OnOptionMenuSelect() -- confirmed source of the NULL reaching that function's already-documented null-pointer-dereference bug)", "pim_core/pimEntitlement.cxx:1163,1290 (Init()'s prerequisite loop; UpdateMediaUrls(), the CORRECT comparison case for the GetProductXml() retry bug below)", "pim_ui/pimInstallMgrActions.cxx:1824 (uiApplicationsList::OnOptionMenuSelect() -- confirmed dead, wrapped in #if 0 along with the rest of that class's method bodies)", "pim_core/pimCustomActions.cxx:1657 and pim_core/pimFlexAdminInstall.cxx:598 (direct GetDetails() calls, not read in depth)", "pim_core/pimGetAvailable.cxx:481 (OnExecute())", "pim_core/pimLocate.cxx (LocateXMLFile()/LocateTranslationFile(), 2 call sites each, matching pimGetAvailable's already-documented fallback shape)"]
    risk_level: HIGH
    risk_rationale: >
      CONFIRMED, HIGH SEVERITY: GetDetails()'s cache-hit fast path
      (`if (idx != -1 && !refresh) return DetailRecords[idx];`) returns with
      NO Mutex lock at all, while every path that mutates DetailRecords (the
      cache-miss fetch-and-append path, and the refresh fetch-and-Replace()
      path) does so under Mutex. This singleton is confirmed called from
      both the UI thread (pimEntitlementTree.cxx, pimInstallMgrActions.cxx)
      and at least one background pimLoop thread
      (pimGetAvailable::OnExecute()) -- a genuine, structurally possible
      cross-thread race, not merely theoretical. CONFIRMED:
      GetProductXml()'s single-retry-on-timeout path refreshes the details
      cache (logging "Replacing download URLs for : ...") but then retries
      with the SAME pre-refresh URL string extracted before the refresh --
      the refresh's own stated purpose is never acted on. Confirmed by
      direct contrast with pimEntitlement::UpdateMediaUrls()
      (pimEntitlement.cxx:1284-1320), which performs the identical
      "refresh on timeout" operation but DOES call UpdateUrls(new_xml,
      UrlRoot) to apply the refreshed data before use. CONFIRMED, severity
      UNKNOWN: that same retry path also calls DetailRecords.Replace() a
      2nd time on the same index with the identical pointer GetDetails()'s
      own internal refresh call already stored there -- redundant at
      minimum, and depending on dsXArray::Replace()'s unconfirmed (external,
      not in this archive) ownership contract, potentially a
      double-free/dangling-pointer bug if Replace() unconditionally deletes
      the slot's existing element before inserting. CONFIRMED, directly
      relevant to an existing finding: GetProductXml()'s NULL-return
      conditions (no matching <url> entry; 2 consecutive -418 timeouts) are
      the exact, concrete source of the NULL that reaches
      pimEntitlementTree::OnOptionMenuSelect()'s already-documented
      unconditional-dereference crash (see that class's own entry above).
      Tracing this class's callers also surfaced a confirmed-dead
      near-duplicate of that exact bug pattern inside
      uiApplicationsList::OnOptionMenuSelect() (pimInstallMgrActions.cxx:1806-1858),
      wrapped in #if 0 along with the rest of that disabled class's method
      bodies (pimInstallMgrActions.cxx:1672-2019) -- strong evidence the bug
      predates pimEntitlementTree rather than being unique to it.
    modification_impact:
      - "PRIORITY: add a Mutex.Lock()/Unlock() around GetDetails()'s cache-hit fast path before relying on this cache being read concurrently from more than one thread"
      - "Fix GetProductXml()'s timeout-retry path to re-derive the download URL from the freshly-refreshed details document before retrying, instead of reusing the stale pre-refresh URL string"
      - "Remove the 2nd, redundant DetailRecords.Replace() call in GetProductXml()'s retry path (GetDetails(refresh=true) already performs this replace internally) -- or confirm dsXArray::Replace()'s ownership contract first if keeping it for any reason"
      - "Any fix to OnOptionMenuSelect()'s null-deref bug in pimEntitlementTree should also address the confirmed-dead but structurally identical copy in uiApplicationsList, in case that class is ever revived"
    test_areas:
      - "PRIORITY: call GetDetails() for a cache-hit read on one thread while a refresh (GetDetails(..., true) or the GetProductXml() retry path) runs concurrently on another thread -- confirm whether the reader can observe a mid-mutation DetailRecords array (reproduces the confirmed unlocked-read bug)"
      - "Force a -418 timeout on a GetProductXml() download and confirm whether the retry actually succeeds against a genuinely refreshed URL, or silently retries the same expired one"
      - "Trigger GetProductXml() returning NULL (e.g. request a filename with no matching <url> entry in a cached details document) from pimEntitlementTree::OnOptionMenuSelect() and confirm the crash (reproduces the already-documented bug via its now-confirmed root cause)"

  - class: pimGetApplicationsList
    full_detail: true
    doc: docs/classes/pimGetApplicationsList.md
    module: pim
    purpose: "NOT A CLASS -- a free-function group (pimGetApplicationsList/pimAddApplicationsToList/IsApplicationInInstallList) plus pimCommandLineArgs' -APPLICATIONS/-XML/-XMLALL/-FLEX handling, sharing a file-scope static StringXArray (applications_list) that limits or directly specifies which product XML files a silent/scripted install should process"
    loc: 130
    loc_note: "pim/includes/pimGeneralInit.h (130+ lines, only the 4 traced declarations annotated) + pim/pim_src/pimGeneralInit.cxx (only lines 88, 113-146, 214-262, 474-494 read directly; the rest of this 500+-line command-line/init file was not read in full)"
    depends_on: []
    called_by: ["pim_core/pim_core_src/pimGetAvailable.cxx:373 (pimGetAvailable::OnExecute(), exact-match filter on web-fetched entitlement tags -- see pimGetAvailable's own entry above)", "pim/pim_src/pimTop.cxx:390 (a local/physical-image entitlement-loading routine, exact-match filter on locally-discovered CD-image XML file tails)", "pim/pim_src/pimTop.cxx:904-966 (InstallPreReqSilent(), called from the silent-install path at :1780 -- CONFIRMED BUG, uses only .GetSize())", "pim/pim_src/pimTop.cxx:1425-1499 (pimSilentInstallFromXML(), treats every entry as a filesystem path -- the one confirmed call site whose usage matches -XML/-XMLALL's format)", "pim/pim_src/pimTop.cxx:1282-1316 (AddMandatoryAppsForSilentInstall(), the sole mandatory-apps injection point for every silent install reaching it -- CONFIRMED, corrected in a later pass: qualityagent.xml's injection is NOT actually unconditional, it is nested inside creobase.xml's existence check; no header declares this function anywhere in this archive, so no Doxygen patch exists for it)"]
    risk_level: HIGH
    risk_rationale: >
      CONFIRMED BUG, HIGH SEVERITY: InstallPreReqSilent()
      (pim/pim_src/pimTop.cxx:904-966) calls pimGetApplicationsList() into
      AskedToInstallThisList, then uses ONLY `AskedToInstallThisList.GetSize()`
      as the loop bound for iterating `pimGetSessionInfo()->GetEntitlement(i)`
      -- a completely unrelated array -- with AskedToInstallThisList's actual
      content never read anywhere in the function. CORRECTED in a later,
      dedicated pass on AddMandatoryAppsForSilentInstall() itself: the
      original framing here ("commonly EMPTY, since these are optional") was
      too strong for the one real call path -- AddMandatoryAppsForSilentInstall()
      always runs before InstallPreReqSilent() and unconditionally attempts
      to inject creobase.xml (and, if present, qualityagent.xml), so the list
      is typically non-empty; it is only actually empty when no
      application-limiting flag was passed AND the media has no creobase.xml
      at all. The real, more precisely confirmed consequence is a SIZE
      MISMATCH between this list and the entitlement count, not usually a
      fully empty list -- see the 2 new findings below for exactly how that
      mismatch arises. CONFIRMED BUG: the shared applications_list this
      function family operates on is populated in 2 INCOMPATIBLE formats
      depending on which command-line flag is used -- -APPLICATIONS stores
      bare tags (e.g. "creobase.xml"), while -XML/-XMLALL store full
      filesystem paths. Of the 3 confirmed consumers: pimGetAvailable::OnExecute()
      and pimTop.cxx:390's local-image loader both filter via EXACT match
      (StringXArray::Find()), which can never match a full-path entry against
      a bare tag/tail -- any use of -XML/-XMLALL (or simply running any
      silent install whose media has creobase.xml, since the mandatory-app
      injection then adds path entries) breaks these 2 filters, in the worst
      case trimming every entitlement. Only IsApplicationInInstallList()'s
      substring search (.Pos()) is format-agnostic. pimSilentInstallFromXML()
      correctly treats every entry as a path (aFile.Exists()/CanRead()) --
      the one consumer whose format assumption is actually consistent with
      what -XML/-XMLALL produce.
      CONFIRMED BUG (found in a dedicated pass on
      AddMandatoryAppsForSilentInstall() itself, pim/pim_src/pimTop.cxx:1282-1316):
      qualityagent.xml's "mandatory" injection is silently conditional on
      creobase.xml existing on the same media -- its entire injection block,
      including its own independent qualityagent.xml Exists() check, is
      nested inside `if (creobaseXml.Exists())`. On any media shipping
      qualityagent.xml without creobase.xml, quality agent is silently NOT
      auto-installed, contradicting both this function's name and the
      "Mandatory Installation of Quality Agent" intent recorded independently
      in pimGeneralInit.h's and pimTop.cxx's own 13-Aug-26 changelog entries
      ($$34/$$148). Likely an unintentional nesting mistake, not a deliberate
      dependency.
      CONFIRMED BUG (found in the same pass): -allpacks mode's utility-XML
      entries are appended only to pimSilentInstallFromXML()'s own LOCAL
      AskedToInstallThisList (pimTop.cxx:1430-1474), never via
      pimAddApplicationsToList(), so they never reach the shared
      applications_list InstallPreReqSilent() later re-reads independently
      (pimTop.cxx:913) -- every -allpacks-added utility entitlement's
      prerequisites are silently never checked. This is the concrete,
      narrower mechanism behind the loop-bound bug's size mismatch in this
      call path (no out-of-range GetEntitlement(i) access results, since the
      -allpacks entries are appended after the flag/mandatory ones in
      creation order -- but a larger-than-entitlement-count list is not ruled
      out in a future call path, and pimSessionInfo::GetEntitlement(int)
      (pim_core_src/pimSessionInfo.cxx:776-782) returns NULL out of range
      with no NULL check at its InstallPreReqSilent() call site -- a latent
      crash risk, not a demonstrated live bug).
      CONFIRMED STRUCTURAL RISK (found in a later, dedicated pass on
      IsApplicationInInstallList() itself), opposite direction from the bug
      above: its substring search (.Pos(), not exact match) -- while
      confirmed the one consumer robust to the bare-tag-vs-full-path format
      split -- can itself false-positive whenever one product's filename is
      a literal substring of another entry already in applications_list
      (e.g. a hypothetical "newcreobase.xml" entry would make a check for
      "creobase.xml" return true even though "creobase.xml" itself was never
      requested). Checked pairwise against the 3 real confirmed arguments
      used in this codebase today (CREO_BASE_XML="creobase.xml",
      CREO_BASE_XML_INSTALLED="creobase.p.xml",
      QUALITY_AGENT_XML="qualityagent.xml") -- none collides, so this is a
      confirmed structural risk, not a demonstrated live bug.
    modification_impact:
      - "PRIORITY: fix InstallPreReqSilent()'s loop bound to use pimGetSessionInfo()->GetEntitlementSize() (the actual entitlement count) instead of AskedToInstallThisList.GetSize() -- as written, prerequisite installs are silently skipped whenever no application-limiting flag was passed"
      - "Do not add a new exact-match consumer of pimGetApplicationsList()'s result without first normalizing applications_list's format (bare tag vs. full path) -- follow IsApplicationInInstallList()'s substring-match convention instead if format-agnostic behavior is needed"
      - "Any change to -XML/-XMLALL's path format or -APPLICATIONS' bare-tag format must be checked against all 3 confirmed matching consumers (2 exact-match, 1 substring, 1 path-existence-check), not just the one being modified"
      - "Before adding any new application tag/filename to this codebase, check it is not a substring of (nor contains as a substring) any existing tag already reachable via applications_list -- IsApplicationInInstallList()'s substring match has no safeguard against this"
      - "Fix qualityagent.xml's injection in AddMandatoryAppsForSilentInstall() to check qualityagent.xml's own existence independently of creobase.xml's -- as written, a media without creobase.xml never gets quality agent auto-installed either, contradicting the function's own name and its changelog's stated intent"
      - "Route -allpacks' utility-XML entries through pimAddApplicationsToList() (not a raw AskedToInstallThisList +=) so they are visible to InstallPreReqSilent()'s later independent pimGetApplicationsList() call -- as written, their prerequisites are never checked"
    test_areas:
      - "PRIORITY: run a silent install with NO -APPLICATIONS/-XML/-XMLALL/-FLEX flag AND a media image with no creobase.xml, and confirm whether InstallPreReqSilent() actually attempts to satisfy any unsatisfied prerequisites (reproduces the confirmed empty-list-skips-the-loop bug in its actual, narrower trigger condition)"
      - "Run a silent install from media that ships qualityagent.xml but not creobase.xml, and confirm quality agent is NOT auto-installed despite AddMandatoryAppsForSilentInstall()'s name (reproduces the confirmed creobase-gates-qualityagent bug)"
      - "Run a silent install with -allpacks and confirm InstallPreReqSilent() never attempts to satisfy prerequisites for any of the utility-XML entitlements it added beyond the flag/mandatory-driven ones (reproduces the confirmed -allpacks-invisible-to-InstallPreReqSilent bug)"
      - "Run a silent install via -XMLALL pointing at the same directory pimTop.cxx:390's local-image loader scans, and confirm whether any entitlements survive the exact-match LimitToThisList.Find() filter (reproduces the confirmed format-mismatch bug)"
      - "Confirm pimSetProductMode(PIM_FLEXONLY_MODE)'s FLEX_ADMIN_XML/FLEX_LMGRD_XML seeding behaves identically regardless of whether -FLEX appears before or after -APPLICATIONS/-XML/-XMLALL on the command line (order-dependent observation, confidence lower than the bugs above)"
      - "Add an application tag that is a substring of an existing one already reachable via applications_list (e.g. a hypothetical 'newcreobase.xml' alongside 'creobase.xml') and confirm IsApplicationInInstallList() false-positives on the shorter tag (reproduces the confirmed substring-match structural risk; no such collision exists among the 3 real tags used in this archive today)"

  - class: pimAvailableProduct
    full_detail: true
    doc: docs/classes/pimAvailableProduct.md
    module: pim_core
    purpose: "Small value object (one discovered web-media product's identity plus parallel version/shipcode and media-ID arrays) and its keyed collection pimGetAvailableProducts, both used internally by pimGetAvailable to accumulate PTC.com availability-feed results"
    loc: 163
    loc_note: "CORRECTION/PROMOTION: originally documented only as a brief 'companion' inside pimGetAvailable's own entry (both files were already read in full at that time). Promoted to its own full-depth entry when a dedicated pass over AddInstance() surfaced a confirmed bug the lighter companion treatment missed."
    depends_on: [pimGetAvailable]
    called_by: ["pim_core/pim_core_src/pimGetAvailable.cxx:430-436 (Create()/AddInstance(), once per <ENTITLEMENT> node in a media's image.xml)", "pim_core/pim_core_src/pimGetAvailable.cxx:476,483-486 (Sort(); GetSize()/operator[] iterating every discovered product)", "pim_core/pim_core_src/pimGetAvailable.cxx:644-648,168-176 (pimGetAvailable::GetSize()/GetShipcodeOptions()/GetAssociatedMediaIDs() forward directly to this collection)"]
    risk_level: MEDIUM
    risk_rationale: >
      CONFIRMED BUG: pimAvailableProduct::AddInstance(const char *V, const
      char *shipcode, const char *media_id) never references its own
      `shipcode` parameter. It builds and dedups its VerShipcodes entry from
      `V` (the bare version string) alone -- `VerShipcodes.Find(V)` -- despite
      the member being named VerShipcodes (implying a combined
      version+shipcode identifier) and Sort() using a comparator literally
      named pimCompareVerShipcode. Confirmed consequence: if the same product
      version is discovered under 2 different shipcodes (e.g. 2 regional/
      licensing SKUs sharing a version number, each with its own media ID),
      the 2nd AddInstance() call is treated as a duplicate of the 1st and its
      media_id is silently dropped -- since GetVerShipcodes()/GetMedia() feed
      pimEntitlementTree's version/shipcode dropdown (via pimGetMediaDetails),
      the practical effect is a shipcode option silently missing from that
      dropdown. Also confirmed, low practical severity: every
      pimAvailableProduct* created by Create() is never freed
      (~pimGetAvailableProducts() is empty) -- a 3rd instance of the same
      leak-per-web-media-search pattern already confirmed in
      pimGetAvailable::OnExecute() itself (ImageXml/ProductDefinitionXml).
      CONFIRMED DEAD CODE (found in a later, dedicated pass on Print()):
      pimAvailableProduct::Print() and pimGetAvailableProducts::Print()
      (which fans out to it) have zero live callers anywhere in this
      archive -- an exhaustive grep for .Print( across pim/, pim_core/, and
      pim_ui/ finds exactly 2 matches, both commented out
      (pimGetAvailable.cxx:474,478), plus one unrelated Test.Print() call on
      a different object in pimTop.cxx:3042. pimDbgLog, the argument these
      dead calls would pass, is itself referenced nowhere else in this
      codebase outside those same disabled debug-print lines.
    modification_impact:
      - "PRIORITY: fix AddInstance() to build a combined version+shipcode key (incorporating the shipcode parameter) for both the dedup check and the stored VerShipcodes entry -- confirm this matches whatever format the external pimCompareVerShipcode() comparator expects before changing it"
      - "Do not assume VerShipcodes uniquely identifies a (version, shipcode) pair today -- it currently only reflects version, so 2 different shipcodes of the same version collide"
      - "Print() on either class can be safely removed (or re-wired to a real logger) without affecting any live behavior -- both are confirmed unreachable today"
    test_areas:
      - "PRIORITY: call AddInstance() twice for the same product+version but 2 different shipcodes/media IDs, then confirm both media IDs are retrievable via GetMedia() (reproduces the confirmed shipcode-ignored bug -- expect only 1 today)"


    risk_level: HIGH
    risk_rationale: >
      CORRECTS an earlier pass's speculation (in the pimInstallMgrDlg entry
      above) that this class was "likely superseded, not confirmed dead" --
      a full source read confirms it is LIVE: 2 confirmed call sites, and
      pim_ui_src.cxx directly #includes pimCustomDlg.cxx into the build.
      CONFIRMED BUG (highest severity for this class): SetSABPath()/
      DisableSAB()/EnableSAB() (defined in the shared pim_ui_src/pimSAB.cxx)
      all guard on main_dlg_sab_handle -- a process-wide static owned by
      pimInstallMgrDlg, not this class's own help_dlg_sab_handle. Currently
      masked only because pimInstallMgrDlg::InitSAB() has always already run
      by the time either confirmed caller reaches Display(); any future path
      that reaches pimCustomDlg::Display() before pimInstallMgrDlg has
      initialized its own SAB handle (or in a process that never constructs
      pimInstallMgrDlg) would hit a silently-broken Help/Advanced address
      bar. Also confirmed: pimEntitlementTree's per-row customize icon
      resolves the specific clicked-row pimEntitlement but never passes it
      through -- Initialize() has no target-entitlement parameter, so the
      dialog always opens on the first eligible product, a UX gap not a
      data-correctness bug. Also confirmed: this class's customize feature
      set (shortcuts/features/commands/licenses/misc-inputs) is a
      near-complete structural duplicate of pimInstallMgrDlg's own embedded
      Customize tab-set, down to 3 renamed nested table classes
      (pimSimulateLicenseTable/pimMiscTable/pimCommandTable here vs.
      pimCustomSimulateLicenseTable/pimCustomMiscTable/pimCustomCommandTable
      there) -- a fix applied to one implementation does not reach the
      other. Lower-severity confirmed findings: RefreshFeatureTab() is a
      permanent no-op (believed benign here, since uiCustomTree refreshes
      itself directly -- unlike the identical-looking, unresolved finding on
      pimInstallMgrDlg); the Help/Advanced tab is a partially-removed
      feature (commented-out AddComponent()/AddLayout()/OnTabSelect() branch,
      but the RefreshDlg() SAB-state-change block for it still runs
      unconditionally); 2 independent DOM-walking implementations for
      <USER_INPUT> matching (OnInputPanelInput() vs.
      pimMiscTable::OnOptionMenuSelect()); and a #if 0-disabled Windows-7
      taskbar-pin block in Initialize() (a 3rd confirmed instance of this
      project's #if/#ifdef dead-code pattern).

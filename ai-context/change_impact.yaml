      - "same_msihybrid set on a product XML with 2+ <MSI> nodes -- confirm whether the second (redundant) MSI is actually skipped or (per the confirmed finding) processed anyway"
      - "Each named MSI exit code's handling individually, in BOTH pimMSIExec() and OnInstall() paths"
      - "OnFailure()'s package-deselection persisting correctly across a re-run"
      - "Kill() called while use_msiexec=false (API path) -- confirm it is indeed a no-op and identify whether the underlying pimMSIInstallSilent()/BasicUI()/FullUI() call has any internal cancellation check"


    called_by: ["pim_ui/pim_ui_src/upimDlg.cxx:57 (upimInstalls::upimInstalls() -- Applications, a btkMap<char*, pimEntitlement*>)", "pim_core/pim_core_src/pimEntitlement.cxx:205-206 (pimEntitlement::pimEntitlement() -- DownloadXmlBackups and PreRequisitesToHandle, both btkMap members)", "pim_core/pim_core_src/pimGetAvailableProduct.cxx:89-91 (pimGetAvailableProducts::pimGetAvailableProducts() -- Products, see pimAvailableProduct's own entry)", "pim_ui/pim_ui_src/pimsilentDlg.cxx:24 -- CONFIRMED declared but never used anywhere else in that file"]
    risk_level: LOW
    risk_rationale: >
      CONFIRMED: Cmp_cStrings is redeclared independently via a local
      `extern int Cmp_cStrings(void *, void *);` in 4 separate .cxx files
      (upimDlg.cxx, pimsilentDlg.cxx, pimEntitlement.cxx,
      pimGetAvailableProduct.cxx), with no shared header declaring it once --
      a maintenance hazard (no compiler-enforced single source of truth) if
      its signature or semantics ever needed to change. CONFIRMED:
      pimsilentDlg.cxx's declaration is dead/unused -- no construction in
      that file actually references it. UNKNOWN and unconfirmable in this
      archive: the actual comparison semantics (case sensitivity, NULL
      handling) -- there is no implementation present to read. This is the
      one entry in this documentation set's full_detail: true list that is
      "full depth" in the sense of exhaustively confirming everything
      confirmable, not in the sense of having traced an actual
      implementation.
    modification_impact:
      - "Any change to Cmp_cStrings' actual behavior (wherever it is truly implemented, outside this archive) affects all 4 confirmed btkMap consumers above simultaneously -- upimInstalls::Applications, pimEntitlement::DownloadXmlBackups/PreRequisitesToHandle, and pimGetAvailableProducts::Products"
      - "If ever consolidating the 4 independent extern declarations into a shared header, remove the unused 5th declaration in pimsilentDlg.cxx rather than propagating it forward"
    test_areas:
      - "Not applicable in the usual sense -- there is no local implementation to unit test; any test would need to target the 4 real btkMap consumers' observable key-ordering/lookup behavior instead"

metadata:
  full_detail_classes: [pimLoop, pimEntitlement, pimSessionInfo, pimXmlFile, pimCopyLoop, pimSFXLoop, pimScriptLoop, pimShortcutLoop, pimServiceLoop, pimPsfLoop, pimDownloadLoop, pimRegEditLoop, pimMSILoop, pimCopier, pimMSICopier, pimSFXCopier, pimShortcuts, pimRegEdit, pimServices, pimDownloader, pimShortcutMgr, pimInstallMgrDlg, pimCustomDlg, pimEntitlementTree, pimFrictionlessTrialDlg, rpimDlg, pimAuthDlg, pimGetAvailable, pimGetMediaDetails, pimGetApplicationsList, pimAvailableProduct, Cmp_cStrings, pimSilentTestXmlIsUseable, pimTranslateMgr]
  light_detail_classes: []
  not_covered_at_all: ["all pim_ui dialog classes (pimShortcutMgr, pimInstallMgrDlg, pimCustomDlg, pimEntitlementTree, pimFrictionlessTrialDlg, rpimDlg, and pimAuthDlg excepted, now full_detail)", "pimFrictionlessTrialLicenseGet (read in full while documenting pimFrictionlessTrialDlg, not itself given a full class doc)", "pimPTCRenewLicenseGet (located while documenting rpimDlg, not read in depth)", "pimInterrogator, pimPackageMgr, pimPlatformMgr, pimLanguageMgr"]
  correction_note: >
    pimCopyLoop's called_by and pimMSILoop's called_by were corrected in an earlier
    update from an assumed/inferred per-entitlement owner to a confirmed process-wide
    singleton. In a later update, all 7 owner-wrapper classes (pimCopier/pimMSICopier/
    pimSFXCopier/pimShortcuts/pimRegEdit/pimServices/pimDownloader) were promoted to
    full_detail: true after a full source read of both header and .cxx for each --
    see ai-context/ownership.yaml correction_history for the concurrency-model findings
    this surfaced (the pimServices race condition, the shared pimMSICopier/
    pimSFXCopier gate, the pimRegEdit.h stale comment, and the Cancel()-propagation
    split across the 7 classes). In a later update, pimRegEditLoop (the 9th Loop
    subclass) was promoted to full_detail: true, surfacing a confirmed
    double-increment bug in OnRollback() that silently skips every other registry
    entry on uninstall/rollback -- see docs/classes/pimRegEditLoop.md. In this
    update, pimMSILoop (the last remaining light_detail_classes entry) was
    promoted to full_detail: true, completing full-depth documentation of ALL 9
    Loop subclasses. This surfaced the highest-severity finding of the entire
    documentation effort: OnInstall()'s fallback_to_msiexec flag can cause
    repeated, compounding re-invocation of pimMSIExec() that silently
    re-installs already-installed packages (O(N^2) worst case) -- see this
    file's own pimMSILoop entry above and docs/classes/pimMSILoop.md.
    light_detail_classes is now empty: every Loop subclass and every
    owner-wrapper singleton has full-depth documentation. In this update,
    pimShortcutMgr -- the first pim_ui-module class in this documentation
    effort -- was added at full_detail: true, surfacing a confirmed coverage
    gap in AreChangesPending() (cannot detect an added/removed shortcut,
    only a changed one) with a real consequence in pimEntitlement.cxx's
    update/reconfigure logic, plus a confirmed caller-side array-indexing
    bug in pimSilent.cxx's pimSilentFixupShortcuts() found while tracing
    this class's usage -- see docs/classes/pimShortcutMgr.md. In this
    update, pimInstallMgrDlg -- the main wizard dialog class, and the
    largest class in this entire documentation effort at 5,575+ lines
    across header + 2 .cxx files -- was added at full_detail: true, with
    an explicit Scope note in its own doc disclosing which large method
    bodies (notably the ~550-line OnPushButtonActivate()) were not traced
    to the same depth as the rest. This pass surfaced the largest set of
    confirmed findings in a single class in this documentation effort:
    a StepForward()/StepBack() wizard-step guard-condition asymmetry, a
    duplicated UpdateParentEntitlements()/UpdateChildEntitlements()
    implementation shared verbatim (modulo one stray comment) between
    pimInstallMgrDlg and its nested uiCustomAppTree class, a permanently
    no-op RefreshFeatureTab(), an unreachable RefreshHelpTab() branch, a
    message-ID bug in SetPortError(), a 3-way duplicated exit/cleanup
    path across OnClose()/OnFinishFromEula()/OnFinishFromBetaEula(), and
    an unconfirmed-but-flagged likely-superseded parallel class
    (pimCustomDlg) with a near-identical method-name set -- see
    docs/classes/pimInstallMgrDlg.md. In this update, pimCustomDlg itself
    was promoted to full_detail: true, which CORRECTS that prior
    speculation: a full source read (header + .cxx + the shared
    pim_ui_src/pimSAB.cxx) confirms pimCustomDlg is LIVE, not superseded,
    with 2 confirmed call sites (pimInstallMgrDlg's own CustomizeBtn
    branch, and pimEntitlementTree's per-row customize-icon handler,
    newly discovered while tracing pimCustomDlg's callers). This pass's
    own confirmed findings: SetSABPath()/DisableSAB()/EnableSAB() guard on
    the wrong process-wide static SAB handle (pimInstallMgrDlg's
    main_dlg_sab_handle instead of pimCustomDlg's own help_dlg_sab_handle),
    currently masked only by call-order luck; pimEntitlementTree's per-row
    customize icon resolves but never forwards the clicked row's specific
    entitlement, so the popup always defaults to the first eligible
    product; and extensive structural duplication with pimInstallMgrDlg's
    embedded Customize tab-set, including 3 renamed-but-identical nested
    table classes -- see docs/classes/pimCustomDlg.md and this file's own
    pimCustomDlg entry above. In this update, pimEntitlementTree -- the
    checkbox tree driving the wizard's Applications step, and the confirmed
    2nd pimCustomDlg call site -- was promoted to full_detail: true. This
    pass surfaced 2 confirmed bugs: an unconditional null-pointer dereference
    in OnOptionMenuSelect() (eptr_new_xml->SetXml() called outside the
    `if (eptr_new_xml)` guard that immediately precedes it), and an
    off-by-one in ReconfigureDisplay_low()'s only_one branch that strips one
    character too many from a computed family-group node id
    ("_Creo_app" -> "_Cre" instead of "_Creo"), confirmed by contrast with
    the correctly-computed sibling extraction in UpdateGroupStatus() in the
    same file. This pass also discovered a previously-uncatalogued 3rd .cxx
    file for pimInstallMgrDlg's own method bodies,
    pim_ui_src/pimEntitlementRefresh.cxx (1,514 lines, at the time not
    itself traced) -- pimInstallMgrDlg's own loc field above has been
    corrected accordingly (see its loc_note). See
    docs/classes/pimEntitlementTree.md and this file's own
    pimEntitlementTree entry above. In this update,
    pimFrictionlessTrialDlg -- the UI for pim_rl.exe's Frictionless/
    Commercial Trial license-retrieval flow -- was promoted to
    full_detail: true. This pass surfaced the single highest-severity
    confirmed finding among the pim_ui classes documented so far:
    Display()'s in-house-mode branch calls FrictionlessLicenseGenerate()
    then blocks on Sleep(60000) instead of calling uiDialog::Activate(),
    so the armed LicenseGenerateTimer never fires, so OnTimerExpired() --
    the ONLY call site anywhere in this codebase for
    pimFrictionlessTrialLicenseGet::HeartBeat() -- is never invoked, and
    the entire license-save/PSF-update completion logic inside HeartBeat()
    never runs, for the only confirmed real usage of this class. See
    docs/classes/pimFrictionlessTrialDlg.md and this file's own
    pimFrictionlessTrialDlg entry above. In this update, rpimDlg -- the UI
    for pim_re.exe's "Renew License" flow, and the closest sibling class to
    pimFrictionlessTrialDlg -- was promoted to full_detail: true. This
    pass's value is primarily comparative: rpimDlg::Display() correctly
    calls uiDialog::Activate() unconditionally, confirming by direct
    contrast that pimFrictionlessTrialDlg's Sleep(60000) bug is a genuine
    defect, not an inherent limitation of the shared dialog design. rpimDlg
    shares 2 of pimFrictionlessTrialDlg's smaller confirmed-dead-code
    findings (SetURL()/GetAuth() with zero callers; the same dead
    static in_timer reentrancy guard) but NOT its Refresh() finding --
    rpimDlg::Refresh() is confirmed actively used, unlike the fully-dead
    pimFrictionlessTrialDlg::Refresh(). Also identified pimAuthDlg as the
    likely shared template both classes partially copied. See
    docs/classes/rpimDlg.md and this file's own rpimDlg entry above. In this
    update, pimAuthDlg -- the oldest of the 3-class dialog family (2011) and
    the confirmed original template rpimDlg/pimFrictionlessTrialDlg were
    partially copied from, called directly from pim_core -- was promoted to
    full_detail: true, completing this family's investigation. This pass
    confirmed pimAuthDlg's AuthDialog singleton is genuinely REUSED
    (Initialize()/Display() invoked multiple times on the same instance in
    one process, via pimSessionInfo::TryAuthorize()'s confirmed retry loop
    and 2 further call paths) and surfaced that Initialize() has no
    idempotency guard -- exactly the one class in this family that needed
    one. Also refined the earlier framing of pimAuthDlg's own SetURL()/URL
    pairing: SetURL() IS called here (unlike its 2 dead copies), but the URL
    member it sets is STILL never read, even in the original -- see this
    entry's own correction_note above. See docs/classes/pimAuthDlg.md and
    this file's own pimAuthDlg entry above. In this update,
    pim_ui_src/pimEntitlementRefresh.cxx -- the previously-uncatalogued 3rd
    .cxx file for pimInstallMgrDlg, flagged not-traced when discovered while
    documenting pimEntitlementTree -- was read in full (all 1,514 lines) and
    folded into pimInstallMgrDlg's own entry above (full_detail_classes and
    not_covered_at_all updated accordingly; it is no longer listed as
    not-covered). This pass's headline finding: the School- and Beta-mode
    trial-license wait loops in EntitlementRefresh() use
    `while (test == NULL || ++max >= 40)` where the correct sibling
    Trial-mode loop uses `&&`/`<=` -- because `||` short-circuits on its
    left operand, the retry counter never advances while the license fails
    to parse, so the loop never terminates, hanging the wizard with no
    timeout and no error path. Also confirmed: a missing `else` in
    IsSufficientSpace() before an unconditional GetSize(dbl) call silently
    discards 2 special-case size calculations (same-version-installed,
    parent-only), found by direct contrast with the correctly-guarded
    sibling logic in EntitlementRefresh_updateSpace() in the same file; the
    nested uiCheckButtonCell class's entire implementation is confirmed dead
    code (its only would-be caller lives inside a class-wide `#if 0`-disabled
    uiApplicationsList class); and the PIM_HIDE_CUSTOMIZE_SCREEN env var is
    checked with directly contradictory effect (hide vs. show/enable)
    across 4 distinct sites in the same file. See
    docs/classes/pimInstallMgrDlg.md's Risk Analysis and this file's own
    pimInstallMgrDlg entry above. In this update, pimGetAvailable -- the
    web-media download-availability search, discovered while tracing
    pimEntitlementRefresh.cxx's EntitlementDownloadPreAction() -- was
    promoted to full_detail: true, CORRECTING every prior "all 9 Loop
    subclasses" claim in this documentation set: it is a 10th confirmed
    pimLoop subclass, previously only mentioned in passing in
    docs/modules/pim_core.md and never counted in any Loop-subclass tally.
    This pass surfaced 2 confirmed memory leaks in OnExecute() (ImageXml
    never freed on the success path; ProductDefinitionXml never freed on 2
    filtered-out paths), a confirmed wrong declaring comment on auth_status
    (`// -3 abort, 0 success` -- 0 is actually failure, not success), a
    confirmed zero-caller dead public method (IsAuthorized()), and a
    cross-module raw-pointer alias in pim_core/pimLocate.cxx (the same
    architectural pattern already flagged as a confirmed LIVE bug for
    pimSAB.cxx's statics, here confirmed currently safe given the exact call
    sites that exist today, but with no structural safeguard against a
    future change breaking that invariant). See
    docs/classes/pimGetAvailable.md's Risk Analysis and this file's own
    pimGetAvailable entry above. In this update, pimGetMediaDetails -- the
    shared media-details cache/fetcher pimGetAvailable itself depends on,
    and a singleton called from at least 7 confirmed files across pim_core
    and pim_ui -- was promoted to full_detail: true. This pass surfaced a
    confirmed incomplete-locking bug (GetDetails()'s cache-hit path reads
    the shared cache with no lock at all, unlike every mutating path), a
    confirmed stale-URL retry bug in GetProductXml() (refreshes the details
    cache on timeout but retries with the pre-refresh URL, confirmed by
    contrast with the correct pimEntitlement::UpdateMediaUrls() pattern), an
    unconfirmed-severity redundant/possibly-dangerous double-Replace() on
    that same retry path, and confirmation that GetProductXml()'s NULL
    returns are the exact root cause of pimEntitlementTree's
    already-documented null-dereference bug -- plus a confirmed-dead
    near-duplicate of that same bug inside the #if 0-disabled
    uiApplicationsList::OnOptionMenuSelect(). See
    docs/classes/pimGetMediaDetails.md's Risk Analysis and this file's own
    pimGetMediaDetails entry above. In this update, pimGetApplicationsList --
    NOT a class, a free-function group (pimGetApplicationsList/
    pimAddApplicationsToList/IsApplicationInInstallList) plus
    pimCommandLineArgs' -APPLICATIONS/-XML/-XMLALL/-FLEX handling in the pim
    module, discovered while tracing pimGetAvailable::OnExecute()'s use of
    it -- was documented at full depth despite not being a class (see
    docs/classes/pimGetApplicationsList.md for how the usual template was
    adapted). This pass's headline finding: InstallPreReqSilent()
    (pim/pim_src/pimTop.cxx:904-966, on the silent-install path) uses the
    application list's SIZE alone, never its content, to bound a loop
    indexing a completely different array (session entitlements) -- so its
    entire prerequisite-installation loop silently never runs whenever no
    application-limiting command-line flag was passed, the common case.
    Also confirmed: the shared applications_list is populated in 2
    incompatible formats (bare tags vs. full filesystem paths) depending on
    which of 3 flags is used, with 2 of its 3 confirmed consumers using an
    exact-match filter that can never recognize a path-format entry -- only
    IsApplicationInInstallList()'s substring search is format-agnostic. See
    docs/classes/pimGetApplicationsList.md's Risk Analysis and this file's
    own pimGetApplicationsList entry above. In this update,
    pimAvailableProduct/pimGetAvailableProducts -- previously documented only
    as a brief "companion" inside pimGetAvailable's own entry -- were
    promoted to their own full-depth entry after a dedicated pass over
    AddInstance() surfaced a confirmed bug the earlier lighter treatment
    missed: the `shipcode` parameter is never referenced in AddInstance()'s
    body, so it builds and dedups its VerShipcodes entry from the bare
    version string alone -- despite the member name and the
    pimCompareVerShipcode() comparator both implying a combined
    version+shipcode identifier is intended. A 2nd AddInstance() call for the
    same version under a different shipcode is silently treated as a
    duplicate and its media ID is dropped. See
    docs/classes/pimAvailableProduct.md's Risk Analysis and this file's own
    pimAvailableProduct entry above. In this update, Cmp_cStrings -- the
    btkMap comparator pimGetAvailableProducts' own entry flagged as
    "declared but not defined in either of this class's 2 files" -- was
    given a dedicated pass and confirmed to have NO implementation anywhere
    in this archive at all (an exhaustive grep across pim/, pim_core/,
    pim_ui/, and pim_util/ finds exactly 8 lines: 4 independent local
    `extern` declarations, no shared header, plus their 4 uses). This is the
    one entry in this documentation set that is "full_detail: true" in the
    sense of exhaustively confirming everything confirmable about its
    declaration/usage, not in the sense of having traced an actual
    implementation -- there is none to trace. Confirmed: 4 real btkMap
    consumers (upimInstalls::Applications, pimEntitlement::DownloadXmlBackups/
    PreRequisitesToHandle, pimGetAvailableProducts::Products) plus 1
    confirmed-unused 5th declaration in pimsilentDlg.cxx. See
    docs/classes/Cmp_cStrings.md and this file's own Cmp_cStrings entry
    above. In this update, a dedicated pass on pimAvailableProduct::Print()
    specifically (and pimGetAvailableProducts::Print(), which fans out to
    it) confirmed both are dead code: zero live callers anywhere in this
    archive, with their only 2 references
    (pimGetAvailable.cxx:474,478) both commented out. Updated the
    pimAvailableProduct entry's risk_rationale/modification_impact and the
    annotated pimGetAvailableProduct.h's Print() comments accordingly; no
    change to risk_level (MEDIUM, driven by the AddInstance() bug, remains
    the more significant finding on this class). See
    docs/classes/pimAvailableProduct.md's Risk Analysis.
    In this update, "pim_ui's remaining gaps" -- 2 previously-flagged
    not-traced-to-depth items, pimSessionInfo::TryAuthorize() (cited only
    via its call-site signature) and pimInstallMgrDlg::OnPushButtonActivate()
    (the file's own Scope note had disclosed this ~550-line method was not
    traced) -- were each given a dedicated full-depth pass. TryAuthorize()
    (pim_core_src/pimSessionInfo.cxx:1911-1984) surfaced a confirmed
    HIGH-SEVERITY infinite-loop bug (no handling for pimAuthorizeToPTC()
    returning false on transport failure, confirmed by direct contrast with
    pimGetAvailable::GetSecurity()'s correct -3 abort on the identical
    failure), a matching pimXmlFile leak, a discarded-return-value/
    stale-reused-variable finding matching this session's recurring
    pattern, and confirmed credential-store aliasing with
    pimGetAvailable::GetSecurity() via a shared `// HACK`-commented
    SecurityArray slot. OnPushButtonActivate()
    (pim_ui_src/pimInstallMgrActions.cxx:643-1193) surfaced a confirmed
    HIGH-SEVERITY EULA-decline-order bug (license acquisition kicked off
    before the decline check, the reverse of the Beta EULA arm's correct
    order in the same function), a confirmed control-flow-traced
    Refresh()-after-Destroy() gap, a disabled-Finish-button bug, and a
    confirmed re-entrancy bug via pimTextDlg's "proceed anyway" flow. See
    docs/classes/pimSessionInfo.md's and docs/classes/pimInstallMgrDlg.md's
    Risk Analysis sections, and this file's own pimSessionInfo and
    pimInstallMgrDlg entries above.
  usage_guidance: >
    Before modifying any class listed here, read its `doc` reference(s) in full.
    For classes with full_detail: false, do a fresh source read of the target file(s)
    before relying on anything beyond what's stated here — the entry reflects a
    narrow, evidence-scoped pass, not a complete analysis. For pimServices,
    pimRegEditLoop, pimMSILoop, pimSilent.cxx's pimSilentFixupShortcuts()
    (called out in the pimShortcutMgr entry), pimInstallMgrDlg's wizard
    step machine and customize-tab duplication, pimCustomDlg's
    wrong-static-handle SAB bug, pimEntitlementTree's OnOptionMenuSelect()
    null-dereference and ReconfigureDisplay_low() off-by-one, and
    pimFrictionlessTrialDlg's Display()/Sleep(60000)/never-calls-HeartBeat()
    bug, pimAuthDlg's Initialize()-has-no-idempotency-guard gap,
    pim_ui_src/pimEntitlementRefresh.cxx's School/Beta-mode infinite-wait
    loop and IsSufficientSpace()'s missing-else bug, pimGetAvailable's
    OnExecute() memory leaks, pimGetMediaDetails' unlocked cache-hit
    read and stale-URL retry bug, pimGetApplicationsList's
    InstallPreReqSilent() wrong-array-size loop bound,
    pimAvailableProduct::AddInstance()'s ignored-shipcode-parameter bug,
    pimSilentTestXmlIsUseable()/pimSilentCanMatchNeeds()'s pimXmlFile leaks
    on their respective XML-parse-error paths,
    pimSilentFixupPSF()'s stuck-dummy-placeholder bug,
    pimSilentFixupShortcuts()'s stale-Program-Menu-copy bug,
    pimSessionInfo::TryAuthorize()'s infinite-loop-on-transport-failure and
    matching pimXmlFile leak, and
    pimInstallMgrDlg::OnPushButtonActivate()'s EULA-decline-order bug and
    re-entrancy gap
    specifically, read the
    risk_rationale above before making ANY
    change — each documents a live, unfixed bug (a concurrency race, a
    registry-rollback completeness bug, a repeated-reinstall bug, a
    shortcut-state array-indexing bug, a step-navigation/entitlement-
    propagation asymmetry, a wrong-static-variable guard, a
    crash-on-null-media-lookup, a family-node-id off-by-one, a
    completion-logic-never-runs bug, a missing-reentrancy-guard on a
    confirmed-reused singleton, a license-wait loop that never terminates on
    failure, a size-calculation special case with no effect, 2 memory
    leaks in a background search thread, an incompletely-locked shared
    cache, a silently-skipped prerequisite-install loop, an
    ignored-parameter dedup bug that silently drops data, 2 more memory
    leaks on XML-parse-error paths, a collision-workaround placeholder
    that can itself become permanently stuck, and an unguarded getter/setter
    pair that can copy a stale value onto the wrong record, respectively)
    that a future edit could either mask or make worse if not understood
    first. Separately, note that pimSilentCanMatchNeeds()'s mode-dependent
    package check (originally flagged as a "validation gap" under -basepack
    and "overly strict" under -allpacks) was CORRECTED by a later, dedicated
    pass on pimSilentCreateEntitlement() itself: both functions call the
    identical GetInstallPackageNames() on the same A under the same mode
    flags, always back-to-back on the same A/B pair, so they are confirmed
    consistent with each other -- what pimSilentCanMatchNeeds() validates is
    exactly what pimSilentCreateEntitlement() will install. Only their
    shared header-comment imprecision (describing a plain install="Y" check)
    remains accurate; the behavior itself is by design, not a bug. Also note
    a confirmed STRUCTURAL LIMITATION rather than a live bug: pimIsProductXmlMatch()
    and pimIsVersionMatch() (which duplicates the exact same control-flow
    shape) have no cross-schema fallback for B -- whichever root schema
    (<PRODUCT> vs. <EXTERNAL_INSTALLER>) succeeds for A is the only one ever
    tried for B, so a mixed-schema A/B pair always reports "no match" even
    with identical <TAG>/version/shipcode values -- not confirmed reachable
    with any real product/media XML pair in this archive, but the mechanism
    is fully confirmed from both functions' bodies and pimEntitlement::Init()'s
    documented contract. Also note
    a confirmed
    STRUCTURAL RISK rather than a live bug: IsApplicationInInstallList()'s
    substring match (the pimGetApplicationsList entry's one format-agnostic
    consumer) can itself false-positive if a future application tag is added
    that is a literal substring of another already reachable via
    applications_list -- no such collision exists among the 3 real tags used
    in this archive today, but any new tag should be checked against this
    before being added. Separately, note a correction to the
    pimGetApplicationsList entry's own earlier framing: a later dedicated
    pass on AddMandatoryAppsForSilentInstall() (pim/pim_src/pimTop.cxx:1282-1316,
    no header anywhere in this archive, so no Doxygen patch exists for it)
    found the "commonly EMPTY" characterization of InstallPreReqSilent()'s
    input list overstated for the one real call path, and surfaced 2 further
    confirmed bugs specific to that function: qualityagent.xml's mandatory
    injection is silently skipped whenever creobase.xml is absent from the
    media (nested inside the wrong if-check), and -allpacks' utility-XML
    entitlements are invisible to InstallPreReqSilent() entirely (added to a
    local list only, never to the shared applications_list). Also note: this documentation set's
    OWN earlier characterization of pimCustomDlg as "likely superseded" was
    itself wrong (corrected in the pimCustomDlg entry's risk_rationale and
    this metadata's correction_note) — a reminder that even this file's own
    prior entries should be re-verified against current source before being
    treated as settled, not just the source code itself.

    loc: 770
    loc_note: "pim_core/includes/pimSilent.h (24 lines) + pim_core/pim_core_src/pimSilent.cxx (746 lines), both read in full"
    depends_on: [pimEntitlement, pimGetApplicationsList, pimCommandMgr, pimPackageMgr, pimShortcutMgr, pimScriptLoop, pimShortcutLoop, pimShortcuts, pimExit, pimMSILoop, pimMSICopier, pimCustomActionsLoop, pimSessionInfo, pimPlatformMgr, pimLanguageMgr]
    called_by: ["pim/pim_src/pimTop.cxx:1532 (pimSilentInstallFromXML()'s per-entry validation loop, sole call site for pimSilentTestXmlIsUseable() -- see pimGetApplicationsList's own entry above)", "pim/pim_src/pimTop.cxx:1535 (same loop, sole call site for pimSilentCreateEntitlement(), guarded by a successful pimSilentTestXmlIsUseable() call)"]
    risk_level: LOW
    risk_rationale: >
      CONFIRMED STRUCTURAL LIMITATION (found in a later, dedicated pass on
      pimIsProductXmlMatch() itself, pim_core/pim_core_src/pimSilent.cxx:106-134,
      shared identically by pimIsVersionMatch(), :143-215, which duplicates
      the exact same control-flow shape): neither function has a
      cross-schema fallback for B. pimEntitlement::Init(path, root_match)
      (pim_core/pim_core_src/pimEntitlement.cxx:771-) requires the XML's
      root element to be exactly <PRODUCT> when root_match is NULL, or
      exactly <EXTERNAL_INSTALLER> when root_match is that string -- a
      document can only satisfy one. Whichever schema succeeds for A is the
      ONLY one ever tried for B within that same call; if Eb.Init() fails
      under that schema, the function returns false without ever
      attempting the other schema for B. Confirmed consequence: a
      mixed-schema A/B pair (one <PRODUCT>-rooted, one
      <EXTERNAL_INSTALLER>-rooted) is confirmed to always report "no match"
      even if their <TAG> (or version/shipcode, for pimIsVersionMatch())
      values are otherwise identical -- reported up as
      PIM_SOFTWARE_NOT_FOUND by pimSilentTestXmlIsUseable() (:100-101). Not
      confirmed reachable with any real product/media XML pair in this
      archive (no sample EXTERNAL_INSTALLER-rooted XML exists to test), but
      the mechanism itself is fully confirmed from both functions' own
      control flow and pimEntitlement::Init()'s documented root-tag
      matching contract.
      REACHABILITY, more precisely characterized (found in a further,
      dedicated pass on this bug specifically): pimEntitlement::Init()'s
      root-tag matching (pim_core/pim_core_src/pimEntitlement.cxx:806-833)
      is purely a literal-root-tag test. Critically, this codebase's OWN
      other 2 product-XML resolution call sites do NOT assume a fixed
      schema for a single file: pimEntitlement.cxx:634-635 (resolving a
      product's own installed .p.xml) tries
      Init(file,NULL) || Init(file,"EXTERNAL_INSTALLER") || Init(file,"HIDDEN_PRODUCT")
      -- 3 schemas in sequence -- and pimEntitlement.cxx:967-968 (resolving
      a <PREREQUISITE> product reference) tries

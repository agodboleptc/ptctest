      HIGH-SEVERITY BUG in OnInstall() (the MSI-API path, use_msiexec == false) --
      its fallback_to_msiexec flag is checked at the END OF EVERY loop iteration
      (not once after the loop) and is never reset once set, so a single <MSI>
      node whose INSTALL command can't be pattern-matched causes EVERY remaining
      node's iteration to re-invoke pimMSIExec(), which re-scans and can silently
      RE-INSTALL already-installed packages (its IsEligibleForInstall() gate
      checks only install="Y", not the separate installed attribute) -- an O(N^2)
      redundant-reinstall risk on legacy product XML. Also confirmed: the
      same_msihybrid skip only logs a debug message and has no actual effect on
      which MSIs get processed -- dead business logic. Also confirmed: Kill() is
      a total no-op for the MSI-API path (use_msiexec == false), and busy-spins
      with no sleep (bounded ~2s) for the msiexec.exe path.
    modification_impact:

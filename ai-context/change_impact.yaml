    doc: docs/classes/pimCustomDlg.md
    module: pim_ui
    purpose: "A standalone modal 'Customize Application Settings' popup dialog configuring per-product shortcuts/features/commands/simulated-licenses/misc-inputs for one entitlement at a time"

  - class: pimAuthDlg
    full_detail: true
    doc: docs/classes/pimAuthDlg.md
    module: pim_ui
    purpose: "A generic PTC.com account-credential prompt shown whenever a network operation against a PTC.com resource returns an authentication challenge; the confirmed original template both rpimDlg and pimFrictionlessTrialDlg were partially copied from"
    loc: 308
    depends_on: [pimSessionInfo, "bs_pro_browser_security/pimPTCDotCom (external, Creo browser-security auth-callback API)", pimWindows]
    called_by: ["pim_core/pimSessionInfo.cxx:1927,1937 (pimSessionInfo::TryAuthorize()'s do/while retry loop -- confirmed real, reachable multi-invocation of the AuthDialog singleton)", "pim_core/pimGetAvailable.cxx:85,88 (pimGetAvailable::GetSecurity(bool retry) -- a 2nd confirmed re-invocation path, now itself fully traced, see pimGetAvailable's own entry below)", "pim_ui/pimPTCLicenseGet.cxx:208,210 (commercial-trial license worker, not traced in depth)"]
    risk_level: MEDIUM
    risk_rationale: >
      CONFIRMED STRUCTURAL GAP: Initialize() (pim_ui/pim_ui_src/pimAuthDlg.cxx:146-154)
      has no idempotency guard (`if (initialized) return true;`) -- contrast
      with rpimDlg::Initialize()/pimFrictionlessTrialDlg::Initialize(), which
      both have one. This matters specifically for pimAuthDlg because it is
      the ONE class in this 3-class dialog family confirmed to actually be
      reused: AuthDialog is a heap singleton (XNew'd once, never deleted or
      reset) and pimNonBrowserAuthenticationCB() -- the function that calls
      Initialize()/Display() on it -- is confirmed called from a real
      do/while retry loop in pimSessionInfo::TryAuthorize() (re-invoked on
      every iteration where cached credentials are missing/empty) plus 2
      further confirmed call paths. Whether a 2nd uiDialog::Initialize()
      call on an already-initialized instance is safe depends on uiDialog's
      own implementation, not in this archive -- flagged as a confirmed gap
      with an unconfirmed severity ceiling, not an asserted crash. Also
      confirmed: the URL member is write-only even in this original
      template (SetURL() IS called here, twice, unlike its 2 dead copies on
      rpimDlg/pimFrictionlessTrialDlg -- but the URL value itself is never
      read by anything, even here); GetAuth()'s bool return value is always
      false and ignored by both confirmed callers; and a commented-out
      `//AuthDialog->SetBadInputs();` in pimRequestForUserPwd() reveals a
      confirmed never-implemented retry-feedback feature (no SetBadInputs()
      method exists anywhere in this codebase). A structurally identical,
      disabled duplicate of TryAuthorize()'s retry loop exists behind #if 0
      at pimSessionInfo.cxx:2005 onward, a further confirmed instance of
      this project's recurring #if/#ifdef dead-code pattern.
    modification_impact:
      - "PRIORITY: add an `if (initialized) return true;` guard to Initialize() (or otherwise confirm uiDialog::Initialize() is safe to call repeatedly) before making any change that could increase how often pimNonBrowserAuthenticationCB()/pimInitAuthenticationCB() re-invoke it on the same AuthDialog instance"
      - "Do not assume GetAuth()'s return value carries any meaning -- it is always false and no confirmed caller checks it; use pimNonBrowserAuthenticationCB()'s own return value for success/failure instead"
      - "If implementing real bad-input visual feedback, the commented-out SetBadInputs() call in pimRequestForUserPwd() marks where it was intended to go -- do not assume this is currently functional"
    test_areas:

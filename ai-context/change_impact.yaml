  - class: pimTranslateMgr
    full_detail: true
    doc: docs/classes/pimTranslateMgr.md
    module: pim_core
    purpose: "Applies a generic localization pass to a product XML document, overwriting text content or attributes on nodes matched by an element/attribute/attributeMatch triple with values from a separate translation-file XML"
    loc: 161
    loc_note: "header (32) + pimTranslateMgr.cxx (129) = 161. First full-depth pass on this class -- previously cited only via call-site signatures in docs/classes/pimGetAvailable.md, docs/classes/pimEntitlementTree.md, docs/08_xml_configuration.md, docs/03_application_startup.md, and ai-context/xml_schema.yaml."
    depends_on: [pimXmlFile]
    called_by: ["pim/pim_src/pimTop.cxx:477 (LIVE, guarded by this file's own #ifdef PIM_TRANSLATE_XML, #define'd in the same file at :185)", "pim_core/pim_core_src/pimGetAvailable.cxx:582 (LIVE, not macro-guarded)", "pim_ui/pim_ui_src/pimEntitlementTree.cxx:1885,1956,2006 (LIVE, 3 near-identical call sequences in OnOptionMenuSelect() -- 2 of the 3 trigger this class's own confirmed bug, see risk_rationale)", "pim_core/pim_core_src/pimEntitlement.cxx:995 (DEAD -- guarding #ifdef PIM_TRANSLATE_XML can never be true in this translation unit)", "pim_ui/pim_ui_src/pimInstallMgrActions.cxx:1861,1931,1972 (DEAD -- inside the file's already-documented #if 0-disabled uiApplicationsList class)"]
    risk_level: MEDIUM
    risk_rationale: >
      CONFIRMED BUG: TranslateFrom(pimXmlFile *ptr) (pim_core_src/pimTranslateMgr.cxx:22-30)
      guards computing its `filename` member on `ptr->getFilePath()` (the
      TRANSLATION document's own path) but assigns the value from
      `xmlProduct->getFilePath()` (the PRODUCT document -- a DIFFERENT
      object this instance was constructed with) -- checking one object's
      path presence and unconditionally dereferencing the other, unguarded,
      inside the guarded block. CONFIRMED REACHABLE via 2 of
      pimEntitlementTree::OnOptionMenuSelect()'s 3 near-identical call
      sequences (pim_ui_src/pimEntitlementTree.cxx:1956,2006 -- the
      "sibling"/"parent" media-ID-bump arms): `eptr_new_xml` there comes
      straight from pimGetMediaDetails::GetProductXml()
      (pim_core_src/pimGetMediaDetails.cxx:143-238, confirmed to build its
      returned pimXmlFile purely via DoRead(*memblock) against a downloaded
      byte buffer, never calling SetXml() internally) and, when
      pimEntitlement::Init(pimXmlFile*, ...) (pimEntitlement.cxx:1038-1085)
      takes its DownloadXmlBackups early-return branch (an already-seen
      MediaID this session has cached before), aliases its own xmlPtr to
      the CACHED backup object instead of `eptr_new_xml` -- leaving
      `eptr_new_xml` itself with no file path ever set, exactly 2 lines
      before it is passed into pimTranslateMgr's constructor. CONFIRMED
      CONSEQUENCE: `filename` ends up empty, so every file-scoped
      <TRANSLATION> entry (the majority of realistic entries) fails the
      AttribFile match check and is silently skipped for those 2 arms,
      while the function's 3rd, correctly-wired arm (which explicitly calls
      SetXml() first, :1881) is unaffected -- a within-function asymmetry.
      CONFIRMED, dead code containing a compile-breaking typo:
      pimEntitlement.cxx:995's #ifdef PIM_TRANSLATE_XML block reads
      `Eptr->GetXMLPtr()` -- `Eptr` (lowercase p) is declared nowhere in
      that function, file, or the entire pim_core module (only `EPtr`,
      capital P, exists) -- but is confirmed permanently dead: the guarding
      macro is #define'd in exactly one place in this whole archive
      (pim/pim_src/pimTop.cxx:185, a different unity-build target pim_core's
      own unity build -- pim_core_src.cxx -- never #includes).
    modification_impact:
      - "PRIORITY: fix TranslateFrom(pimXmlFile*) to guard on xmlProduct->getFilePath() (the object the value is actually read from), not ptr->getFilePath(), before assuming file-scoped translation entries apply consistently across all 3 of OnOptionMenuSelect()'s call sequences"
      - "Do not assume pimEntitlement.cxx:995's #ifdef PIM_TRANSLATE_XML block can ever compile as written -- fixing the Eptr/EPtr typo alone is not sufficient to make this call site live; PIM_TRANSLATE_XML would also need to be defined for pim_core's own translation unit, which is an architectural change, not a 1-line fix"
      - "Any new call site should call SetXml() (or otherwise guarantee a real file path) on its own product pimXmlFile before constructing pimTranslateMgr, mirroring pimEntitlementTree.cxx:1881's already-correct pattern rather than relying on aliasing through a 2nd object's Init()"
    test_areas:
      - "PRIORITY: change a sibling or parent entitlement's media ID to one already downloaded/cached earlier in the same session, with the UI language differing from the OS language and at least one file-scoped <TRANSLATION> entry available, and confirm that entry is NOT applied (reproduces the confirmed mismatched-guard bug on pimEntitlementTree.cxx:1956/2006)"
      - "Repeat the same scenario for a media ID NOT previously seen this session, and confirm the file-scoped <TRANSLATION> entry IS applied (confirms the bug is specific to the DownloadXmlBackups-cache-hit path, not present on every call)"
      - "Static/code-review check: search for any future re-enablement of PIM_TRANSLATE_XML in pim_core's own translation unit, and confirm pimEntitlement.cxx:995 is fixed (Eptr -> EPtr) before that happens, or the build will fail"


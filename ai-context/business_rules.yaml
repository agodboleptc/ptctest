# Business/domain rules encoded in source. Source of truth: docs/05_prerequisite_framework.md,
# docs/04_installation_flow.md, docs/modules/pim.md.

business_rules:
  prerequisite_satisfaction:
    doc: docs/05_prerequisite_framework.md §4
    mechanism: "string-matched dispatcher pimIsPrerequisiteSatisfied() reads a function-name string from <IS_INSTALLED_FUNC> and matches it literally"
    location: pim_core/pim_core_src/pimPrerequisite.cxx:304
    rules:
      - id: pimCreoTestPlatformAgent
        checks: "PTC Creo Agent + Platform Services installed at required version"
        xml_trigger: '<IS_INSTALLED_FUNC creoagent_version="X" creosvcs_version="Y">pimCreoTestPlatformAgent</IS_INSTALLED_FUNC>'
        implementation: pim_core/pim_core_src/pimPrerequisite.cxx:42
        validation: "HKLM\\SOFTWARE\\PTC\\CreoAgent registry version values compared via pimCmpDottedVersions"
        volatility: "registry key/value set revised nearly every Creo major version (revision history $$12-$$22)"
      - id: pimWGMTestVFS
        checks: "Windchill File System (VFS) installed at required version, for WGM products"
        xml_trigger: "<IS_INSTALLED_FUNC>pimWGMTestVFS</IS_INSTALLED_FUNC> (version/upgradecode read from a sibling <DISTRIBUTION>/<MSI> element, not this node's own attributes)"
        implementation: pim_core/pim_core_src/pimPrerequisite.cxx:149
        validation: "MSI upgrade-code lookup (pimGetVersionInstalled) compared via pimCmpDottedVersions"
        fragility: "depends on exact DOM sibling structure; a product XML restructure silently degrades to 'not satisfied'"
    unmatched_function_name_behavior: "returns false with NO diagnostic — indistinguishable from a genuinely-failing check"
    declared_but_not_dispatched:
      - pimGetInstallStatusCreoViewExpress
      - pimGetInstallStatus_In       # Inventor
      - pimGetInstallStatus_SW       # SolidWorks
      - pimGetInstallStatus_NX       # Siemens NX
      - pimGetInstallStatusPlatformAgent
      - pimGetQAgentPathFromReg      # used for QAgent cleanup/PHM, not prerequisite gating

  soft_vs_hard_prerequisites:
    doc: docs/05_prerequisite_framework.md §3, §5
    rule: "A soft prerequisite is still attempted, but its failure does not block the dependent's install; a hard prerequisite's failure aborts the dependent."
    marker: "SoftPreRequisites (StringXArray of prerequisite Tags) on the dependent pimEntitlement"
    naming_pitfall: "IsOnlySoftPrerequisiteNeeded() actually reports whether there is an unsatisfied HARD prerequisite — name is misleading relative to behavior"

  product_mode_determination:
    doc: docs/03_application_startup.md §3, pim/pim_src/pimTop.cxx
    rule: "Overall session 'product mode' (PIM_CREO_MODE default, or FLEXONLY/SCHEMATICS/MATHCAD/WGM/ARPLUG/CREOHELP/MKS) is derived from which product-family entitlements were found on the media/image, in a fixed precedence order"
    precedence:
      - {condition: "flex_xml_found && can_be_flexonly_cdimage", mode: PIM_FLEXONLY_MODE}
      - {condition: Schematics_xml_found, mode: PIM_SCHEMATICS_MODE}
      - condition: "!Creo_family_found"
        sub_precedence:
          - {condition: Mathcad_family_found, mode: PIM_MATHCAD_MODE}
          - {condition: WGM_family_found, mode: PIM_WGM_MODE}
          - {condition: ARPlugin_family_found, mode: PIM_ARPLUG_MODE}
          - {condition: CreoHelp_family_found, mode: PIM_CREOHELP_MODE}
          - {condition: MKS_family_found, mode: PIM_MKS_MODE}
    downstream_effect: "product mode gates default SetInstallMe() selection (WGM/MKS default to NOT install; others default to install unless IsParentOnly)"

  install_stage_skip_flags:
    doc: docs/04_installation_flow.md §2
    rule: "Any pipeline stage can be opted out of via a boolean-ish XML property on the product definition"
    flags: [NoCopyStep, NoPreCopyMSI, NoPostCopyMSI, NoRegistryActions, NoScripts, NoServices, NoPSF, NoShortcuts, NoUninstallEntry, NoPTCInstallRecord]
    additional_suppressor: "pimGetCreoNGCRIMode() additionally suppresses shortcuts regardless of NoShortcuts"

  msi_success_codes:
    doc: [docs/11_troubleshooting.md §1, docs/classes/pimMSILoop.md]
    rule: "MSI exit codes 3010 (reboot required) and 1641 (reboot initiated) are treated as SUCCESS, not failure"
    rule_2: "MSI exit codes 1602/1259 (and 1618 with a specific message) are treated as user CANCELLATION, not a hard error"
    rule_3: "Any other non-zero MSI exit code marks the corresponding <PACKAGE install=\"N\"> persistently — deselecting it from future runs until manually reset"
    implementation_note: >
      pimMSILoop implements this mapping TWICE, independently: once in
      ProcessErrorCode(int, ...) (used by the msiexec.exe execution
      strategy, pimMSIExec()), and once in a separate, hand-duplicated
      if/else if chain inline inside the MSI-API execution strategy,
      OnInstall() (pim_core/pim_core_src/pimMSILoop.cxx:667-801). A future
      change to this exit-code table must be applied in both places to stay
      consistent -- see docs/classes/pimMSILoop.md's Risk Analysis.

  sfx_exit_codes_diverge_from_msi:
    doc: docs/classes/pimSFXLoop.md
    rule: >
      pimSFXLoop handles the SAME numeric exit codes as pimMSILoop (0/1602/1259/
      1618/1637/1633/1632/1625/1619/1613/1641/1638/3010) but treats code 1618
      DIFFERENTLY: pimMSILoop treats it as a cancellation, pimSFXLoop treats it as
      a full failure (with the pimLoop::Cancel() call explicitly commented out and
      a code comment explaining "show it as complete failure and not as
      cancelled"). This is a CONFIRMED INTENTIONAL divergence between the two Loop
      types for the identical code -- do not "fix" by unifying them without
      product confirmation.
    additional_carve_out: "Exit code 3010 (reboot required) is treated as an ERROR rather than success specifically when the SFX payload's name is 'dotNetFx40_Full' -- every other SFX payload treats 3010 as success."

  digital_signature_check_is_noop:
    doc: docs/classes/pimDownloadLoop.md
    rule: >
      pimDownloadLoop::TestDigitialSignature() calls pimIsDigitiallySignedByPTC()
      on downloaded .exe/.cab files, but UNCONDITIONALLY returns true regardless
      of the result. Failure-path logging exists but is gated behind
      #if ERROR_ON_UNSIGNED, and ERROR_ON_UNSIGNED is not #define'd anywhere in
      this archive (confirmed via grep across all headers/sources) -- the same
      "referenced-but-never-defined" pattern as ROLLBACK_CANCELLED_INSTALL.
    security_relevance: >
      In the traced configuration, downloaded installer payloads are NOT actually
      blocked or flagged for failing PTC signature verification, despite a
      function existing that reads as if it performs that check. Flag this to
      whoever owns supply-chain integrity for downloaded payloads before assuming
      signature enforcement is active.

  psf_file_generation_and_preservation:
    doc: docs/classes/pimPsfLoop.md
    rule: >
      A PSF file (exact acronym expansion still UNCONFIRMED in this archive) is a
      per-product license-configuration file generated from an <INCLUDE>/<BODY>
      template composition (structurally identical to pimScriptLoop's script
      generation), paired with a .bat wrapper that launches [LP]/bin/[EXE] with
      the PSF file path as its argument.
    user_data_preservation_rule: >
      Before regenerating an existing PSF file, any lines found after a literal
      "USER - PSF" marker comment are captured and re-appended to the newly
      generated file, so a user's manual customizations survive regeneration
      (per revision comment "don't delete the old psf"). If that marker string is
      missing or altered, preservation silently fails with no error surfaced.
    suppress_lmlic_rule: "If the previously-preserved user data contains 'PTC_SUPPRESS_LMLIC_ENV', that same line pattern is suppressed from the newly-generated content too -- a one-time opt-out persists across regenerations."
    removal_modes: "RemovePsf deletes both the PSF file and its .bat wrapper. RemoveLogicalPsf deletes ONLY the .bat wrapper, deliberately leaving the PSF file itself on disk (source comment: 'don't delete file physically')."

  msi_and_sfx_share_install_gate:
    doc: docs/classes/pimMSICopier.md, docs/classes/pimSFXCopier.md
    rule: >
      pimMSICopier and pimSFXCopier -- two separate singleton wrapper classes --
      are gated by the SAME external functions, pimOKToRunMsiexec()/
      pimFreeMsiexec() (pim_util/pim_util_src/pimMSI.cxx), rather than each having
      its own independent internal mutex the way pimCopier/pimShortcuts/
      pimRegEdit/pimServices/pimDownloader do. Consequence: at most one of {an
      MSI install, an SFX install} can be in flight process-wide at any moment --
      installing an MSI-packaged product blocks a concurrent SFX-packaged
      product's install, and vice versa.
    mechanism: >
      pimOKToRunMsiexec() is a two-layer gate: (1) a static, file-scope
      in-process thrMutex (msiMutex), guarded by TryLock(); (2) if that succeeds,
      a registry probe of
      HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\InProgress to
      additionally detect an MSI operation running OUTSIDE this process (any
      application's Windows Installer transaction, not just PIM's). Either
      layer failing causes MSIInstall()/SFXInstall() to return false, which
      looks identical to the caller as "PIM is already busy."
    caller_responsibility_gap: >
      Neither pimMSICopier::Status() nor pimSFXCopier::Status() releases this
      gate (via pimFreeMsiexec()) when the owned Loop finishes -- cleanup is
      caller-driven via Release()/Kill(). A caller that polls to a terminal
      status and never calls Release() leaves the shared gate held
      indefinitely, blocking all future MSI AND SFX installs process-wide.

  wrapper_cancel_propagation_split:
    doc: docs/classes/pimCopier.md, docs/classes/pimShortcuts.md, docs/classes/pimRegEdit.md, docs/classes/pimServices.md, docs/classes/pimDownloader.md
    rule: >
      Among the 7 Loop-owner wrapper singletons, Cancel() behaves in two
      confirmed, different ways. pimCopier/pimMSICopier/pimSFXCopier's
      Cancel() sets a flag AND calls the owned Loop's own Cancel() directly
      (propagating cancellation into the running operation). pimShortcuts/
      pimRegEdit/pimServices/pimDownloader's Cancel() sets a flag ONLY -- the
      owned Loop is not told to stop and keeps running to natural completion.
    compensating_idiom: >
      Every confirmed pimEntitlement call site for the 4 flag-only wrappers
      implements the identical idiom: on cancellation, call Cancel(), then
      poll Status() for up to KILL_COUNT iterations waiting for the
      (still-running) Loop to reach CancelFlagSet naturally, and only call
      Kill() if it has not finished by then. This is a deliberate, repeated
      call-site pattern compensating for the flag-only Cancel(), not an
      overlooked defect at those specific call sites -- but a NEW caller that
      invokes Cancel() alone and expects the operation to stop promptly would
      be incorrect for these 4 classes.

  pimservices_lock_does_not_serialize:
    doc: docs/classes/pimServices.md
    rule: >
      pimServices::Create_low() releases its xmlMutex lock IMMEDIATELY after
      starting the pimServiceLoop thread (pimServices.cxx:56), rather than
      holding it for the full operation duration the way all 6 sibling
      wrapper classes do (released only by Status() on completion, or by
      Kill()). The trailing source comment ("xmlMutex lock will be released
      by Copy thread when done") is a stale copy-paste from the sibling
      classes' Create_low() methods and is factually wrong for this class.
    consequence: >
      A second pimServices::Create()/Uninstall() call made while a prior
      pimServiceLoop is still executing will succeed at TryLock() (since it
      is already unlocked) and then delete the still-running pimServiceLoop
      object out from under its own thread -- a confirmed use-after-free /
      destroy-while-running race condition. Currently latent because no
      traced caller in this codebase invokes pimServices concurrently, but
      it is live, reachable code, not gated behind any dead-code marker (the
      same category of live bug as the digital-signature-check no-op, but
      more severe since it is a memory-safety issue, not a missing
      validation). This should be treated as a priority fix candidate: the
      fix is a one-line relocation of the xmlMutex.Unlock() call.

  pimregedit_stale_blocking_comment:
    doc: docs/classes/pimRegEdit.md
    rule: >
      pimRegEdit.h comments Create()/Uninstall() as "these WAIT until they
      are able to start a download and then they return immediately" -- but
      Create_low()'s actual implementation is a non-blocking
      xmlMutex.TryLock() that returns false immediately if busy, identical in
      shape to every sibling wrapper's TryLock-gated methods. The confirmed
      caller (pimEntitlement::ApplyRegistryChanges()) explicitly busy-polls
      with a sleep-and-retry loop on a false return, which would be
      unnecessary if the method actually blocked. This is a
      confirmed comment/implementation mismatch -- trust the implementation
      and the call-site usage, not the header comment, per this
      documentation effort's standing rule to prefer implementation over
      comments/naming.

  pimshortcutmgr_areschangespending_misses_add_remove:
    doc: docs/classes/pimShortcutMgr.md
    rule: >
      pimShortcutMgr::AreChangesPending(cmp_to) iterates only over
      this->GetAllShortcutIDs() and, for each id, compares fields ONLY if
      cmp_to.GetShortcutInfoByID(id, ...) returns true (i.e. the id also
      exists in cmp_to). A shortcut id present in `this` but absent from
      `cmp_to` (newly added) is silently skipped; a shortcut id present in
      `cmp_to` but absent from `this` (removed) is never even considered,
      since the outer loop only walks `this`'s own id list. The method can
      therefore only detect a shortcut that exists in BOTH compared XML
      snapshots and has different label/package/location-create values --
      never a pure addition or removal.
    consequence: >
      Confirmed real use: pim_core/pim_core_src/pimEntitlement.cxx calls
      AreChangesPending() (comparing the new/current entitlement's XML
      against the previously-installed one) as part of the decision logic
      for whether an update/reconfigure needs to do any shortcut-related
      work. A product XML revision that adds or removes a <SHORTCUT>
      definition entirely -- without also changing an existing, shared-id
      shortcut's own fields -- would not by itself cause this check to
      report a pending change, potentially causing an update to skip needed
      shortcut installation/removal work.

  pimsilentfixupshortcuts_array_index_bug:
    doc: docs/classes/pimShortcutMgr.md
    rule: >
      pim_core/pim_core_src/pimSilent.cxx's pimSilentFixupShortcuts()
      (lines 447-460) iterates `for (i = 0; i < A_wants.GetSize(); i++)`
      and, having confirmed A_wants[i] is also a valid id in B_avail via
      B_avail.Find(A_wants[i]) != -1, correctly uses A_wants[i] as the id
      argument for the Programs-Menu and start-dir get/set calls a few lines
      later (lines 462-466) -- but for the 4 immediately preceding
      location-state calls (SetShortcutStartMenuState/
      SetShortcutProgramsMenuState/SetShortcutDesktopState/
      SetShortcutQuicklaunchState, lines 457-460), it uses B_avail[i]
      instead -- the element at loop index i in a DIFFERENT array that is
      not guaranteed to share A_wants's document order.
    consequence: >
      Whenever A_wants and B_avail's underlying <SHORTCUT> node orders
      diverge (a realistic condition, since they come from two independently
      populated XML documents), B_avail[i] can name a completely different
      shortcut id than the one just matched via A_wants[i] -- applying the
      wrong location-toggle state to the wrong shortcut during a silent/
      scripted install's shortcut-settings fixup. This is a defect in the
      caller (pimSilent.cxx), not in pimShortcutMgr itself, but was found
      directly through this documentation effort's research into
      pimShortcutMgr's confirmed call sites. Fix: replace B_avail[i] with
      A_wants[i] in those 4 calls, matching the correct pattern already used
      two calls later in the same block.
      FIX VERIFIED (SUFFICIENT), found in a further, dedicated pass
      specifically verifying this proposed fix: the enclosing
      `if (B_avail.Find(A_wants[i]) != -1)` guard already proves A_wants[i]
      exists in Eb's document, so substituting it for B_avail[i] guarantees
      pimShortcutMgr::FindShortcutNode() (pimShortcutMgr.cxx:417-424, called
      inside SetShortcutState(), :426-454) locates the same, correct
      shortcut -- eliminating the wrong-shortcut risk with no residual gap.
      No staleness risk either: B_avail is captured once, before either
      loop begins, and nothing in pimSilentFixupShortcuts() mutates Eb's
      document structure, so the snapshot stays valid throughout.
      NEW LIMITATION, found in the same pass: all 4 of
      SetShortcutStartMenuState()/SetShortcutProgramsMenuState()/
      SetShortcutDesktopState()/SetShortcutQuicklaunchState() delegate
      identically to the shared SetShortcutState() primitive, which can
      legitimately return false for a CORRECTLY IDENTIFIED shortcut
      whenever that shortcut's specific location child element
      (<STARTMENU>/<PROGRAMSMENU>/<DESKTOP>/<QUICKLAUNCH>) is absent (all 4
      confirmed independently optional per shortcut) -- none of the 4
      array-index call sites check this return value, fix or no fix, so a
      fully-corrected caller can still silently no-op a requested location
      toggle. VERIFIED NON-ISSUE, found in the same pass:
      GetShortcutInfoByID()'s (pimShortcutMgr.cxx:29-101) own discarded
      return value and its once-outside-the-loop sm/pm/dt/ql output
      booleans are NOT reachable as a staleness bug here -- A_wants[i] is
      sourced from the same document's own GetAllShortcutIDs() scan by the
      same id attribute FindShortcutNode() matches on, so the node is
      always found, and the function pre-initializes all 4 output booleans
      to false before scanning children. ADJACENT PRE-EXISTING RISK, found
      in the same trace: GetAllShortcutIDs() (pimShortcutMgr.cxx:312-313)
      dereferences its id-attribute node's getNodeValue() with no null
      check -- a latent crash if any <SHORTCUT> node ever lacks an id
      attribute, underlying both A_wants and B_avail alike.

  pimmsiloop_fallback_causes_repeated_reinstall:
    doc: docs/classes/pimMSILoop.md
    rule: >
      pimMSILoop::OnInstall() (the MSI-API execution strategy, active when
      use_msiexec is false) declares a fallback_to_msiexec flag before its
      per-<MSI>-node loop, sets it to true (and NEVER resets it) the first
      time a node's <INSTALL> command line can't be pattern-matched for a
      property list, and checks it at the END OF EVERY remaining loop
      iteration (pim_core/pim_core_src/pimMSILoop.cxx:831-832) rather than
      once after the loop finishes. Once set, every subsequent iteration of
      OnInstall()'s own loop triggers a full, independent call to
      pimMSIExec(), which itself re-scans and attempts to install EVERY
      eligible <MSI> node in the entire document.
    consequence: >
      Because pimMSIExec()'s own IsEligibleForInstall() gate checks only the
      install="Y" selection attribute and NOT the separate installed
      (past-tense) attribute, a package already successfully installed
      earlier in the same OnInstall() call (via the API path) would be
      considered eligible again on every one of these repeated pimMSIExec()
      passes and silently reinstalled via msiexec.exe. Worst case (the
      first <MSI> node triggers the fallback): every one of the remaining
      N-1 nodes' iterations each launches a full re-scan-and-install pass
      over all N nodes, an O(N^2) blowup in redundant msiexec.exe launches.
      Reproduces only when use_msiexec is false (the MSI-API path is
      active, e.g. via MSIVERSION_PROPERTY >= "4.0" with no USE_MSIEXEC
      override) and at least one <MSI> node lacks a format attribute, has
      an empty property list, and its <INSTALL> command text doesn't match
      the `*/I "[MSI]"*` pattern this code looks for -- the code's own
      comment describes this as an "older XML" scenario, so it is reachable
      for legacy product definitions, not purely hypothetical. This is the
      single highest-severity finding across this entire documentation
      effort.

  pimmsiloop_same_msihybrid_is_dead:
    doc: docs/classes/pimMSILoop.md
    rule: >
      pimMSILoop::OnInstall() reads the same_msihybrid XML property in a
      first pass over its <MSI> node list and logs a debug message
      ("same_msihybrid detected so NO MSI called again !!") suggesting an
      intent to skip redundant processing -- but that first loop has no
      other effect (sets no flag, populates no accumulator), and the second
      loop that actually performs installs never checks same_msihybrid at
      all, nor does pimMSIExec(). The property is confirmed inert for skip
      purposes anywhere in this file, despite its name and the debug log
      wording strongly implying it should suppress something.
    caution: >
      Do not assume same_msihybrid currently prevents a redundant MSI
      install in the traced code paths -- confirm with the original team
      whether a different mechanism (e.g. pimEntitlement-level gating,
      outside this file) now supersedes it before either removing this
      vestigial loop or relying on the property continuing to be honored.

  pimregeditloop_rollback_skips_half_of_entries:
    doc: docs/classes/pimRegEditLoop.md
    rule: >
      pimRegEditLoop::OnRollback()'s node-list loop double-increments its
      iteration index: the enclosing for statement's own index++ increment
      clause AND an explicit item(index++) call inside the loop body both
      fire per iteration, advancing by 2 instead of 1
      (pim_core/pim_core_src/pimRegEditLoop.cxx:255 and :267). Since index
      always resets to 0 at the start of each pass of the outer
      while(rolled_back_something) retry loop, odd-indexed <REGISTRY> nodes
      are NEVER visited, on any pass, no matter how many retries occur --
      this is confirmed by direct contrast with OnInstall()'s correctly
      single-incrementing equivalent loop in the same file.
    consequence: >
      An uninstall or rollback of a product with registry entries can leave
      up to roughly half of them behind in the registry, with their
      installed="Y" XML attribute never cleared -- so a subsequent uninstall
      attempt would deterministically skip the same entries again (the bug
      is positional, not data-dependent). This is the single
      highest-confidence, highest-impact finding across this entire
      documentation effort. Treat as a priority fix candidate: the fix is
      removing one of the two increments (most likely the explicit
      item(index++) call, to match OnInstall()'s pattern), followed by
      re-verifying against Remove()'s own bottom-up (leaf-before-parent)
      subkey-deletion ordering constraint that the outer retry loop exists
      to accommodate.

  registry_root_tokens:
    doc: docs/07_registry_usage.md §2.1
    rule: "Product XML <REGISTRY> elements select a hive via exactly one of 4 literal tokens: [HKCR], [HKLM], [HKCU], [HKU]. Any other value silently fails (Create() returns false, no diagnostic)."

  reg_file_admin_mirror:
    doc: docs/07_registry_usage.md §4
    rule: "Every successful XML-declared registry write (Mechanism 1 only, not the hardcoded pim_util bookkeeping writes) is mirrored into a human-readable .reg file via pimRegFileCreate, explicitly for admins replaying the same changes when cloning an install to another host."

  piminstallmgrdlg_stepback_stepforward_asymmetry:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      pimInstallMgrDlg::StepForward() and StepBack() each implement the
      wizard's step-order state machine as a hand-written, hardcoded
      if/else-if chain comparing CurrentLayout (a uiLayout*) by pointer
      identity against each named layout member -- there is no shared,
      table-driven step-order data structure the two directions both
      consult. Direct side-by-side comparison of the two chains' guard
      conditions (the same technique that surfaced the confirmed
      pimRegEditLoop and pimMSILoop bugs) found StepForward()'s guard for
      skipping the Customize Apps step (when currentProduct == NULL) has
      no corresponding guard in StepBack()'s chain for the reverse
      transition out of the Installation step -- see
      pim_ui/pim_ui_src/pimInstallMgrActions.cxx's StepForward()/StepBack()
      bodies.
    consequence: >
      A session that steps forward past ApplicationUpdateLayout with
      currentProduct == NULL (skipping CustomizeAppsLayout per
      StepForward()'s guard) and then steps back from the Installation
      step can have StepBack() route through CustomizeAppsLayout anyway,
      since its own guard does not mirror StepForward()'s condition --
      landing the wizard on a tab it never actually visited going forward,
      with whatever UI state that tab was last left in. Because any new
      wizard step must be added to BOTH functions by hand, this is also a
      standing landmine for future step additions, not just the one
      confirmed instance.

  piminstallmgrdlg_updateparent_child_duplication:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      pimInstallMgrDlg::UpdateParentEntitlements()/UpdateChildEntitlements()
      and the nested uiCustomAppTree class's own
      UpdateParentEntitlements()/UpdateChildEntitlements() (both pairs
      defined consecutively in pim_ui/pim_ui_src/pimInstallMgrDlg.cxx) are
      near-identical implementations of the same parent/child
      language-platform-selection propagation logic (including the WGM
      uwgm.xml adapter special case), differing only by a stray "//pradumn"
      comment -- confirmed by reading both bodies back-to-back line by
      line. Neither copy calls or delegates to the other.
    consequence: >
      A fix or behavior change to the propagation logic (e.g. a new
      language/platform selection rule, or a change to how the WGM
      uwgm.xml special case is handled) applied to only one of the two
      copies leaves the other silently out of sync, so the
      pimInstallMgrDlg-driven and uiCustomAppTree-driven code paths can
      diverge and produce different parent/child entitlement results for
      what should be the same product-selection XML change. Any
      modification here must be applied to both copies in the same file.

  piminstallmgrdlg_refreshfeaturetab_and_helptab_dead:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      pimInstallMgrDlg::RefreshFeatureTab() is confirmed to be a permanent
      no-op in the traced code path (it returns before performing any
      refresh work), and OnTabSelect()'s Help/Advanced-tab branch is
      confirmed unreachable in the traced conditions. Both were found by
      reading RefreshDlg()'s and OnTabSelect()'s full dispatch bodies
      alongside the other Refresh*Tab()/tab-select branches for
      comparison, the same side-by-side technique used for the
      StepForward()/StepBack() finding above.
    caution: >
      Do not assume RefreshFeatureTab() or the Help/Advanced tab-select
      branch currently do anything, and do not "clean up" either as dead
      code without first confirming (e.g. via a build flag, licensing
      state, or other runtime condition not visible in this archive) that
      no code path can still reach them -- per this documentation effort's
      standing rule to mark unconfirmed absence as UNKNOWN rather than
      asserted.

  piminstallmgrdlg_setporterror_message_id_bug:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      pimInstallMgrDlg::SetPortError() is confirmed to display the wrong
      message-catalog ID for at least one caller in the license-server
      port-validation cluster (SetAndValidateLicenseServerPorts() and its
      helpers) -- a syntactically-invalid port value (out of the valid
      numeric range) reaches a call to SetPortError() using the message ID
      intended for a different validation failure, rather than an
      out-of-range-specific message.
    consequence: >
      A user entering an out-of-range license-server port value (e.g.
      70000) sees a message text that does not accurately describe why
      validation failed, which can mislead a user or support engineer
      diagnosing a port-configuration problem during interactive install.
      Note: SetAndValidateLicenseServerPorts()'s separate disabling of
      EPORT-specific validation is a CONFIRMED INTENTIONAL behavior, not a
      bug -- do not conflate the two when investigating port-validation
      complaints.

  pimcustomdlg_is_not_dead_code:
    doc: docs/classes/pimCustomDlg.md
    rule: >
      pimCustomDlg was flagged in an earlier pass (while documenting
      pimInstallMgrDlg) as "likely superseded, not confirmed dead," based on
      its near-identical method-name overlap with pimInstallMgrDlg's
      embedded Customize tab and its own header's revision history
      appearing to stop in 2018. A full source read CORRECTS this: it is a
      live, currently-invoked, standalone "Customize" popup dialog with 2
      confirmed call sites (pimInstallMgrDlg::OnPushButtonActivate()'s
      CustomizeBtn branch in pim_ui/pim_ui_src/pimInstallMgrActions.cxx:649,
      and pimEntitlementTree::OnPushButtonActivate()'s per-row
      customize-icon handler in pim_ui/pim_ui_src/pimEntitlementTree.cxx:1338),
      and pim_ui_src.cxx directly #includes pimCustomDlg.cxx into the unity
      build.
    caution: >
      This is a documentation-methodology lesson, not just a code fact: a
      method-name overlap and an apparently-stale revision history are
      suggestive but NOT sufficient evidence that a class is dead. Before
      characterizing any class as superseded/legacy/dead in this
      documentation set (or when relying on such a characterization already
      written here), grep the whole archive for remaining construction
      sites of it, as was eventually done for this class -- do not stop at
      "no evidence of use found" when the search itself was incomplete.

  pimcustomdlg_sab_methods_guard_wrong_static_handle:
    doc: docs/classes/pimCustomDlg.md
    rule: >
      pim_ui/pim_ui_src/pimSAB.cxx declares 2 separate process-wide static
      uit_smart_ab_t handles: main_dlg_sab_handle (set only by
      pimInstallMgrDlg::InitSAB()) and help_dlg_sab_handle (set only by
      pimCustomDlg::InitSAB()). pimCustomDlg::SetSABPath()/DisableSAB()/
      EnableSAB() (pimSAB.cxx:509-556) all guard on
      `if (main_dlg_sab_handle)` -- the OTHER class's handle -- before
      acting on help_dlg_sab_handle (SetSABPath() checks the wrong handle
      but still correctly operates on help_dlg_sab_handle in its body;
      DisableSAB()/EnableSAB() do the same). Confirmed by direct contrast
      with pimCustomDlg::ShowSAB()/HideSAB()/IsSABTextMode(), which use no
      guard or the correct help_dlg_sab_handle, and with pimInstallMgrDlg's
      own 5 SAB methods, which all correctly guard on main_dlg_sab_handle.
    consequence: >
      If pimCustomDlg::Display() is ever reached in a process where
      pimInstallMgrDlg::InitSAB() has not already run and set
      main_dlg_sab_handle to non-NULL, pimCustomDlg's own Help/Advanced
      SAB path-setting and enable/disable calls silently no-op (return
      false, nothing logged) even though help_dlg_sab_handle itself is
      valid. In both confirmed call sites, pimInstallMgrDlg is the main
      wizard dialog and has almost certainly already run InitSAB() by the
      time either CustomizeBtn or the entitlement-tree customize icon can
      be clicked -- which is very likely why this has never been observed
      as a visible failure. This masking is coincidental (a non-NULL check
      on the wrong variable, not a correct cross-class synchronization), so
      it should not be relied on: any future code path reaching
      pimCustomDlg::Display() before pimInstallMgrDlg::InitSAB() has run
      (or in a process that never constructs pimInstallMgrDlg at all) would
      hit a silently broken Help/Advanced address bar. Fix: change the 3
      guards from `main_dlg_sab_handle` to `help_dlg_sab_handle`.

  pimentitlementtree_customize_icon_ignores_clicked_row:
    doc: docs/classes/pimCustomDlg.md
    rule: >
      pimEntitlementTree::OnPushButtonActivate() (the per-row "customize"
      icon-column button handler, pim_ui/pim_ui_src/pimEntitlementTree.cxx:1328-1348)
      resolves the specific pimEntitlement for the clicked row via
      `pushed.GetUserData((void **)&E)` (line 1335) but never passes it to
      the pimCustomDlg it then constructs -- pimCustomDlg::Initialize()'s
      signature accepts only a pimSessionInfo*, with no parameter for a
      target entitlement anywhere in the class's public API.
    consequence: >
      Clicking the customize icon on any row in the entitlement tree opens
      the same Customize dialog defaulting to the SAME product every time
      (pimCustomDlg::EntitlementRefresh() always auto-selects the first
      enumeration-order entitlement that is installable/reconfigurable and
      SupportCustomize()-capable), regardless of which row's icon was
      clicked. The user can still reach the intended product manually via
      the dialog's own product-picker list, so this is a confirmed UX gap,
      not a data-correctness bug -- but the per-row button's implied
      promise ("customize THIS product") is not honored by the
      implementation.

  pimentitlementtree_optionmenuselect_null_deref:
    doc: docs/classes/pimEntitlementTree.md
    rule: >
      pimEntitlementTree::OnOptionMenuSelect() (the version/shipcode
      dropdown handler, pim_ui/pim_ui_src/pimEntitlementTree.cxx:1875-1881)
      calls `eptr_new_xml = MD.GetProductXml(mediaid, E->GetTag());` then
      `if (eptr_new_xml) { eptr_new_xml->DoWrite(NULL); ... }` -- but the
      very next line, `eptr_new_xml->SetXml(E->GetTag());`, executes
      UNCONDITIONALLY, outside that guard. The function's own later code
      (`if (E && new_xml && eptr_new_xml)` at line 1904) proves the author
      knew `eptr_new_xml` could be NULL at this point -- but that check
      comes after the unconditional dereference already ran. Confirmed by
      contrast with 2 structurally similar, later blocks in the SAME
      function (the "shares same parent" and "is parent" branches, ~lines
      1940-1946 and 1982-1988), which pass their own `eptr_new_xml` result
      into `aPtr->Init(eptr_new_xml, ...)` as a parameter rather than
      dereferencing it directly -- the safe pattern this first occurrence
      does not follow.
    consequence: >
      Changing a row's version/shipcode dropdown selection, for a product
      not already locally known (`E->Init(NULL, new_xml, mediaid)` returns
      `false`), crashes the installer with a null-pointer dereference if
      `pimGetMediaDetails::GetProductXml()` returns `NULL` for that specific
      media ID + product tag combination -- a real, reachable failure mode
      (a media-server lookup failure for a specific SKU), not a purely
      theoretical one. Fix: move `eptr_new_xml->SetXml(E->GetTag());` inside
      the `if (eptr_new_xml)` block above it, or add an early return/guard
      before it.

  pimentitlementtree_reconfiguredisplay_low_only_one_off_by_one:
    doc: docs/classes/pimEntitlementTree.md
    rule: >
      pimEntitlementTree::ReconfigureDisplay_low()'s `only_one` branch
      (pim_ui/pim_ui_src/pimEntitlementTree.cxx:1518-1520) computes
      `str = "_" + use_type;` (e.g. `"_Creo_app"`, 9 characters, since
      `use_type` is always `"<family>_app"`) and then calls
      `SetNodeState(str(0, str.GetLength()-5), true)` /
      `SetNodeCheckboxSensitive(str(0, str.GetLength()-5), false)`. Since
      the `"_app"` suffix being stripped is exactly 4 characters, the
      correct offset is `GetLength()-4`; `GetLength()-5` drops one
      character too many, producing `"_Cre"` instead of the intended
      `"_Creo"` family-group node id. Confirmed by direct contrast with the
      correctly-computed sibling id extraction in `UpdateGroupStatus()` in
      the same file (`grp_node(1, grp_node.GetSize()-1)`, which correctly
      strips only the leading underscore).
    consequence: >
      `UpdateDisplay(NULL)` passes `only_one=true` to `ReconfigureDisplay_low()`
      exactly when there is 1 entitlement in the tree (a single-product
      reconfigure session). In that case, the malformed node id targets a
      node that does not exist in the tree, so the family-group node's
      checkbox is never actually forced to checked+insensitive as the
      `only_one` branch intends -- it silently no-ops, leaving the
      family-level checkbox in whatever state it last had. A deterministic,
      always-reproducing bug for this scenario (not data-dependent on which
      family is involved), though of low-to-moderate user-visible severity
      (a checkbox cosmetic/consistency issue rather than a data-loss risk).
      Fix: change `GetLength() -5` to `GetLength() -4` in both calls.

  pimfrictionlesstrialdlg_display_never_processes_completion:
    doc: docs/classes/pimFrictionlessTrialDlg.md
    rule: >
      pimFrictionlessTrialDlg::Display()'s in-house-mode branch
      (pim_ui/pim_ui_src/pimFrictionlessTrialDlg.cxx:265-270) reads:
      ```
      if (pimGetInHouseMode()==1 || pimGetInHouseMode() == 2)
      {
          FrictionlessLicenseGenerate();
          Sleep(60000);
          return true;
      }
      if (uiDialog::Activate())
          return true;
      ```
      `FrictionlessLicenseGenerate()` XNew's a
      `pimFrictionlessTrialLicenseGet` (or `pimPTCLicenseGet`) worker, calls
      its `Execute()` (which starts a background `pimFrictionlessTrialGenerateLoop`
      -- a `pimLoop` subclass), and arms a 1-tick `LicenseGenerateTimer` meant
      to poll it via `OnTimerExpired()`. But the very next statement is a raw
      `Sleep(60000)`, NOT `uiDialog::Activate()` -- the modal event loop that
      is the only thing that can deliver timer ticks to `OnTimerExpired()`.
      An archive-wide grep confirms `OnTimerExpired()`'s `ptr->HeartBeat()`
      call (line 220) is the ONLY call site for
      `pimFrictionlessTrialLicenseGet::HeartBeat()` anywhere in this
      codebase, and `HeartBeat()`'s own body
      (pim_ui/pim_ui_src/pimFrictionlessTrialLicenseGet.cxx:84-427) is where
      the retrieved license text is parsed, saved to disk, registered via
      `pimSessionInfo::AddLicenseSource()`, and used to update/remove the
      local PSF via `pimUpdatePSF()`/`pimRemovePSF()`.
    consequence: >
      `pimFrictionlessTrialRun()` (`pim/pim_src/pimTop.cxx:1094`), this
      class's ONLY confirmed construction site, always calls
      `pimSetInHouseMode(1)` or `pimSetInHouseMode(2)` immediately before
      `Display()` whenever `argv[6]` is `"-frictionless_reg"` or
      `"-trial_reg"` -- the 2 argument values this entry point exists for.
      So for the only confirmed real usage of this class, `Display()` NEVER
      runs `Activate()`, meaning `HeartBeat()` is NEVER called, meaning the
      entire license-save/PSF-update completion pipeline NEVER executes --
      regardless of whether the background FLEXnet network operation itself
      succeeds within the 60-second sleep window. `Display()` unconditionally
      returns `true` regardless of actual outcome, and the freshly-`XNew`'d
      worker object is never `delete`d either (only `OnTimerExpired()` frees
      it) -- a confirmed memory leak stacked on the functional bug. Fix:
      make the in-house-mode branch actually process timer ticks (e.g. call
      `uiDialog::Activate()` instead of/in addition to `Sleep(60000)`, or
      poll `HeartBeat()` directly in a loop) before returning.

  pimfrictionlesstrialdlg_vestigial_shared_interface_methods:
    doc: docs/classes/pimFrictionlessTrialDlg.md
    rule: >
      pimFrictionlessTrialDlg::SetURL()/GetAuth() implement the same method
      signatures as pimAuthDlg::SetURL()/GetAuth() and rpimDlg::GetAuth(),
      but an archive-wide grep confirms zero callers for either method on a
      pimFrictionlessTrialDlg instance specifically (the other classes' own
      SetURL()/GetAuth() calls in pim_ui_src/pimAuthDlg.cxx target their own
      respective instances, not this class). The private Refresh() method
      and the URL member (set by SetURL() but never read by this class) are
      likewise confirmed dead. A file-scope `frictionlessDlg` static
      self-pointer is set in the constructor with a "create function to
      return this to outside use" comment, but no such accessor function
      was ever written -- unlike the structurally similar
      pimInstallMgrDlg::MainUIDialog/GetMainUIDialog() and pimAuthDlg's own
      AuthDialog static, which DO have working accessors.
    caution: >
      Do not assume pimFrictionlessTrialDlg::SetURL()/GetAuth() are wired
      into any real caller just because sibling classes with the same
      signatures are actively used -- verify a concrete call site exists
      before relying on or extending these methods. This is a
      documentation-methodology reminder as much as a code fact: matching
      method signatures across sibling classes is not evidence that all of
      them are equally load-bearing.

  rpimdlg_display_confirms_pimfrictionlesstrialdlg_bug_is_avoidable:
    doc: docs/classes/rpimDlg.md
    rule: >
      rpimDlg::Display() (pim_ui/pim_ui_src/rpimDlg.cxx:204-213) is:
      ```
      bool rpimDlg::Display()
      {
          if (uiDialog::Display())
          {
              if (uiDialog::Activate())
                  return true;
              initialized = false;
          }
          return false;
      }
      ```
      -- an unconditional call to `uiDialog::Activate()`, with no
      mode-dependent branch and no `Sleep()` call. rpimDlg is structurally
      near-identical to pimFrictionlessTrialDlg (same LicenseGenerateTimer/
      RenewLicenseButton/ContinueButton/SetURL()/GetAuth()/private Refresh()
      shape) and 3 years older (created 2015-09-29 vs. 2018-11-27, per each
      class's own `$$1` revision entry), strongly suggesting
      pimFrictionlessTrialDlg was cloned from this class or a close relative.
    caution: >
      This is documentation-methodology evidence, not just a code fact: use
      this class's correct `Display()` implementation as the reference
      pattern when fixing `pimfrictionlesstrialdlg_display_never_processes_completion`
      (see `docs/classes/pimFrictionlessTrialDlg.md`) -- it proves that bug
      is a genuine, avoidable defect specific to the in-house-mode branch,
      not an unavoidable consequence of this shared dialog family's
      LicenseGenerateTimer/OnTimerExpired() polling design. Do not assume
      the 2 classes' shared design is inherently broken; only
      pimFrictionlessTrialDlg's specific implementation is.

  rpimdlg_vestigial_shared_interface_methods:
    doc: docs/classes/rpimDlg.md
    rule: >
      rpimDlg::SetURL()/GetAuth() implement the same method signatures as
      pimAuthDlg::SetURL()/GetAuth() (and pimFrictionlessTrialDlg's own
      copies of the same signatures), but an archive-wide grep confirms
      zero callers for either method on an rpimDlg instance specifically.
      The `RetryMsg` member (declared identically on pimAuthDlg,
      pimFrictionlessTrialDlg, and rpimDlg) is confirmed fully dead on
      rpimDlg -- never read or written anywhere in this class, and rpimDlg
      does not even declare a `SetRetryMsg()` method (unlike pimAuthDlg,
      which fully wires `RetryMsg` through to a visible `AuthRetryLabel` via
      `SetRetryMsg()`, confirmed in `pim_ui_src/pimAuthDlg.cxx:98-173`). The
      file-scope `rDlg` static self-pointer (set in the constructor with a
      "create function to return this to outside use" comment) has no
      accessor function anywhere and is never read -- the same
      never-completed "static self-registering pointer" idiom found on
      `pimFrictionlessTrialDlg`'s `frictionlessDlg` static.
    caution: >
      Do not assume rpimDlg::SetURL()/GetAuth() are wired into any real
      caller just because sibling classes with the same signatures are
      actively used. NOTE the asymmetry, though: rpimDlg::Refresh() IS
      confirmed actively used (called from OnInputPanelInput()) even though
      SetURL()/GetAuth()/RetryMsg are not -- do not over-generalize "this
      class is a partial copy" into "every method on this class is
      vestigial." Verify each method independently.

  pimauthdlg_initialize_missing_idempotency_guard_on_reused_singleton:
    doc: docs/classes/pimAuthDlg.md
    rule: >
      pimAuthDlg::Initialize() (pim_ui/pim_ui_src/pimAuthDlg.cxx:146-154) has
      no `if (initialized) return true;` guard -- unlike
      rpimDlg::Initialize()/pimFrictionlessTrialDlg::Initialize(), which both
      have one. This matters specifically for pimAuthDlg because it is the
      ONE class in this 3-class dialog family (pimAuthDlg/rpimDlg/
      pimFrictionlessTrialDlg) confirmed to actually be REUSED: `AuthDialog`
      is a heap singleton (`static pimAuthDlg *AuthDialog`, `XNew`'d once by
      whichever of `pimInitAuthenticationCB()`/`pimNonBrowserAuthenticationCB()`
      runs first, never `delete`d or reset), and
      `pimNonBrowserAuthenticationCB()` -- the function that calls
      `Initialize()`/`Display()` on it -- is confirmed called from a real
      `do`/`while` retry loop in `pimSessionInfo::TryAuthorize()`
      (`pim_core/pim_core_src/pimSessionInfo.cxx:1911-1984`), re-invoked on
      every loop iteration where cached credentials are missing or empty,
      plus 2 further confirmed call paths
      (`pimGetAvailable::GetSecurity(bool retry)`, `pimPTCLicenseGet.cxx`).
      Both derivative classes, by contrast, are constructed as a fresh
      stack-local object exactly once per process and never re-`Initialize()`d.
    consequence: >
      Whether a 2nd `uiDialog::Initialize()` call on an already-initialized
      `pimAuthDlg` instance is safe (an idempotent no-op) or causes duplicate
      component registration/resource re-acquisition depends on `uiDialog`'s
      own implementation, which is not present in this archive -- this is a
      confirmed structural gap with an unconfirmed severity ceiling, not an
      asserted crash. Do not assume repeated authentication challenges within
      one process (a realistic scenario: multiple distinct PTC.com URLs each
      requiring credentials, or a retry after a first failed attempt) are
      handled safely without first confirming `uiDialog::Initialize()`'s own
      re-entry behavior, or adding the same idempotency guard already present
      on this class's 2 sibling classes.

  pimauthdlg_url_member_dead_even_in_original:
    doc: docs/classes/pimAuthDlg.md
    rule: >
      pimAuthDlg::SetURL() genuinely IS called (2 confirmed sites, both in
      `pim_ui/pim_ui_src/pimAuthDlg.cxx` itself: `pimRequestForUserPwd()` and
      `pimNonBrowserAuthenticationCB()`) -- unlike its 2 structurally
      identical copies on `rpimDlg`/`pimFrictionlessTrialDlg`, which have
      zero callers anywhere in this archive. However, the `URL` member that
      `SetURL()` populates is never read anywhere in `pimAuthDlg.cxx` either
      -- confirmed write-only even in this, the 2011 original template both
      later classes were partially copied from.
    caution: >
      This refines, not contradicts, the earlier `rpimDlg`/
      `pimFrictionlessTrialDlg` findings: it is the `SetURL()` *method call*
      that stopped happening in the 2 later copies (their own `SetURL()` has
      zero callers), not a previously-useful stored `URL` value that became
      useless through copying -- the stored value was already unused in the
      original. Contrast with `RetryMsg`, which genuinely is read (in
      `Display()`, via `AuthRetryLabel.SetWLabel(RetryMsg)`) -- so within this
      one class, `URL` and `RetryMsg` are NOT uniformly dead despite sharing
      an identical declaration line. Also note `GetAuth()`'s `bool` return
      value is always `false` and is ignored by both of its confirmed
      callers (relying instead on `pimNonBrowserAuthenticationCB()`'s own
      checked return value for success/failure) -- a misleading API surface,
      though fully inert in every traced call site.

  pimentitlementrefresh_school_beta_wait_loop_never_terminates:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      `pimInstallMgrDlg::EntitlementRefresh()` (`pim_ui/pim_ui_src/pimEntitlementRefresh.cxx:304-750`)
      contains 3 structurally identical polling blocks -- one per Trial/
      School/Beta trial-license mode -- each waiting for
      `SessionInfo->GetXMLPtr()->GetNextNodelistItem(pimLICENSEPREFIX, true)`
      to become non-`NULL` after a license-generation `HeartBeat()` call. The
      Trial-mode block (`:376-401`) uses the correct guard,
      `} while (test == NULL && ++max <= 40);`, followed by an
      `if (test == NULL) { <error dialog>; return; }` fallback. The
      School-mode block (`:466-471`) and Beta-mode block (`:535-539`) are
      near-verbatim copies, but both were changed to
      `} while (test == NULL || ++max >= 40);` with no follow-up null-check
      at all. Because `||` short-circuits on its left operand, `++max` is
      never evaluated while `test` stays `NULL` -- C++ only evaluates the
      right side of `||` when the left side is `false` -- so if the School
      or Beta trial license never parses, `max` never advances past 0 and
      the loop never terminates.
    consequence: >
      A School- or Beta-mode trial install whose license file fails to parse
      hangs the entire installer wizard indefinitely in a tight
      `Sleep(0.1s)`-then-poll cycle, with no timeout, no error dialog, and no
      way out short of killing the process -- confirmed by direct comparison
      against the correct, error-handled Trial-mode sibling loop a few lines
      above in the same function. Any fix must restore the `&&`/`<=` guard
      AND add the missing null-check/error-dialog fallback that the
      School/Beta copies also dropped.

  pimentitlementrefresh_issufficientspace_missing_else:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      `pimInstallMgrDlg::IsSufficientSpace()` (`pim_ui/pim_ui_src/pimEntitlementRefresh.cxx:1447-1456`)
      computes a per-entitlement `dbl` size via:
      `dbl = 0.0; if (<same-version-installed>) dbl = 0.0; else if (IsParentOnly()) dbl = 300MB;`
      followed immediately, with no `else`, by an unconditional
      `SessionInfo->GetEntitlement(i)->GetSize(dbl);` call that overwrites
      whatever the `if`/`else if` just computed. The structurally identical
      logic 400 lines earlier in the same file,
      `EntitlementRefresh_updateSpace()` (`:1085-1089`), uses the required
      `else`: `if (<same-version-installed>) dbl = 0.0; else GetSize(dbl);`.
    consequence: >
      `IsSufficientSpace()`'s "already installed at the same version costs 0
      bytes" and "parent-only entitlement costs a flat 300MB" special cases
      have no effect on the space total this function computes -- every
      entitlement's cost is always recomputed from `GetSize()` regardless.
      Practical effect: the disk-space gate on the Applications-screen Next
      button (called from `pim_ui_src/pimInstallMgrActions.cxx:1034`) can be
      stricter than intended for these 2 cases. Confirmed by direct
      cross-comparison with the correctly-guarded sibling function in the
      same file -- the same technique used throughout this documentation
      effort to distinguish real bugs from intentional behavior.

  pimentitlementrefresh_uicheckbuttoncell_dead_code:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      `uiCheckButtonCell` (declared `pim_ui/includes/pimInstallMgrDlg.h:277-296`,
      fully implemented `pim_ui/pim_ui_src/pimEntitlementRefresh.cxx:129-273`)
      has no live caller anywhere in this archive. Its only would-be
      consumer -- `pimInstallMgrDlg::CreateQAgentButton()` /
      `CreatedQAgentBtns` -- is declared exclusively inside the nested
      `uiApplicationsList` class, which is itself wrapped in a class-wide
      `#if 0` block (`pimInstallMgrDlg.h:298-330`). An archive-wide grep for
      `uiCheckButtonCell` finds no `XNew uiCheckButtonCell(...)` construction
      site anywhere outside the class's own constructor definition.
      Additionally, both `SetAlignedLabel()` overloads are independently
      hard-disabled even if a caller were reintroduced: each is wrapped in
      its own `#if 0 // Eyal does not want labels` block, unconditionally
      `return false;` (`:250-266`).
    caution: >
      This is one of the few `#if 0` blocks in this codebase with a named,
      in-comment rationale ("Eyal does not want labels"), compared to the
      many unexplained `#if 0` blocks catalogued elsewhere in this
      documentation set. Anyone reviving `uiApplicationsList` (and therefore
      `uiCheckButtonCell`) would also need to separately decide whether to
      re-enable the label feature the `SetAlignedLabel()` overloads exist to
      provide, since disabling it appears to have been a deliberate,
      attributed decision, not an oversight.

  pimentitlementrefresh_hide_customize_screen_contradictory:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      `getenv("PIM_HIDE_CUSTOMIZE_SCREEN")` is checked at 4 distinct sites in
      `pim_ui_src/pimEntitlementRefresh.cxx`, with directly contradictory
      effect. Consistent with the name ("hide/skip Customize when set"):
      `EntitlementRefresh()`'s `new`-mode initial check (`:608-609`,
      `CustomizeBtn.SetVisible(false)` when set) and its per-entitlement loop
      (`:665-666`, same effect). Contradicting the name:
      `EntitlementRefresh()`'s `reconfigure`-mode branch
      (`:731-732`, `CustomizeBtn.SetVisible(true)` when set), and
      `EntitlementRefresh_updateCustomize()` (`:1035-1036, 1048-1049`), which
      only ever grants `CustomizeBtn.SetSensitive(true)` when the var IS set,
      leaving the button permanently insensitive otherwise. Separately, the
      `:665-666` and `:731-732` sites are wrapped in `#ifndef HIDE_CUSTOMIZE`
      -- a macro whose only `#define` in this file is commented out
      (`//#define HIDE_CUSTOMIZE`, `:112`), so both `#ifndef` blocks are
      unconditionally compiled in and the macro itself is confirmed
      permanently dead.
    caution: >
      No single authoritative definition of what `PIM_HIDE_CUSTOMIZE_SCREEN`
      is supposed to do exists anywhere else in this archive, so this rule
      documents the confirmed inconsistency without asserting which side (if
      either) is the intended behavior. Anyone changing this env var's
      handling must audit all 4 sites, not just the one being changed, given
      the confirmed split in current behavior.

  pimgetavailable_onexecute_memory_leaks:
    doc: docs/classes/pimGetAvailable.md
    rule: >
      `pimGetAvailable::OnExecute()` (`pim_core/pim_core_src/pimGetAvailable.cxx`)
      leaks 2 distinct heap-allocated `pimXmlFile*` objects. (1) `ImageXml`
      (allocated `:286`) is explicitly `delete`d on every early-exit/`continue`
      branch — 5 separate `delete ImageXml;` sites confirmed between `:291`
      and `:362` — but **never on the successful path**: once the entitlement
      loop (`:376-439`) and family-group loop (`:442-469`) both complete
      normally, control falls out of the enclosing `if (node)` block (`:471`)
      with `ImageXml` still in scope and no matching `delete`. (2)
      `ProductDefinitionXml` (allocated `:547`) is `delete`d only when
      `DoRead()` fails (`:552-557`); if it parses successfully but is then
      filtered out as a `<HIDDEN_PRODUCT>` (`:574`) or `SessionInfo::
      AddEntitlement()` determines it "is determined not to be a product
      definition file" (`:622-625`), the pointer is dropped with no `delete`
      in either branch.
    consequence: >
      Every successfully-processed available product image, and every
      filtered-out-but-successfully-parsed product-definition XML, leaks one
      full DOM tree for the remaining lifetime of the process. Bounded by one
      `OnExecute()` run in a short-lived installer process, but confirmed
      real and compounding with the number of available products/media
      entries a given web-media search encounters. Fix: add a `delete
      ImageXml;` immediately before/after the family-group loop's normal
      completion (mirroring the pattern already used on every early-exit
      branch), and add `delete ProductDefinitionXml;` in the 2 filtered-out
      branches inside the `if (ProductDefinitionXml)` block.

  pimgetavailable_auth_status_comment_wrong:
    doc: docs/classes/pimGetAvailable.md
    rule: >
      `pimGetAvailable.h:26` declares `int auth_status;  // -3 abort, 0
      success`. Tracing every assignment in `pimGetAvailable.cxx` shows `0`
      is set exactly when authentication has **failed**
      (`MSG_A_NOACCOUNT`/`MSG_INVALID_AUTHID`, `:124` and `:211`) — the
      opposite of "success" — while the actual success value, `1`, is set
      only in `OnExecute()` (`:217`) after a fully successful
      `pimEntitlementRequestToPTC()` call and is not mentioned in the comment
      at all. `-3` is set only for a "should never happen" internal
      security-lookup failure inside `OnExecute()` (`:194`), not for every
      abort path.
    caution: >
      `SearchForAvailableDownloads()`'s own `-3` return value (a function
      return, not this member) is a *different* thing from `auth_status`'s
      `-3` — the two share a numeric value but are set by different code for
      different reasons, which is likely how the comment's confusion
      originated. Anyone relying on the header comment rather than reading
      the assignments would misinterpret `IsAuthorized()`'s result.

  pimgetavailable_isauthorized_dead_and_locate_alias_fragile:
    doc: docs/classes/pimGetAvailable.md
    rule: >
      `IsAuthorized()` (`pimGetAvailable.h:49`, a `Mutex`-protected read of
      `auth_status`) has zero callers anywhere in this archive, confirmed by
      full-archive grep — both confirmed consumers instead poll
      `SearchForAvailableDownloads()`'s own return value or `IsSearchDone()`/
      `IsDone()`. Separately, `pim_core/pim_core_src/pimLocate.cxx` declares
      its own file-static `static pimGetAvailable *AvailableDownloads =
      NULL;` (`:40`, distinct from `pimInstallMgrDlg`'s member of the same
      name), set only via `LocateAllowPTCDotCom(bool tf, pimGetAvailable
      *in)` (`:46-52`) — the same architectural pattern already flagged as a
      confirmed live bug for `pimSAB.cxx`'s statics (see
      `pimcustomdlg_sab_methods_guard_wrong_static_handle` above).
    caution: >
      Tracing every confirmed call site shows the `pimLocate.cxx` alias is
      currently safe: `LocateAllowPTCDotCom` is called exactly twice
      (register-on-success in `EntitlementDownloadPreAction()`,
      clear-in-destructor in `~pimInstallMgrDlg()`), and
      `EntitlementDownloadPreAction()`'s own `delete AvailableDownloads` on a
      `-3` abort always happens *before* any successful registration could
      occur within that same call — the two never race in the current code.
      This is confirmed safe today, but fragile: it depends entirely on both
      of `EntitlementDownloadPreAction()`'s 2 confirmed callers
      (`pim_ui_src/pimEntitlementRefresh.cxx:551`,
      `pim_ui_src/pimPTCLicenseGet.cxx:249`) continuing to guard their calls
      with `if (AvailableDownloads == NULL)`. A future 3rd call site that
      omits that guard, or a refactor of the retry loop, could re-delete an
      already-registered instance without clearing `pimLocate.cxx`'s alias,
      leaving it dangling.

  pimgetmediadetails_cache_hit_path_unlocked:
    doc: docs/classes/pimGetMediaDetails.md
    rule: >
      `pimGetMediaDetails::GetDetails()` (`pim_core/pim_core_src/pimGetMediaDetails.cxx:64-141`)
      guards every path that mutates `DetailRecords`/`IDs` with `Mutex.Lock()`/
      `Mutex.Unlock()` (the cache-miss fetch-and-append path, and the
      `refresh` fetch-and-`Replace()` path). But the cache-hit fast path —
      `if (idx != -1 && !refresh) return DetailRecords[idx];` (`:70-73`) —
      returns directly with **no lock at all**.
    consequence: >
      This singleton is confirmed called from both the UI thread
      (`pimEntitlementTree.cxx`, `pimInstallMgrActions.cxx`) and at least one
      background `pimLoop` thread (`pimGetAvailable::OnExecute()`,
      `pim_core/pim_core_src/pimGetAvailable.cxx:481`). If a cache-hit read on
      one thread runs concurrently with a mutating fetch/refresh on another
      thread — for the same or a different media ID, since both share the
      same `DetailRecords`/`IDs` arrays — the reader can observe the arrays
      mid-mutation with no synchronization. This is the same class of finding
      as `pimServices`' confirmed early-`xmlMutex.Unlock()` race documented
      elsewhere in this set; here the gap is an entirely unlocked read path
      rather than a too-early unlock.

  pimgetmediadetails_getproductxml_stale_url_retry:
    doc: docs/classes/pimGetMediaDetails.md
    rule: >
      `pimGetMediaDetails::GetProductXml()` (`pim_core/pim_core_src/pimGetMediaDetails.cxx:143-238`)
      extracts a target download URL (`UrlTmp`) from the cached details
      document once, before its retry loop (`:162-163`). On a `-418`
      (timeout) response, it refreshes the details cache — logging
      `"Replacing download URLs for : " << MediaID` — via a nested
      `GetDetails(MediaId, wname, wpasswd, true)` call (`:186`), then
      `continue;`s back to the top of the `while (ret != 1)` loop
      (`:200-201`). But that loop always calls
      `pimRecvFromPTC(UrlTmp, data)` (`:171`) using the **same `UrlTmp`
      string captured before the refresh** — it is never re-derived from the
      freshly-fetched details document.
    consequence: >
      The refresh's own stated purpose (per its log message) is never acted
      on before the retry it was meant to fix. Confirmed by direct contrast
      with `pimEntitlement::UpdateMediaUrls()` (`pimEntitlement.cxx:1284-1320`,
      "used for web download when the download_url_references timeout and
      have to be regenerated" per its own comment), which performs the
      identical "refresh on timeout" operation but **does** call
      `UpdateUrls(new_xml, UrlRoot)` afterward to actually apply the
      refreshed data before using it — the correct sibling pattern in the
      same codebase.
    caution: >
      Separately, that same retry path also calls
      `DetailRecords.Replace(idx, 1, pArr, 1)` a 2nd time (`:191-197`) with
      the exact pointer the nested `GetDetails(..., true)` call already
      stored at that index via its own internal `Replace()` (`:108-116`) —
      redundant at minimum. Whether it is also dangerous (a double-free/
      dangling-pointer bug if `dsXArray::Replace()` unconditionally deletes
      the slot's existing element, which here is the identical pointer being
      re-inserted) cannot be determined from this archive — `dsXArray` is an
      external `btk`/`ds` container with no other `.Replace()` call site
      anywhere in this codebase to infer its ownership contract from.

  pimgetmediadetails_getproductxml_null_is_root_cause_of_entitlementtree_bug:
    doc: docs/classes/pimGetMediaDetails.md
    rule: >
      `pimGetMediaDetails::GetProductXml()` returns `NULL` when `MediaId`/
      `xml_filename` is `NULL`, the media ID isn't yet cached, no `<url>`
      entry matches the target filename, or the download fails twice in a
      row after a `-418` timeout. This is confirmed to be the exact,
      concrete source of the `NULL` that reaches
      `pimEntitlementTree::OnOptionMenuSelect()`'s already-documented
      unconditional-dereference bug
      (`pimentitlementtree_optionmenuselect_null_deref`, above) — that rule
      already correctly named this method as the source; this rule adds the
      confirmed specific conditions.
    caution: >
      Tracing this class's other callers also surfaced a near line-for-line
      duplicate of `pimEntitlementTree::OnOptionMenuSelect()`'s logic,
      including the identical unconditional-dereference pattern, in
      `uiApplicationsList::OnOptionMenuSelect()`
      (`pim_ui_src/pimInstallMgrActions.cxx:1806-1858`). **Confirmed NOT
      live**: this entire function, and the rest of `uiApplicationsList`'s
      out-of-line method bodies, are wrapped in `#if 0`
      (`pimInstallMgrActions.cxx:1672-2019`), mirroring `uiApplicationsList`'s
      own `#if 0`-disabled class declaration in `pimInstallMgrDlg.h:298-330`.
      Not a reachable 2nd instance of the bug, but strong evidence the defect
      predates `pimEntitlementTree` — likely copied from (or to)
      `uiApplicationsList` before the latter was superseded and disabled.

  pimgetapplicationslist_installprereqsilent_wrong_loop_bound:
    doc: docs/classes/pimGetApplicationsList.md
    rule: >
      `InstallPreReqSilent()` (`pim/pim_src/pimTop.cxx:904-966`, called from
      the silent-install path at `:1780`) does:
      ```cpp
      StringXArray AskedToInstallThisList;
      pimGetApplicationsList(AskedToInstallThisList);
      for (i = 0, max = (int) AskedToInstallThisList.GetSize(); i < max; i++)
      {
          while (pimGetSessionInfo()->GetEntitlement(i)->GetNextPrerequisite(&ptr_pr_E, pr_idx, true))
          ...
      }
      ```
      `AskedToInstallThisList` — the command-line-args-derived application
      list `pimGetApplicationsList()` returns — is never read by index or
      value anywhere in this function; only its `.GetSize()` is used, and
      that size bounds a loop indexing `pimGetSessionInfo()->GetEntitlement(i)`,
      a completely different array (the session's actual parsed product
      entitlements).
    consequence: >
      The 2 arrays have no guaranteed size relationship: `AskedToInstallThisList`
      reflects whichever of the optional `-APPLICATIONS`/`-XML`/`-XMLALL`/
      `-FLEX` flags were passed on the command line, plus whatever
      `AddMandatoryAppsForSilentInstall()` injected into the same shared
      list earlier in the one confirmed call path (see
      `addmandatoryappsforsilentinstall_qualityagent_gated_on_creobase` and
      `addmandatoryappsforsilentinstall_allpacks_invisible_to_installprereqsilent`
      below) — while the entitlement count reflects the actual product XML
      files parsed for this install. **CORRECTED (found in a later,
      dedicated pass on `AddMandatoryAppsForSilentInstall()` itself)**: this
      rule originally read "commonly zero entries, since most silent
      installs don't use these limiting flags at all" — overstated for the
      one real call path. Since `AddMandatoryAppsForSilentInstall()` always
      runs before `InstallPreReqSilent()` and unconditionally *attempts* to
      inject `creobase.xml` (and, if present, `qualityagent.xml`), the list
      is typically non-empty; it is only actually empty when no
      application-limiting flag was passed **and** the media has no
      `creobase.xml` at all. The precisely confirmed consequence is a size
      **mismatch**, not usually a fully empty list: whenever the list ends
      up smaller than the entitlement count (confirmed concretely via
      `-allpacks`, see below), `InstallPreReqSilent()` misses trailing
      entitlements, silently skipping their prerequisite satisfaction; a
      larger list than the entitlement count is not demonstrated in any
      confirmed call path today, but would hit
      `pimSessionInfo::GetEntitlement(int)`'s own bounds check
      (`pim_core/pim_core_src/pimSessionInfo.cxx:776-782`, returns `NULL` out
      of range) immediately dereferenced with no `NULL` check — a latent
      crash risk, not a demonstrated live bug. Reads as a copy-paste/wrong-
      variable bug — the loop bound was very likely intended to be
      `pimGetSessionInfo()->GetEntitlementSize()`.

  addmandatoryappsforsilentinstall_qualityagent_gated_on_creobase:
    doc: docs/classes/pimGetApplicationsList.md
    rule: >
      `AddMandatoryAppsForSilentInstall()` (`pim/pim_src/pimTop.cxx:1282-1316`
      — no header declares this function anywhere in this archive, there is
      no `pimTop.h`, so no Doxygen patch was created for it):
      ```cpp
      void AddMandatoryAppsForSilentInstall(StringXArray &AskedToInstallThisList, btkFSEntry & CdimageXmlsDir)
      {
          const btkString CREO_BASE_XML = "creobase.xml";
          btkFSEntry creobaseXml = CdimageXmlsDir;
          creobaseXml /= CREO_BASE_XML;
          if (creobaseXml.Exists()) {                  // gates BOTH blocks below
              ...                                       // (creobase.xml injection)
              const btkString QUALITY_AGENT_XML = "qualityagent.xml";
              if (!IsApplicationInInstallList(QUALITY_AGENT_XML))
              {
                  btkFSEntry qualityAgentXml = CdimageXmlsDir;
                  qualityAgentXml /= QUALITY_AGENT_XML;
                  if (qualityAgentXml.Exists())          // qualityagent's OWN check
                  {
                      AskedToInstallThisList += qualityAgentXml;
                      pimAddApplicationsToList(qualityAgentXml);
                  }
              }
          }
      }
      ```
      The `qualityagent.xml` injection block — including its own,
      independent `qualityagent.xml` `Exists()` check — is nested entirely
      inside `if (creobaseXml.Exists())`.
    consequence: >
      On any media that ships `qualityagent.xml` without also shipping
      `creobase.xml` (e.g. a Mathcad-only or WGM-only product line's install
      image), quality agent is silently **not** auto-installed, despite
      passing its own existence check. This contradicts both this
      function's own name (`AddMandatoryAppsForSilentInstall`) and the
      explicit intent recorded independently in 2 changelogs dated the same
      day: `pim/includes/pimGeneralInit.h`'s
      `13-Aug-26 Q-27-22 JAY $$34 Mandatory Installation of Quality Agent`
      and `pim/pim_src/pimTop.cxx`'s own
      `13-Aug-26 Q-27-22 JAY $$148 Mandatory Installation of Quality Agent`.
      Reads as an unintentional structural coupling (most likely from
      nesting the newer quality-agent block inside the pre-existing
      creobase block instead of adding it as a sibling `if`), not a
      deliberate dependency — nothing else in this function or its callers
      suggests quality agent installation is meant to depend on Creo base
      being present on the media.

  addmandatoryappsforsilentinstall_allpacks_invisible_to_installprereqsilent:
    doc: docs/classes/pimGetApplicationsList.md
    rule: >
      When `pimGetAllPacksMode()` is set, `pimSilentInstallFromXML()` globs
      every `*.xml` file in the CD image directory and appends each
      `"Utilities"`-family entry directly to its own **local**
      `AskedToInstallThisList` (`pim/pim_src/pimTop.cxx:1430-1474`,
      `AskedToInstallThisList += files[fileCount];`) — **not** via
      `pimAddApplicationsToList()`, so these entries never reach the shared
      `static applications_list` that `pimGetApplicationsList()` reads from.
      `InstallPreReqSilent()` later makes its own, separate
      `pimGetApplicationsList()` call (`pim/pim_src/pimTop.cxx:913`), which
      therefore reflects only the flag-driven and
      `AddMandatoryAppsForSilentInstall()`-added entries — never the
      `-allpacks` additions.
    consequence: >
      Every entry in `pimSilentInstallFromXML()`'s local list still becomes
      its own real `pimEntitlement`, created in list order
      (`pim/pim_src/pimTop.cxx:1530-1755`): flag-driven entries first, then
      `AddMandatoryAppsForSilentInstall()`'s entries, then `-allpacks`'
      entries appended last. Since `InstallPreReqSilent()`'s loop bound
      (the flag-driven-plus-mandatory count only) is always `<=` the true
      entitlement count in this specific ordering, it happens to correctly
      reach every flag-driven/mandatory entitlement — but it **never
      reaches any `-allpacks`-added utility entitlement at all**, so their
      prerequisites are silently never checked whenever `-allpacks` is
      combined with a silent install. This is a narrower, more precisely
      evidenced instance of the
      `pimgetapplicationslist_installprereqsilent_wrong_loop_bound` bug
      above, isolated to one concrete, reproducible cause rather than "the
      list is usually empty."

  pimgetapplicationslist_heterogeneous_format_breaks_exact_match_consumers:
    doc: docs/classes/pimGetApplicationsList.md
    rule: >
      The shared `static StringXArray applications_list`
      (`pim/pim_src/pimGeneralInit.cxx:88`) is populated in 2 incompatible
      formats depending on which command-line flag is used: `-APPLICATIONS`
      (`:218-225`) appends **bare tags** (e.g. `"creobase.xml"`) split from a
      colon-separated argument; `-XML` (`:226-241`) and `-XMLALL` (`:242-262`)
      each append **full filesystem paths** (`btkFSEntry`, expanded to
      absolute); and `AddMandatoryAppsForSilentInstall()`
      (`pim/pim_src/pimTop.cxx:1282-1316`) unconditionally injects 2 more
      full-path entries (`creobase.xml`/`qualityagent.xml`'s absolute paths,
      via `pimAddApplicationsToList()`) into **every** silent install's list,
      regardless of what the user passed. Nothing tags an entry with which
      flag produced it.
    consequence: >
      Of the 3 confirmed consumers: `pimGetAvailable::OnExecute()`
      (`pim_core/pim_core_src/pimGetAvailable.cxx:419`) and an unnamed
      local/physical-image entitlement loader
      (`pim/pim_src/pimTop.cxx:421`) both filter via **exact match**
      (`LimitToThisList.Find(bareTagOrTail) == -1`), which can never match a
      full-path entry against a bare tag/tail — any use of `-XML`/`-XMLALL`,
      or simply running any silent install (since the mandatory-app
      injection always adds path entries), guarantees these 2 filters fail
      to recognize those entries, incorrectly trimming entitlements that
      should have matched; in the worst case (a list populated only by
      `-XMLALL` or by the 2 mandatory-app injections), trimming every
      entitlement. `IsApplicationInInstallList()`
      (`pim/pim_src/pimGeneralInit.cxx:133-146`) correctly uses a
      **substring** search (`.Pos()`), which is format-agnostic — the only
      one of the 3 consumers robust to this heterogeneous content.
      `pimSilentInstallFromXML()` (`pim/pim_src/pimTop.cxx:1486-1499`) treats
      every entry as a filesystem path (`aFile.Exists()`/`aFile.CanRead()`) —
      correct for `-XML`/`-XMLALL`-style content, the one confirmed consumer
      whose format assumption is actually consistent with what those 2 flags
      produce.
    caution: >
      No code anywhere in this codebase distinguishes which flag populated a
      given `applications_list` entry once it's stored — the format is
      implicit and caller-assumed, not enforced or tagged. Any new consumer
      of `pimGetApplicationsList()`'s result must pick a matching strategy
      (substring, like `IsApplicationInInstallList()`) that tolerates both
      formats, or it will silently misbehave under exactly the same
      conditions as the 2 confirmed exact-match consumers above.

  isapplicationininstalllist_substring_false_positive_risk:
    doc: docs/classes/pimGetApplicationsList.md
    rule: >
      `IsApplicationInInstallList()` (`pim/pim_src/pimGeneralInit.cxx:133-146`):
      ```cpp
      bool IsApplicationInInstallList(const btkString& application)
      {
          if (application.GetSize() > 0)
          {
              for (int i = 0; i < (int)applications_list.GetSize(); i++)
              {
                  if (applications_list[i].Pos(application) != -1)
                  {
                      return true;
                  }
              }
          }
          return false;
      }
      ```
      matches via `Pos()` — a **substring** search, not an exact-match or
      basename comparison. This is confirmed to be the one consumer of
      `applications_list` robust to that list's bare-tag-vs-full-path format
      split (see `pimgetapplicationslist_heterogeneous_format_breaks_exact_match_consumers`
      above), but the same looseness creates a risk in the opposite
      direction: it returns `true` for `application` whenever `application`
      is a literal substring of ANY entry already in `applications_list`,
      not just when `application` itself was ever added to that list.
    consequence: >
      A hypothetical future entry `"newcreobase.xml"` in `applications_list`
      would make `IsApplicationInInstallList("creobase.xml")` return `true`
      even if `"creobase.xml"` itself was never requested or added — a false
      positive caused purely by one tag being a textual substring of another.
      Checked pairwise against the 3 real, confirmed arguments used anywhere
      in this codebase today (`CREO_BASE_XML = "creobase.xml"`,
      `CREO_BASE_XML_INSTALLED = "creobase.p.xml"`,
      `QUALITY_AGENT_XML = "qualityagent.xml"`): none is a substring of
      another, so **no live collision exists today** — this is a confirmed
      structural risk, not a demonstrated live bug.
    caution: >
      Any new application tag or filename added to this codebase in the
      future should be checked against every existing tag reachable via
      `applications_list` for a substring relationship in either direction
      before being introduced, since `IsApplicationInInstallList()` has no
      safeguard (e.g. exact match, or matching on a path's basename only)
      against this. This is the opposite-direction risk from the heterogeneous-
      format rule above: that rule's exact-match consumers under-match
      (miss entries that should match), while this substring consumer can
      over-match (match entries that shouldn't).

  pimavailableproduct_addinstance_ignores_shipcode:
    doc: docs/classes/pimAvailableProduct.md
    rule: >
      `pimAvailableProduct::AddInstance(const char *V, const char *shipcode,
      const char *media_id)` (`pim_core/pim_core_src/pimGetAvailableProduct.cxx:25-39`)
      never references its own `shipcode` parameter:
      ```cpp
      bool pimAvailableProduct::AddInstance (const char *V, const char *shipcode, const char *media_id)
      {
          if (V && media_id)
          {
              btkString VerShip;
              VerShip  = V;                    // shipcode never used
              if (VerShipcodes.Find(VerShip) == -1)
              {
                  VerShipcodes += VerShip;      // stores the bare version only
                  MediaIDs += media_id;
                  return true;
              }
          }
          return false;
      }
      ```
      The member it populates is named `VerShipcodes` (implying a combined
      version+shipcode identifier), and `Sort()` compares entries using an
      external comparator literally named `pimCompareVerShipcode` — both
      strongly implying the intended stored value should combine version and
      shipcode, which this function never does.
    consequence: >
      If the same product version is discovered under 2 different shipcodes
      (e.g. 2 regional/licensing SKUs sharing one version number, each with
      its own media ID — a realistic scenario given
      `pimGetAvailable::OnExecute()`'s confirmed sole caller,
      `pimGetAvailable.cxx:436`, passes a freshly-resolved `IShipcode` per
      outer loop iteration), the 2nd `AddInstance()` call's
      `VerShipcodes.Find(VerShip)` finds the version already present from the
      1st call and returns `false` without adding the 2nd shipcode's own
      `media_id` — silently dropping a legitimate, distinct product instance.
      Since `GetVerShipcodes()`/`GetMedia()` feed directly into
      `pimEntitlementTree`'s version/shipcode-selection dropdown (via
      `pimGetMediaDetails`), the practical effect is a shipcode option
      silently missing from that dropdown whenever this collision occurs.
    caution: >
      This finding was missed in an earlier pass that treated
      `pimAvailableProduct`/`pimGetAvailableProducts` only as a brief
      "companion" to `pimGetAvailable` (both files were already read in full
      at that time, but not given a dedicated line-by-line pass) — a
      reminder that "already read in full" is not the same as "already
      analyzed to full depth" for every method, and companion/secondary
      classes deserve the same scrutiny as the primary class once time
      allows.

  cmp_cstrings_no_implementation_and_redeclared_4_times:
    doc: docs/classes/Cmp_cStrings.md
    rule: >
      `Cmp_cStrings` (signature `int Cmp_cStrings(void *, void *)`, used as a
      `btkMap` key comparator) has **no implementation anywhere in this
      archive** — confirmed by an exhaustive case-insensitive grep across
      every file in `pim/`, `pim_core/`, `pim_ui/`, and `pim_util/`, which
      returns exactly 8 total lines referencing the symbol. It is
      independently forward-declared via a local
      `extern int Cmp_cStrings(void *, void *);` statement in 4 separate
      `.cxx` files — `pim_ui/pim_ui_src/upimDlg.cxx:44`,
      `pim_ui/pim_ui_src/pimsilentDlg.cxx:24`,
      `pim_core/pim_core_src/pimEntitlement.cxx:201`, and
      `pim_core/pim_core_src/pimGetAvailableProduct.cxx:87` — with **no
      shared header** declaring it once for all 4 to include.
    consequence: >
      There is no compiler-enforced single source of truth for this
      function's signature: if it were ever changed (e.g. adding a
      3rd parameter, or changing linkage), all 4 independent declarations
      would need to be found and updated by hand, with no header-based
      mechanism to catch a missed one at compile time (each `.cxx` file
      would simply link against whatever the real symbol's current
      signature is, mismatched declarations notwithstanding, per C++'s
      normal separate-compilation trust model). Separately,
      `pimsilentDlg.cxx`'s declaration (`:24`) is confirmed **unused** — no
      construction anywhere else in that file references `Cmp_cStrings` —
      dead/vestigial code.
    caution: >
      This function's actual comparison semantics (case sensitivity, `NULL`
      handling, stability) cannot be confirmed from this archive — they are
      **inferred, not verified**, from its name and from every real call
      site's usage pattern (as a comparator for `btkMap<char*, T*>`
      collections keyed by filesystem paths, XML filenames, or media IDs).
      Do not treat any claim about its internal behavior as confirmed; it is
      presumably implemented in the external `btk` toolkit (the same one
      that supplies `btkMap`/`StringXArray`/`thrMutex`, already documented
      as external throughout this set), but this could not be verified
      directly.

  pimavailableproduct_print_dead_code:
    doc: docs/classes/pimAvailableProduct.md
    rule: >
      Both `pimAvailableProduct::Print(btkErrLog &log)`
      (`pim_core/pim_core_src/pimGetAvailableProduct.cxx:71-76`) and
      `pimGetAvailableProducts::Print(btkErrLog &log)` (`:159-163`, which
      simply fans out to every contained `pimAvailableProduct`'s own
      `Print()`) are fully implemented and callable, but have **zero live
      callers anywhere in this archive**. An exhaustive grep for `.Print(`
      across every file in `pim/`, `pim_core/`, and `pim_ui/` finds exactly
      3 matches total: `pim_core/pim_core_src/pimGetAvailable.cxx:474` and
      `:478` (`//AvailableProductsArray.Print(pimDbgLog);`), **both
      commented out**, and one unrelated `Test.Print(output_file)` call on
      a completely different object in `pim/pim_src/pimTop.cxx:3042`.
    consequence: >
      `pimDbgLog` — the argument these dead calls would have passed — is
      itself referenced nowhere else in this codebase outside those same 2
      disabled lines and a 3rd commented `//pimDbgLog << endl;` at
      `pimGetAvailable.cxx:564`, so it is not confirmed to be a real, live
      logger object anywhere in this archive either — merely a name left
      over in disabled debug-print statements from earlier development.
      Both `Print()` overloads can be safely removed, or re-wired to a real
      logging path, without affecting any currently-live behavior; this is
      confirmed-unreachable code, not a latent bug with a runtime
      consequence.
    caution: >
      This finding was surfaced by a dedicated pass specifically on
      `Print()`, after the class's own broader full-depth pass (which found
      the `AddInstance()` shipcode-ignored bug and the
      `pimAvailableProduct*` leak) had already read both files in full but
      not exhaustively grepped every method's own call-site count. A
      reminder that even a "full depth" pass on a class can leave
      individual methods' reachability unconfirmed until specifically
      checked — the same lesson `AddInstance()`'s own promotion from a
      "companion" mention already taught for the class as a whole.

  pimsilenttestxmlisuseable_leaks_pimxmlfile_on_syntax_error:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentTestXmlIsUseable()` (`pim_core/pim_core_src/pimSilent.cxx:29-104`):
      ```cpp
      pimXmlFile* A_tmp = XNew pimXmlFile();
      if (A_tmp)
      {
          A_tmp->SetXml(AskedToInstallThis);
          A_tmp->UseNS();
          A_tmp->UsePrettyPrint();
          A_tmp->DoRead();
          if (A_tmp->ErrorOccured())
          {
              ...
              pimHitError(PIM_GENERAL_XML_ERROR);
              return false;      // A_tmp never deleted on this path
          }
          delete A_tmp;          // only reached when there was NO error
      }
      ```
      The `delete A_tmp;` that frees the object on the success path is
      placed textually *after* the `if (A_tmp->ErrorOccured())` block, so
      the early `return false;` inside that block skips it.
    consequence: >
      Every silent-install attempt against a syntactically-invalid
      user-specified XML file (reachable via `-XML`/`-XMLALL` pointing at
      malformed XML) leaks one `pimXmlFile` object. Low practical severity —
      `pimSilentTestXmlIsUseable()` returning `false` here causes
      `pimSilentInstallFromXML()` to abort the entire run immediately (see
      `docs/classes/pimGetApplicationsList.md`), so the leaked object dies
      with the short-lived process — but a clear, reproducible,
      copy-paste-shaped one-line bug, confirmed by direct contrast with the
      function's own success-path cleanup 2 lines later.

  pimsilentcanmatchneeds_leaks_2_pimxmlfiles_on_parse_error:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCanMatchNeeds()` (`pim_core/pim_core_src/pimSilent.cxx:227-346`):
      ```cpp
      pimXmlFile* A_tmp = XNew pimXmlFile();
      pimXmlFile* B_tmp = XNew pimXmlFile();
      A_tmp->SetXml(A); ... A_tmp->DoRead();
      B_tmp->SetXml(B); ... B_tmp->DoRead();
      if (!A_tmp->ErrorOccured() && !B_tmp->ErrorOccured())
      {
          ... // every internal `return false;` here (3 confirmed instances)
              // and the final `return true;` all correctly `delete A_tmp;
              // delete B_tmp;` first
          return true;
      }
      return false;   // reached whenever EITHER file fails to parse --
                       // neither A_tmp nor B_tmp is ever deleted here
      ```
    consequence: >
      Whenever either of the 2 input product XML files fails to parse, this
      function leaks **both** of its internal `pimXmlFile` objects — twice
      the size of `pimSilentTestXmlIsUseable()`'s own leak above, in the
      same function family. The pattern makes this one clear by contrast:
      every other exit point in this function (3 internal early-returns
      plus the final success return) consistently deletes both objects
      first, so the outer fallthrough `return false;` is the single path
      the cleanup pattern was not applied to. `pimSilentCanMatchNeeds()` is
      only reached after `pimIsProductXmlMatch()`/`pimIsVersionMatch()` have
      already confirmed `A` and `B` relate (called from
      `pimSilentTestXmlIsUseable()`, `pim_core/pim_core_src/pimSilent.cxx:87`),
      so a parse failure at this specific point is a narrower window than
      the syntax-error check in the caller, but the leak is unconditional
      whenever it does occur.

  pimsilentfixuppsf_dummy_placeholder_can_get_stuck:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentFixupPSF()` (`pim_core/pim_core_src/pimSilent.cxx:353-416`)
      relies on `pimCommandMgr::DeleteCommand()`/`CanDeleteCommand()`
      (`pim_core/pim_core_src/pimCommandMgr.cxx:405-451,454-515`), which
      explicitly refuses to delete a command — an inline comment at `:405`
      reads *"call to delete; you can not delete the last command of a
      type"* — whenever fewer than 2 commands in the whole entitlement XML
      share the target command's `<LICTYPE>` value. When `A` wants a command
      name that already exists in `B` under a **different** license type,
      `pimSilentFixupPSF()` works around this by first adding a
      `pDiUmMMY<N>` placeholder command of `B`'s old type (so the type has
      ≥2 members again), then deleting the real colliding commands:
      ```cpp
      B_cmds.GetAllCommandNamesByType(lictype2, b_cmd_names);
      dummy_str = "pDiUmMMY" + btkString::PrintInt(dummy_ct++);
      B_cmds.AppendAddCommand(dummy_str, desc, lictype2, licIdentifiers, features);
      for (int j = 0; j < (int)b_cmd_names.GetSize(); j++)
          B_cmds.DeleteCommand(b_cmd_names[j]);   // succeeds: dummy keeps count >= 2
      ```
      Later, the function's final cleanup loop deletes anything left in `B`
      that isn't one of `A`'s wanted names — which should include the dummy:
      ```cpp
      for (int i = 0; i < (int)B_avail.GetSize(); i++)
          if (A_wants.Find(B_avail[i]) == -1)
              B_cmds.DeleteCommand(B_avail[i]);   // no return-value check
      ```
    consequence: >
      If none of `A`'s final wanted commands happen to also be of license
      type `lictype2` (the dummy's type), the dummy is now the **sole**
      remaining command of that type by the time the final cleanup loop
      runs, so `DeleteCommand("pDiUmMMY<N>")` fails the exact same "last of
      a type" check it was created to survive — silently, since neither of
      this function's 2 relevant `DeleteCommand()` call sites checks the
      returned `bool`. A spurious `pDiUmMMY<N>` PSF command — carrying `A`'s
      description/license-identifiers/features data mislabeled under `B`'s
      old license type — can permanently persist in the merged entitlement's
      PSF/command set. **Reachability, precisely characterized (found in a
      further, dedicated pass on this bug specifically)**: the dummy
      survives exactly when no entry in `A`'s final wanted command set
      independently declares its own license type as `lictype2` — the one
      `A_wants[i]` entry that triggered this branch is guaranteed *not* to
      qualify (`lictype != lictype2` is the very condition that triggers the
      dummy-creation path), so only some *other*, unrelated `A_wants` entry
      sharing `lictype2` could save the dummy. This is a plausible,
      non-degenerate real-world scenario — e.g. a single command's license
      type changing between product versions while no other command shares
      the old type — not merely a contrived edge case.
    caution: >
      Any fix must check `DeleteCommand()`'s return value at both of
      `pimSilentFixupPSF()`'s relevant call sites and decide what to do with
      a still-present dummy — simply retrying is not enough, since the
      "last of a type" rule will keep blocking it until some other command
      of that type exists. **Downstream consequence, newly traced in a
      further dedicated pass**: a stuck dummy is not merely a cosmetic
      leftover. `pimEntitlement::InstallScripts()`
      (`pim_core/pim_core_src/pimEntitlement.cxx:5627-5631`) constructs a
      `pimScriptLoop` directly on the **same** `pimXmlFile*` document (`Eb`'s
      `xmlPtr`) `pimSilentFixupPSF()` mutates — confirmed object identity, at
      real install-execution time. `pimScriptLoop::OnInstall()`
      (`pim_core/pim_core_src/pimScriptLoop.cxx:71-127`) calls
      `GetAllCommandNames(arr)` and, for any entitlement lacking a
      `SimulateLicenseTypes` XML property, reads `arr[0]`'s license
      identifiers via `GetCommandInfoByName()` **unconditionally, with no
      type-based selection** (`:111`), to populate `[LM_LICENSE_FILE]` for
      that entitlement's generated install scripts. If the stuck dummy lands
      at index `0` of `arr`, its own internally-mismatched data (tagged type
      `lictype2`, populated with `A`'s identifiers for the different type
      `lictype`) would drive `[LM_LICENSE_FILE]` for the **entire
      entitlement**, not just the dummy's own inert entry. Whether the dummy
      reliably reaches index `0` — which depends on document order after
      `pimSilentFixupPSF()` completes, in turn depending on how many of
      `Eb`'s *original* commands survived the initial "drop" step
      undisturbed — and whether it even appears in `arr` at all
      (`GetAllCommandNames()`'s default `include_feature_less=false` filters
      out any `<PSF>` node lacking a `<FEATURE_NAME>` child, and whether the
      dummy's cloned `<PSF_TEMPLATE>` includes one wasn't independently
      confirmed in this pass) is **not confirmed either way** in this
      archive; the mechanism connecting the 2 functions via the shared XML
      document is fully confirmed. **Narrowed (found in a further, dedicated
      pass on `pimsilentfixuppsf_collision_deletes_entire_type_not_just_colliding_name`
      below, not retracted)**: the "drop" step referenced above is confirmed
      to deterministically leave **exactly 1** surviving command per
      originally distinct license type, and when 2+ collisions in the same
      call target the same original `lictype2`, each later collision's own
      `GetAllCommandNamesByType()` sweep incidentally deletes the *previous*
      collision's dummy — so only the **last** dummy created for a given
      shared `lictype2` is actually exposed to this stuck-dummy risk, not
      every dummy the function creates. See that rule's `caution` field for
      the full mechanism.
      **CONFIRMED, found in a further dedicated pass specifically on this
      function's `DeleteCommand()` return-value check — a precise,
      per-call-site trace of what checking it would actually reveal, and a
      genuine generalization of this stuck-dummy finding**: there are
      exactly 3 `DeleteCommand()` call sites (`pimSilent.cxx:364,391,413`).
      **Site 1, the Drop step (`:364`) — verified non-issue**: a `false`
      return here is the loop's own expected, by-design terminal state,
      already documented by its own inline comment. **Site 2,
      collision-handling (`:391`) — confirmed, by an exhaustive counting
      proof, to always succeed, conditionally**: since `b_cmd_names` is
      captured before the new dummy exists, the type's member count
      remaining just before deleting the *k*-th of *n* names is always
      `(n-k)+1` — always `>1` — so every delete in this loop is guaranteed
      to pass `CanDeleteCommand()`, *provided* `AppendAddCommand()` (`:389`)
      itself succeeded in creating the dummy; that precondition is also
      never checked, and depends on `FindPsfTempateNode(lictype2)` finding
      a matching `<PSF_TEMPLATE>` — not confirmed either way in this
      archive. **Site 3, final cleanup (`:413`) — confirmed, generalizing
      this rule beyond dummies specifically**: **any** command — dummy or
      genuinely original — that is the sole remaining representative of
      its license type by this point gets silently, permanently stuck
      whenever `A_wants` contains no command of that type at all,
      confirming `pimSilentFixupPSF()`'s own stated goal is structurally
      unachievable for such a type, not a corner case. A stuck non-dummy
      leftover carries real, valid (if unrequested) license data and can
      equally reach index `0` of `pimScriptLoop::OnInstall()`'s
      `GetAllCommandNames()` read.
      **CONFIRMED BUG, found in a further dedicated pass specifically on
      this function's `AppendAddCommand()` return-value check — mirroring
      the `DeleteCommand()` pass above but finding a more severe, more
      clearly reachable failure mode**: there are exactly 2
      `AppendAddCommand()` call sites (`:389,403`), both discarding the
      return value. Traced `AppendAddCommand()`'s own implementation
      (`pim_core/pim_core_src/pimCommandMgr.cxx:310-403`): it is
      **add-or-update** — an existing `name` is simply updated (always
      succeeds) — but creating a genuinely **new** node depends on
      `FindPsfTempateNode(LicType)` (`:923-929`) finding a matching
      `<PSF_TEMPLATE>`; if none exists, no node is ever created and the
      function returns `false` with **zero trace anywhere**. **Site 1
      (`:389`), the dummy — confirmed lower reachability**: `lictype2` is
      read from an **existing, live** `B` command, plausibly (though not
      certainly) already templated. **Site 2 (`:403`), the main re-add
      loop — confirmed, more severe and more clearly reachable**: when
      `A_wants[i]` is a name genuinely new to `B`, its `lictype` comes from
      **`A`'s own document**, entirely independent of `B`'s template set —
      if `B`'s media lacks a template for that type (a plausible
      cross-version/cross-product mismatch), `A`'s entire request for that
      named command is **dropped without a trace**, not stuck like a
      dummy, simply **absent** from `Eb`. **Confirmed by this function's
      own reasoning**: its inline comment introducing this loop ("now we
      know that all the names we want to use are either not already used
      or match the same type...") shows the author reasoned through
      name/type collisions but never considered template availability — a
      genuine blind spot, not an accepted risk. **Downstream consequence**:
      the failed command never even appears in the final cleanup loop's
      re-fetch, so there is nothing to strand — the user's requested
      licensed feature is simply never provisioned, with no dummy, no log,
      and no error anywhere in the pipeline, arguably harder to diagnose
      than either `DeleteCommand()` finding since there is no leftover
      artifact for a later investigation to even notice. A fix would check
      `AppendAddCommand()`'s return value at `:403` (and, for defense in
      depth, `:389` too) and log or record which requested command could
      not be created.
      **FIX VERIFIED (PARTIALLY), found in a further, dedicated pass
      verifying the stuck-dummy bug's own proposed fix** — "either
      `pimSilentFixupPSF()` must guarantee no dummy survives, or
      `pimScriptLoop` must select the license command by type/role rather
      than array position 0." **Option 1 confirmed already true in half
      the cases, structurally unachievable in the other half**: when
      another `A`-wanted command independently shares the dummy's license
      type, its own `AppendAddCommand()` call already restores the type's
      live count to ≥2 before the final cleanup loop runs, so the dummy is
      **already** correctly deleted today — no fix needed there.
      When no such entry exists, `CanDeleteCommand()`'s floor (`count >
      1`) has **no override anywhere in `pimCommandMgr`** — confirmed
      structurally impossible to reduce any license type to 0 live
      commands via any operation ordering. Closing this remaining gap
      needs a genuinely **new** `pimCommandMgr` capability: an in-place
      "retype" operation mutating the existing colliding command's own
      `<LICTYPE>` (and its other type-specific, template-cloned children)
      directly, reusing `AppendAddCommand()`'s own `FindPsfTempateNode()`
      + deep-cloning machinery against the node already present — never
      passing through a 0-count instant, so the floor check never blocks
      it. Architecturally sound, but a new method, not a change to this
      function's own logic. **Option 2 confirmed architecturally
      precedented, but concretely under-specified**: `pimScriptLoop::OnInstall()`
      itself, a few lines below the `arr[0]` lookup, already performs
      exactly this kind of role-based selection for a different purpose —
      `FindNodelistAttribMatch(pimPSF, pimid, "parametric")`
      (`pimScriptLoop.cxx:135`) — but no canonical `id`/`<LICTYPE>` value
      for "the license-bearing command" is confirmed to exist anywhere in
      this archive, so option 2 is feasible in mechanism only. **Further
      confirmed**, extending this rule's own already-flagged
      `include_feature_less` uncertainty: `AppendEditCommand()` never
      creates a missing `<FEATURE_NAME>` child, only updates an existing
      one — so whether the dummy can even reach `pimScriptLoop`'s `arr` is
      fixed entirely by its type's own template authoring. **New,
      dummy-independent design smell**: `arr[0]`'s "just take the first
      command" assumption is fragile on its own terms, since this same
      function already relies on multiple, role-distinct PSF commands
      coexisting (the `id="parametric"` lookup presupposes at least one
      other can exist).

  pimsilentfixuppsf_collision_deletes_entire_type_not_just_colliding_name:
    doc: docs/classes/pimSilent.md
    rule: >
      The same collision-handling block's own inline comment
      (`pim_core/pim_core_src/pimSilent.cxx:384-385`) reads: *"We want to
      create foobar of type A; and foobar is the name of a type B. So we
      need to create a dummy for type B; and remove **the foobar
      command**"* — singular, implying only the one colliding name is
      removed. The code instead calls
      `B_cmds.GetAllCommandNamesByType(lictype2, b_cmd_names)` — which
      returns **every** command in `B` sharing license type `lictype2`, not
      just the colliding `"foobar"` — and deletes all of `b_cmd_names` in a
      loop.
    consequence: >
      Whenever `B`'s old type `lictype2` had other, non-colliding commands
      beyond the single name `A` wants renamed, this function removes all of
      them too as a side effect of resolving one unrelated name collision.
      The function's own subsequent loop (`:397-404`, re-adding each of
      `A_wants`) only restores a `lictype2` command if `A` itself still
      wants a command of that type — anything `A` does *not* want of that
      type is permanently dropped from `Eb`'s final PSF/command set, beyond
      what the single-name collision the comment describes would justify.
    caution: >
      **Reachability, precisely characterized (found in a further,
      dedicated pass on this discrepancy specifically)**: this function's
      own opening "Drop" step (`:361-365`) already deletes **every**
      original command in `B` before this collision-handling block ever
      runs — but `pimCommandMgr::CanDeleteCommand()`'s live "last of a
      type" count (`pim_core/pim_core_src/pimCommandMgr.cxx:454-515`,
      counting `<PSF>` nodes by `<LICTYPE>` **at call time**, not a fixed
      snapshot) makes that Drop loop deterministically leave **exactly 1
      surviving command per originally distinct license type** —
      whichever one is processed last, in `B_avail`'s fixed snapshot
      order, for that type (every earlier same-type deletion in the loop
      succeeds since ≥2 members remain each time; the final one always
      fails, since deleting it would leave 0). This means that on a given
      `lictype2`'s **first** collision in a call,
      `GetAllCommandNamesByType(lictype2, b_cmd_names)` can only ever
      return **that one straggler** — identical to the single colliding
      command the comment already expects, not "other, non-colliding"
      original `B` commands (those are already gone by this point). The
      discrepancy this rule describes only actually manifests when **2 or
      more** `A_wants` entries, in the *same* call, independently collide
      against different `B` command names that originally shared the
      *same* `lictype2` — a real, reachable scenario (e.g. a product
      consolidating several old commands of one license type into fewer,
      differently-typed commands across a version upgrade), but narrower
      than "any non-colliding command of that type" might suggest in
      isolation. **Downstream consequence, newly traced in the same pass —
      an internal interaction with
      `pimsilentfixuppsf_dummy_placeholder_can_get_stuck` above, not an
      external consumer**: because `AppendAddCommand()` (`:389`) runs
      *before* the `b_cmd_names` delete loop (`:390-391`), and
      `b_cmd_names` was captured *before* that new dummy existed, a 2nd
      (or later) collision on the same `lictype2` deletes the *previous*
      iteration's straggler/dummy while its own brand-new dummy survives
      untouched — the type's member count never drops below 1 at any
      deletion, so every one of these in-between deletions **succeeds**.
      When `N` collisions in one call target the same original
      `lictype2`, this "delete entire type" behavior acts as an
      **unintentional cleanup mechanism** for dummies `1` through `N-1` —
      they are swept away here, mid-loop, rather than surviving to the
      final cleanup loop (`:410-413`) or the stuck-dummy risk. Only the
      **last** dummy created for a given shared `lictype2` is actually
      exposed to the stuck-dummy risk and its traced `pimScriptLoop`
      `[LM_LICENSE_FILE]` consequence — this **narrows, without
      retracting**, `pimsilentfixuppsf_dummy_placeholder_can_get_stuck`'s
      finding: the risk is real, but confirmed to apply to at most 1 dummy
      per originally-distinct license type per call, not every dummy this
      function creates.

  pimsilentcanmatchneeds_package_check_mode_dependent:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCanMatchNeeds()` (`pim_core/pim_core_src/pimSilent.cxx:307-339`)
      declares its own contract in a header comment (`:220-222`): *"returns
      false if any packages marked for install in A are not known in B."*
      Its package-availability check is:
      ```cpp
      A_pkg.GetInstallPackageNames(A_wants);
      B_pkg.GetAllPackageNames(B_avail);
      for (int i = 0; i < (int)A_wants.GetSize(); i++)
          if (B_avail.Find(A_wants[i]) == -1) { ...; return false; }
      ```
      `pimPackageMgr::GetInstallPackageNames()`
      (`pim_core/pim_core_src/pimPackageMgr.cxx:611-666`), unlike its
      platform/language siblings used in the same function
      (`pimPlatformMgr::GetInstallPlatformNames()`/
      `pimLanguageMgr::GetInstallLanguageNames()`, both a simple,
      unconditional `install="Y"` attribute check), branches on 3 global,
      process-wide command-line mode flags that have nothing to do with the
      specific `A` XML file being read:
      ```cpp
      if (pimGetBasePackMode())
          { if (required=="Y") out += name; }               // ONLY required
      else if (pimGetCreoNGCRIMode())
          { if (required=="Y" || parent=="extraoptions") out += name; }
      else if (install=="Y" || pimGetAllPacksMode())
          out += name;                                       // normal, OR everything
      ```
    consequence: >
      This function's own stated contract ("packages marked for install in
      A") only actually holds in the **default** case (no special mode
      active). Under **`-allpacks`** (`pimGetAllPacksMode()`),
      `GetInstallPackageNames()` returns **every** package name in `A`'s
      XML regardless of `A`'s own `install="Y"` markings, so
      `pimSilentCanMatchNeeds()` rejects the match if `B` is missing even a
      package `A`'s schema merely declares. Under **`-basepack`**
      (`pimGetBasePackMode()`), it returns **only** `required="Y"` packages,
      ignoring `A`'s actual `install="Y"` selections entirely, so
      `pimSilentCanMatchNeeds()` accepts a match as long as `B` has every
      *required* package. A 3rd, CreoNGCRI-mode variant applies yet another
      definition (required, or parent `"extraoptions"`). None of these 3
      modes is scoped to the specific `A`/`B` pair being compared — each is
      a process-wide flag set once by `pimCommandLineArgs()` (see
      `docs/classes/pimGetApplicationsList.md`), so whichever is active
      silently governs every `pimSilentCanMatchNeeds()` call for the entire
      silent-install run. **CORRECTED (found in a later, dedicated pass on
      `pimSilentCreateEntitlement()` itself, see
      `pimsilentcreateentitlement_package_selection_matches_canmatchneeds`
      below)**: an earlier version of this rule characterized `-allpacks` as
      making this check "overly strict" and `-basepack` as causing a
      "validation gap." Both characterizations were too strong.
      `pimSilentCreateEntitlement()`'s own package-selection loop calls the
      **identical** `GetInstallPackageNames()` on the same `A`, under the
      same mode flags, to decide what to actually install on `B` — and
      since it only ever runs immediately after a successful
      `pimSilentCanMatchNeeds()` call on the same `A`/`B` pair within the
      same process, the 2 calls are guaranteed to see an identical "wanted"
      package set. `pimSilentCanMatchNeeds()` therefore validates *exactly*
      what `pimSilentCreateEntitlement()` will subsequently attempt to
      install — the 2 functions are consistent with each other, not in
      conflict, and both modes' behavior is confirmed to be by design.
    caution: >
      Anyone reading `pimSilentCanMatchNeeds()`'s own header comment alone
      would reasonably assume its package check always means "everything A
      marked `install=\"Y\"`" — that is only true when none of
      `-basepack`/`-CreoNGCRI mode`/`-allpacks` is active. This remains a
      genuine documentation-accuracy gap in the function's own comment, even
      though (per the correction above) the actual behavior it produces is
      not a functional defect. Any change to `GetInstallPackageNames()`'s
      mode-specific branches affects `pimSilentCanMatchNeeds()` and
      `pimSilentCreateEntitlement()` identically and simultaneously, since
      both call it the same way — changing one without the other would be
      the actual bug to watch for. **Reachability, more precisely
      characterized (found in a further, dedicated pass on this bug
      specifically, not merely hypothetical)**: the 3 mode flags are **not**
      a clean, mutually exclusive 3-way choice. `-allpacks`/`-basepack`
      **are** enforced mutually exclusive by the CLI parser itself
      (`pim/pim_src/pimGeneralInit.cxx:309-320`) — each `else if` branch
      explicitly clears the *other* flag when set, so only the last of the
      2 named on a given command line wins, silently, with no conflict
      warning. But `-releaselink` (which sets `pimGetCreoNGCRIMode()` via
      `pimSetCreoNGCRIMode(1)`, `pimGeneralInit.cxx:291-293`) has **no such
      interaction with either flag** — nothing clears it when
      `-allpacks`/`-basepack` is set, and nothing clears them when
      `-releaselink` is set. A real command line can freely combine
      `-releaselink -basepack` (or `-releaselink -allpacks`). Since
      `GetInstallPackageNames()`'s `if`/`else if` chain
      (`pim_core/pim_core_src/pimPackageMgr.cxx:632-655`) checks
      `pimGetBasePackMode()` **first**, `pimGetCreoNGCRIMode()` **second**,
      combining `-releaselink -basepack` makes BasePack's definition
      silently win for package selection — the CreoNGCRI-specific
      "required, or parent `extraoptions`" clause never executes for
      packages — even though `pimGetCreoNGCRIMode()` remains fully,
      independently active for every *other* purpose throughout the rest of
      the codebase (confirmed via at least 10 other call sites across
      `pim_ui`, e.g. `pimEntitlementTree.cxx:1219,1718`,
      `pimInstallMgrDlg.cxx:613,2159,2163,3183`,
      `pimCustomDlg.cxx:1023,1027`, `pimWelcomeRefresh.cxx:143`,
      `pimEntitlementRefresh.cxx:1199`, none of which defer to
      `-basepack`/`-allpacks`). This is a confirmed, reachable interaction
      via ordinary command-line flags — not a hypothetical 3-way conflict —
      since nothing in either the CLI parser or `GetInstallPackageNames()`
      prevents or warns about combining them.
      **Downstream consequence, newly traced in the same pass**: whatever
      `pimSilentCreateEntitlement()`'s mode-dependent package-selection loop
      (`:576-586`) decides ultimately gets written by
      `pimPackageMgr::SetPackageInstallState()`
      (`pim_core/pim_core_src/pimPackageMgr.cxx:250-336`) directly onto the
      `<PACKAGE>` node's own `install="Y"`/`"N"` XML attribute, on `Eb`'s
      shared `xmlPtr` document. This is the **exact same attribute**
      `pimMSILoop::IsEligibleForInstall()`
      (`pim_core/pim_core_src/pimMSILoop.cxx:937-969`) reads at real
      install-execution time — via `pimEntitlement::InstallMSI()`
      (`pimEntitlement.cxx:5293-5330`) calling `pimMSICopier::MSIInstall()`/
      `MSICopy_low()` (`pim_core/pim_core_src/pimMSICopier.cxx:41-98`),
      which constructs a `pimMSILoop` (already a fully documented `pimLoop`
      subclass, like `pimScriptLoop`/`pimShortcutLoop`) directly on this
      **same** `xmlPtr` — to decide whether a given MSI feature/CDSECTION
      tied to that package is **actually, physically installed** via the
      MSI copier. This confirms, for the first time, that this
      mode-dependent package-selection logic is not merely a
      validation-time or documentation-accuracy concern — it is the
      literal, unbroken, real-world determinant of which product features
      get installed onto the machine, identical for both
      `pimSilentCanMatchNeeds()`'s validation and
      `pimSilentCreateEntitlement()`'s selection.

  pimsilentfixupshortcuts_stale_programmenu_copy:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentFixupShortcuts()`'s matched-ID branch
      (`pim_core/pim_core_src/pimSilent.cxx:447-467`):
      ```cpp
      btkString unused, str;   // declared ONCE, outside the loop (:428)
      for (int i = 0; i < (int)A_wants.GetSize(); i++)
      {
          if (B_avail.Find(A_wants[i]) != -1)
          {
              ...
              A_shtcuts.GetShortcutProgramMenu(A_wants[i], str);   // return value IGNORED
              B_shtcuts.SetShortcutProgramMenu(A_wants[i], str);   // called UNCONDITIONALLY

              if (A_shtcuts.GetShortcutStartDir(A_wants[i], str))  // <-- correct pattern
                  B_shtcuts.SetShortcutStartDir(A_wants[i], str);
          }
      }
      ```
      `pimShortcutMgr::GetShortcutProgramMenu(id, value)`
      (`pim_ui/pim_ui_src/pimShortcutMgr.cxx:191-211`) leaves `value`
      **entirely untouched** when the shortcut identified by `id` has no
      `<PROGRAMSMENU>` child — it simply `return`s `false` without writing
      anything. `str` is declared once, outside the loop, and reused across
      every iteration.
    consequence: >
      If `A_wants[i]`'s shortcut lacks a `<PROGRAMSMENU>` entry, `str` still
      holds whatever value a **previous, unrelated** iteration's successful
      `GetShortcutProgramMenu()` call left in it, and the immediately
      following, unconditional `SetShortcutProgramMenu(A_wants[i], str)`
      writes that stale, wrong value into the *current* shortcut's Program
      Menu group on `Eb` regardless. On the very first loop iteration, `str`
      is simply empty, so the consequence there is data loss (an
      unset/blanked Program Menu group) rather than cross-contamination.
      Confirmed by direct contrast with the very next field,
      `GetShortcutStartDir()`/`SetShortcutStartDir()` (`:465-466`), which
      correctly gates the `Set` call on the `Get` call's return value — the
      exact pattern the `ProgramMenu` pair 3 lines earlier omits. This is a
      2nd, distinct bug in this function from the already-documented
      `pimsilentfixupshortcuts_array_index_bug` (which affects the 4
      `SetShortcut*State()` calls via a wrong array index, not a stale
      value). **Reachability, confirmed (found in a further, dedicated pass
      on this bug specifically, not merely hypothetical)**: `<PROGRAMSMENU>`
      is confirmed to be an **independently optional** per-shortcut child
      element — `pim_core/pim_core_src/pimShortcutLoop.cxx:88-341` parses
      `<PROGRAMSMENU>`/`<STARTMENU>`/`<DESKTOP>`/`<QUICKLAUNCH>` as sibling
      children of `<SHORTCUT>` in the same `else if` chain, each
      independently present-or-absent. A shortcut offered only via
      Desktop/Quicklaunch legitimately has no `<PROGRAMSMENU>` node at all,
      so this bug's trigger condition — a shortcut lacking `<PROGRAMSMENU>`
      immediately following, in loop order, a different shortcut that has
      one — is a normal configuration, not a contrived edge case.
    caution: >
      The mechanism itself is fully confirmed from both functions' own
      bodies, and the fix (gate the `Set` call on the `Get`'s return value,
      matching the `StartDir` pattern 3 lines later) is mechanical.
      **Downstream consequence, newly traced in the same pass, concrete and
      deterministic** (unlike the sibling `pimsilentfixuppsf_dummy_placeholder_can_get_stuck`
      rule's document-order-dependent caveat above): `pimEntitlement::InstallShortcuts()`
      (`pim_core/pim_core_src/pimEntitlement.cxx:5778-5787`) calls
      `pimShortcuts::GetInstance().Create(xmlPtr)` on the **same** `pimXmlFile*`
      document (`Eb`'s `xmlPtr`) `pimSilentFixupShortcuts()` mutates —
      confirmed object identity, at real install-execution time —
      constructing a `pimShortcutLoop` on that same document.
      `pimShortcutLoop::OnInstall()`
      (`pim_core/pim_core_src/pimShortcutLoop.cxx:324-326,654-671`) reads
      that shortcut's `<PROGRAMSMENU>` text content and uses it **directly
      as a filesystem subfolder path** (`CreateShortcutProgramsmenu()`,
      `location /= (cStringT)programsmenu;`) to physically place the
      installed `.lnk` file. If the stale value is non-empty (copied from a
      different, earlier-processed shortcut), the current shortcut's icon is
      installed into **that other shortcut's** Start Menu folder — a
      visible, user-facing misplacement. If the stale value is empty (the
      first loop iteration), `pimShortcutLoop::OnInstall()`'s
      `if (!programsmenu.IsEmpty())` guard skips `CreateShortcutProgramsmenu()`
      entirely — the Program-Menu placement is silently dropped, even if
      this shortcut's own "create in Programs Menu" boolean flag was
      separately set `true`. This is a visible install-time defect, not
      merely a data-integrity concern.
      **FIX VERIFIED, found in a further, dedicated pass specifically
      verifying this bug's already-proposed fix — not a new function, a
      deeper scrutiny of one already-recommended remediation**: gating
      `SetShortcutProgramMenu()` on `GetShortcutProgramMenu()`'s return
      value, mirroring the adjacent `GetShortcutStartDir()`/
      `SetShortcutStartDir()` pattern, is **confirmed sufficient**. Traced
      `SetShortcutProgramMenu()`'s own implementation
      (`pim_ui/pim_ui_src/pimShortcutMgr.cxx:169-189`) to confirm precisely
      what *not* calling it leaves behind: it only ever mutates an
      **existing** `<PROGRAMSMENU>` child's text content, found via a
      `while(child)` search loop; when skipped, `Eb`'s shortcut node is
      **not touched at all**, so its own original, media-template-authored
      value (if any) survives completely intact — the semantically correct
      outcome, matching exactly what the already-correct `StartDir`
      pattern already does. No partial or residual corruption case
      remains.
      **NEW LIMITATION, found in the same pass, shared by the fix AND the
      pattern it mirrors alike (not introduced or left unaddressed by the
      fix itself)**: `SetShortcutProgramMenu()` — and
      `pimShortcutMgr::SetShortcutState()` (`:426-454`, the shared
      primitive behind `SetShortcutProgramsMenuState()`'s create/remove
      toggle) — can **only** mutate a child node that already exists on
      `Eb`'s shortcut; neither ever calls `createElement()`/`appendChild()`
      to add a missing `<PROGRAMSMENU>` node. Confirmed identical in
      `SetShortcutStartDir()` (`:213-233`) itself — the "already correct"
      reference pattern shares this exact same structural ceiling,
      previously unexamined because it was only ever cited as the good
      contrasting example, never scrutinized on its own. Consequence: even
      with the fix applied, if `A`'s request XML wants to newly grant
      Program-Menu placement (or a custom group name) to a shortcut whose
      `B` media template never defined a `<PROGRAMSMENU>` child at all,
      that customization is **silently, completely unrealizable** — both
      `SetShortcutProgramMenu()` (the name text) and
      `SetShortcutProgramsMenuState()` (the enable/disable toggle) return
      `false` and change nothing. This is not a corruption risk and not
      something the proposed fix was ever meant to solve — `<PROGRAMSMENU>`
      being independently optional per shortcut means some shortcuts
      structurally cannot be granted Program-Menu placement via this
      function, by design, regardless of the fix. `pimShortcutLoop::OnInstall()`'s
      own parsing (`pimShortcutLoop.cxx:159-189`) confirms this is a
      silent, non-crashing outcome at install time too: a `<PROGRAMSMENU>`
      child that was never created simply never matches that `else if`
      branch, leaving its local `programsmenu` at its initialized default —
      the shortcut installs with no Program-Menu entry, with no error
      anywhere in the pipeline. A more complete remediation, if this
      narrower customization gap is ever judged worth closing, would have
      `SetShortcutProgramMenu()`/`SetShortcutState()` create the missing
      child node when absent, rather than only the minimal `if`-guard
      verified here.

  pimsilentcreateentitlement_package_selection_matches_canmatchneeds:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCreateEntitlement()`'s package-selection loop
      (`pim_core/pim_core_src/pimSilent.cxx:576-586`):
      ```cpp
      A_pkg.GetInstallPackageNames(A_wants);
      B_pkg.GetAllPackageNames(B_avail);
      for (int i = 0; i < (int)B_avail.GetSize(); i++)
      {
          if (A_wants.Find(B_avail[i]) != -1)
              B_pkg.SetPackageInstallState(B_avail[i], true);
          else
              B_pkg.SetPackageInstallState(B_avail[i], false);
      }
      B_pkg.Refresh();
      ```
      calls `pimPackageMgr::GetInstallPackageNames()`
      (`pim_core/pim_core_src/pimPackageMgr.cxx:611-666`) on `A` — the
      **identical** call, on the same `A` XML, that
      `pimSilentCanMatchNeeds()`'s compatibility check
      (`pimsilentcanmatchneeds_package_check_mode_dependent`, above) makes
      before this function ever runs. `pimSilentCreateEntitlement()`'s sole
      confirmed call site (`pim/pim_src/pimTop.cxx:1535`) is always
      immediately preceded, in the same iteration of the same loop, by a
      successful `pimSilentTestXmlIsUseable()` call — which itself calls
      `pimSilentCanMatchNeeds()` on the identical `A`/`B` pair
      (`pim_core/pim_core_src/pimSilent.cxx:87`).
    consequence: >
      Since `pimGetBasePackMode()`/`pimGetCreoNGCRIMode()`/`pimGetAllPacksMode()`
      are process-wide flags set once at the start of the run and never
      change mid-run, the 2 back-to-back calls to `GetInstallPackageNames()`
      on the same `A` are guaranteed to return the identical "wanted"
      package set. This confirms that `pimSilentCanMatchNeeds()`'s
      mode-dependent package check validates *exactly* the set of packages
      `pimSilentCreateEntitlement()` will subsequently mark for install on
      `B` — the 2 functions are consistent with each other by construction,
      not merely by coincidence. This is why the earlier characterization of
      `-basepack` as causing a "validation gap" and `-allpacks` as "overly
      strict" (in `pimsilentcanmatchneeds_package_check_mode_dependent`) was
      corrected: under `-basepack`, no package `pimSilentCanMatchNeeds()`
      fails to check for is a package `pimSilentCreateEntitlement()` was
      ever going to select for install; under `-allpacks`, requiring `B` to
      carry every declared package is consistent with that flag's own
      "install everything" semantics.
    caution: >
      This consistency is guaranteed only because both functions call
      `GetInstallPackageNames()` the same way. If either function were ever
      changed to build its package set differently (e.g. `pimSilentCanMatchNeeds()`
      switched to `GetAllPackageNames()`, or `pimSilentCreateEntitlement()`
      added its own independent filtering), the 2 functions could diverge
      and the validation-matches-installation guarantee this rule documents
      would break silently.

  pimsilentcreateentitlement_msi_node_last_value_wins:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCreateEntitlement()`'s `<MSI>`-node property-copy loop
      (`pim_core/pim_core_src/pimSilent.cxx:604-684`):
      ```cpp
      // Read from A: format/Cmd declared ONCE, outside the loop
      next_nl = Ea.GetXMLPtr()->getDocument()->getElementsByTagName(pimMSI);
      for (index = 0, max = next_nl->getLength(); index < max; index++)
      {
          ...
          if (attribFormat)
              format = StrX(attribFormat->getNodeValue()).localForm();   // overwritten every iteration
          if (InstallCommand)
              Cmd = StrX(InstallCommand->getTextContent()).localForm();  // overwritten every iteration
      }
      // Write to B: the ONE surviving value pair stamped onto EVERY <MSI> node
      next_nl = Eb->GetXMLPtr()->getDocument()->getElementsByTagName(pimMSI);
      for (index = 0, max = next_nl->getLength(); index < max; index++)
      {
          ((DOMElement*)nodeb)->setAttribute(pimformat, x_format.unicodeForm());
          // ... InstallCommand_b's <MSIARGUMENT> text set to Cmd, unconditionally
      }
      ```
      Both `format`/`Cmd` are declared once, outside both loops — the read
      loop's every iteration silently overwrites whatever the previous
      `<MSI>` node contributed, so only the **last** node in `A`'s document
      order survives; the write loop then stamps that one surviving value
      pair identically onto **every** `<MSI>` node in `B`.
    consequence: >
      Any distinctions between `B`'s own, independently-configured `<MSI>`
      nodes — different `format` (installer UI mode) or `<MSIARGUMENT>`
      (install command-line arguments) per package — are erased and
      replaced with whichever single `<MSI>` node's values happened to be
      last in `A`'s document order. **Reachability, confirmed (found in a
      further, dedicated pass on this bug specifically, not merely
      hypothetical — this upgrades a prior "no product XML available to
      test" caveat)**: `pimMSILoop::pimMSIExec()`
      (`pim_core/pim_core_src/pimMSILoop.cxx:154-161`, the actual MSI
      install-execution driver, already a fully documented `pimLoop`
      subclass) independently iterates **every** `<MSI>` node in the
      document via the identical `getElementsByTagName(pimMSI)` call,
      skipping only those `IsEligibleForInstall()` rejects, and executes
      each eligible node as its own, separate MSI install action. This
      confirms multi-`<MSI>`-node product XML — multiple, independently
      install-eligible MSI packages per entitlement — is a real,
      designed-for, normally-executed configuration in this codebase, not a
      hypothetical edge case. `pimMSILoop::pimMSIExec()`'s own
      `<MSIARGUMENT>`-reading (`:249-260`) even correctly concatenates
      **all** `<MSIARGUMENT>` children of a single `<MSI>` node, by
      contrast with `pimSilentCreateEntitlement()`'s cruder single-value
      read via `GetChildNodeByNodeName()` (which returns only the first
      match) — further evidence the rest of this codebase treats
      multi-value MSI configuration as normal, not exceptional.
    caution: >
      **Downstream consequence, newly traced in the same pass**: the single
      `format`/`Cmd` pair this loop stamps onto every `<MSI>` node in `B`
      is exactly what `pimMSILoop::pimMSIExec()` reads **per node** at real
      install-execution time. `attribFormat`
      (`pim_core/pim_core_src/pimMSILoop.cxx:596-614`) directly selects
      that node's install **UI mode** — `"full"` (a user-facing installer
      wizard the user must click through or cancel), `"basic"`, or
      silent — and the `<MSIARGUMENT>` text feeds directly into that node's
      `msiexec.exe` command line. If `B` legitimately has 2+ MSI packages
      meant to install under **different** UI modes or with different
      install arguments (e.g. one silent background package alongside one
      that legitimately requires the full interactive wizard), this bug
      forces **all** of them to adopt whichever single mode/argument pair
      happened to belong to the **last** `<MSI>` node read from `A`'s
      document — a confirmed, install-time consequential data-corruption
      bug that can visibly change which installer UI a user sees (or is
      silently denied) during a multi-package MSI install, not merely a
      latent XML-consistency concern. The fix requires matching `A`'s and
      `B`'s `<MSI>` nodes by identity (e.g. their `pimname`/`pimPRODUCTCODE`
      attribute) and copying each node's own values independently, rather
      than collapsing all nodes into 1 pair of local variables.
      **FIX VERIFIED (PARTIALLY), found in a further dedicated pass
      specifically verifying this bug's already-proposed fix — not a new
      function, a deeper scrutiny of one already-recommended
      remediation**: traced `pimMSIExec()`'s own attribute reads
      (`pim_core/pim_core_src/pimMSILoop.cxx:202-207`) off the **identical**
      `<MSI>` nodelist this function iterates — **confirms both `name` and
      `PRODUCTCODE` genuinely exist on real `<MSI>` nodes** in this
      codebase, not speculative attribute names, grounding the proposed
      per-node-identity fix in fact.
      **But the fix's own "either" phrasing is under-specified — the 2
      keys have opposite tradeoffs** for the cross-version matching this
      function exists to perform: `PRODUCTCODE` is a Windows Installer
      GUID conventionally expected to change on most new MSI builds (a
      well-established external convention, not itself confirmed from
      this archive, since no MSI-authoring documentation exists in it) —
      a `PRODUCTCODE`-only match would likely find **no** correspondence
      at all between `A`'s (older/customized) request XML and `B`'s
      (newly matched) media in the realistic case this function handles,
      silently degrading the "fix" to "no customization ever survives" —
      trading the confirmed corruption bug for a confirmed loss of the
      feature's entire purpose. `name`, by contrast, is a stable,
      human-authored label far more likely to persist across a product's
      version history, making it the practically workable primary key —
      but is **not** enforced unique by any schema in this archive, so 2
      `<MSI>` nodes sharing the same name (not confirmed to occur, but not
      ruled out) could still collide under name-only matching. A robust
      implementation would need to try `PRODUCTCODE` first (exact package
      identity, when it happens to match) and fall back to `name`
      (broader, version-tolerant reach) — neither the original bug report
      nor the proposed fix's own phrasing specifies this fallback design.
      **New asymmetry, found while verifying the fix, orthogonal to the
      name-collapsing bug**: even before per-node matching, the existing
      write loop's own `format`-attribute handling (`:654-661`) only
      overwrites `B`'s `format` attribute **if `B`'s own node already has
      one** (no `else` branch to create it), while the `<MSIARGUMENT>`
      child-element handling immediately below (`:663-673`) **does**
      create a missing child. Any correctly-scoped per-node fix must
      consciously preserve or correct this existing
      create-vs-update-only asymmetry between the 2 fields it copies, not
      just the node-identity matching — a design detail the original bug
      report and its proposed fix did not address.

  pimsilentcreateentitlement_property_skip_list_confirmed_correct:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCreateEntitlement()`'s `<PROPERTY>`-copy loop
      (`pim_core/pim_core_src/pimSilent.cxx:503,687-733`) copies most of
      `A`'s `<PROPERTY>` values onto `B`, except for 4 names held in a
      function-local `PropertyNamesToKeepUnchanged` array, populated fresh
      every call:
      ```cpp
      StringXArray PropertyNamesToKeepUnchanged;   // :503
      ...
      PropertyNamesToKeepUnchanged += "[SHIPCODE]";
      PropertyNamesToKeepUnchanged += "[VERSION]";
      PropertyNamesToKeepUnchanged += "[SOURCE]";
      PropertyNamesToKeepUnchanged += "CustomActions";
      ...
      if (PropertyNamesToKeepUnchanged.Find(name) != -1)
          continue;
      ```
      A file-header changelog entry (`pimSilent.cxx:7`, "Fix PROPERTY
      handling; some should not be changed") confirms this list was added
      specifically to fix an earlier bug where these values *were* being
      overwritten.
    consequence: >
      **Confirmed, found in a further, dedicated pass on this skip list
      specifically**: each of the 4 names has a distinct, confirmed
      downstream reason to stay `B`'s own — this is not a blanket caution,
      and the list is confirmed **correct as written**, not a bug or gap.
      **`[SHIPCODE]`**: read immediately after `Eb`'s creation by
      `pimSilentInstallFromXML()` (`pim/pim_src/pimTop.cxx:1556-1559`) to
      populate the session's own `SHIPCODE_PROPERTY` from `Eb`'s **own**
      value — must reflect which physical media/build `B` actually is, not
      whatever `A`'s request XML happens to declare. **`[VERSION]`**:
      originally populated by `pimEntitlement::Init()` itself
      (`pim_core/pim_core_src/pimEntitlement.cxx:944,1195`) directly from
      `Eb`'s own `<PRODUCT version>` attribute at `Eb`'s own initialization
      time — intrinsic to which XML file `Eb` was created from — and later
      read by `pimCustomActionsLoop`
      (`pim_core/pim_core_src/pimCustomActions.cxx:542`) for version-gated
      custom-action behavior and by `pimSessionInfo`
      (`pim_core/pim_core_src/pimSessionInfo.cxx:1801,2316`) for
      cross-entitlement version matching. **`[SOURCE]`**: unconditionally
      **overwritten anyway** by the same caller loop moments after
      `pimSilentCreateEntitlement()` returns
      (`pim/pim_src/pimTop.cxx:1598`, `SetProperty("[SOURCE]",
      ArgZero.GetHead())`) — its exclusion here is consistent with, but
      largely superseded by, that later explicit set. **`CustomActions`**:
      gates **many** real install/uninstall lifecycle hook points —
      `PreUpgrade`, `PreInstall`, `PreMSIConfigure`, `PostCopy`,
      `PostInstall`, `PostUpgrade`, `PreReconfigure`, `PostReconfigure`,
      `PreUninstall`, and more — via
      `pimEntitlement::OnInstallCustomActions()`/`OnUninstallCustomActions()`'s
      `xmlPtr->GetProperty("CustomActions", str)` truthy-check
      (`pim_core/pim_core_src/pimEntitlement.cxx:5151,5882,6024,6669,6753,6837,6842,7023,7159,7228,7309`),
      each constructing a `pimCustomActionsLoop` — a **newly-discovered
      `pimLoop` subclass** (`pim_core/includes/pimCustomActions.h` +
      `pim_core_src/pimCustomActions.cxx`) not previously mentioned
      anywhere in this doc set — on the same `xmlPtr`. The property's mere
      **presence**, not even its specific value, determines whether `B`'s
      own baked-in custom-action fixups run at all across the entire
      install/uninstall lifecycle.
    caution: >
      **Verified non-issue, not a bug (checked while tracing the skip check
      itself)**: the copy loop's `name` variable (`:688`) is declared once
      outside the `do`/`while` loop, so a `<PROPERTY>` node lacking a
      `name` attribute would leave `name` holding a stale value from a
      prior iteration when `PropertyNamesToKeepUnchanged.Find(name)` runs —
      but the immediately following copy loop's own guard
      (`for (int i = 0; attribName != NULL && i < ...)`, `:712`) means
      **0 copies happen either way** for such a node, so the stale value
      has no observable effect — unlike the superficially similar, but
      genuinely live, bug documented in
      `pimsilentfixupshortcuts_stale_programmenu_copy` above. If this
      `attribName != NULL` guard is ever removed or the loop restructured,
      this stale-`name` pattern would need to be revisited, since it would
      no longer be inert.
      **FIX VERIFIED (COSMETIC), found in a further dedicated pass
      specifically verifying this loop's proposed hardening fix — not a
      new function, a deeper scrutiny of one already-recommended,
      low-priority remediation ("initialize the loop's `name` variable
      fresh each iteration")**: confirmed still cosmetic today — traced
      precisely which guard does the real work: the inner for-loop's own
      `attribName != NULL` condition is the **sole**, always-present
      safety net, regardless of what the outer skip-list `continue` does
      with a stale `name`. Applying the fix (`name.Clear()`, or
      re-declaring `name` inside the loop — confirmed equivalent) changes
      **nothing observable**: `PropertyNamesToKeepUnchanged.Find("")`
      finds no match so the `continue` no longer fires, but the inner
      loop's own guard still independently produces 0 copies — the same
      net result. The fix's real value is closing a **latent maintenance
      trap**, not fixing a live bug: a plausible future refactor
      "simplifying" the inner loop's condition to just
      `i < map->getLength()` (reasoning, incorrectly, that the outer
      `continue` already handles the no-name case) would silently
      reintroduce exactly the kind of stale-value corruption already
      confirmed live in `pimsilentfixupshortcuts_stale_programmenu_copy`,
      since the outer `continue`'s protection was never real to begin
      with.
      **CONFIRMED BUG, found in the same pass, by tracing this loop's full
      return-value chain — a new finding, distinct from the
      `name`-staleness issue**: `pimXmlFile::GetProperty()`
      (`pim_core/pim_core_src/pimXmlFile.cxx:783-808`) is called at
      **both** value-copy sites (`:719`, the `pimname`/text-content case;
      `:725`, the general-attribute case) with its own `bool` return value
      **discarded**. `GetProperty()` internally calls
      `GetPropertyNode(name, &matchedNode)` (`:755-781`), which searches
      `Ea`'s **entire document**, by `name`, for the **first**
      `<PROPERTY>` node matching in document order — not necessarily the
      same node this `do`/`while` loop is currently iterating. If that
      search fails, or the matched node lacks the specific `attrib` being
      requested, `GetProperty()` returns `false` and leaves `value`
      **entirely untouched** — but `Eb->GetXMLPtr()->SetProperty(name,
      value, ...)` (`:720`, `:726`) is called **unconditionally**
      regardless, potentially writing a stale value carried over from a
      previous, unrelated attribute or property earlier in the same loop
      onto `B`. **Reachability, precisely characterized**: this can only
      actually diverge when `Ea`'s document contains **2 or more**
      `<PROPERTY>` nodes sharing the same `name` — not prevented by any
      schema in this archive — in which case `GetPropertyNode()`'s
      document-order search returns the **first** duplicate, not
      necessarily the one currently being iterated; if that first
      duplicate lacks the specific attribute the current node has, the
      copy silently uses a stale value instead. Not confirmed reachable
      against a real product XML (none exists in this archive), but the
      mechanism is fully confirmed from source, and mirrors — in a
      previously unexamined location — the exact "discarded `Get()`
      return + reused stale variable" pattern already confirmed live in
      `pimsilentfixupshortcuts_stale_programmenu_copy`. **A more robust
      alternative, already available in the code's own hands**: for the
      general-attribute branch (`:722-727`), `attrib` (obtained via
      `map->item(i)`, `:714`) **is already the exact DOM attribute node**
      whose value is wanted — `attrib->getNodeValue()` would read it
      directly, with no document-wide re-search, no dependency on `name`
      uniqueness, and no staleness risk at all, making the current
      indirect `GetProperty()`/`SetProperty()` roundtrip unnecessary for
      this branch specifically. The `pimname`/text-content branch
      (`:717-720`) genuinely needs the indirect lookup, since the wanted
      value (the property's text content) isn't available directly from
      `attrib` — but its discarded return value is not otherwise addressed
      by this simplification and would still need an explicit check. A fix
      would check `GetProperty()`'s return value at both call sites and
      skip the corresponding `SetProperty()` call when it fails, in
      addition to (or instead of, for the general-attribute branch) the
      direct-read simplification.

  pimisversionmatch_shipcode_check_optional_not_enforced:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimIsVersionMatch()`'s shipcode comparison
      (`pim_core/pim_core_src/pimSilent.cxx:197-209`):
      ```cpp
      if (Ea.GetShipcode(MOR_A) && Eb.GetShipcode(MOR_B))   // BOTH must expose one
      {
          int res = pimCompareShipcode(MOR_A, MOR_B);
          if (res == 0)
              Minor = true; // same
          if (res == 1)
              return false; // A newer than B -- needs newer DVD source
          // res == -1 (B newer) or the `if` above never ran: falls
          // through with Minor still false
      }
      return true;
      ```
      `pimEntitlement::GetShipcode()`
      (`pim_core/pim_core_src/pimEntitlement.cxx:2066-2090`) returns
      `false` whenever the root `<PRODUCT>` node has **neither** an
      `appshipcode` **nor** a `shipcode` attribute. `pimEntitlement::Init()`
      (`pim_core/pim_core_src/pimEntitlement.cxx:846-870`) only requires
      the root's `tag`/`version` attributes to succeed — `shipcode`/
      `appshipcode` are **not** required — so a fully valid,
      `Init()`-succeeding product XML can legitimately omit both, and this
      `if` block simply never executes for it.
    consequence: >
      **Reachability, precisely characterized (found in a further,
      dedicated pass on this comparison specifically, not merely
      hypothetical)**: this is a structural gap in what the check actually
      enforces — not confirmed against any specific real product/media XML
      in this archive (none exists), but the mechanism is fully confirmed
      from `Init()`'s own attribute requirements. **Downstream consequence,
      newly traced**: when the shipcode check is skipped this way,
      `pimIsVersionMatch()` reaches `return true;` via the **exact same
      code path** as an explicit shipcode match (`res == 0` or
      `res == -1`) — nothing distinguishes "the comparison ran and passed"
      from "the comparison never ran at all": no log message, no warning,
      no property is set to record which case occurred.
      `pimSilentTestXmlIsUseable()`'s own differentiated-error logic
      (`if (!pimIsVersionMatch(...)) { if (Major && !Minor)
      {...NeedNewerDVD...} if (!Major && !Minor) {...NeedSameVersionDVD...} }`)
      only inspects `Major`/`Minor` inside its
      `if (!pimIsVersionMatch(...))` branch — i.e. only on the **rejected**
      path — so it is never even consulted when the check was silently
      skipped; the caller proceeds straight to `pimSilentCanMatchNeeds()`/
      `pimSilentCreateEntitlement()` exactly as it would for an explicitly
      verified-compatible pair.
    caution: >
      **2 verified non-issues, checked while tracing this**: (1) `Minor` is
      only set `true` when shipcodes are **exactly equal** (`res == 0`),
      not when `B`'s is legitimately newer (`res == -1`, the function's
      own documented common case — "M020 XML definition using ... source
      DVD" from M030) or when the check is skipped entirely — but since
      `Major`/`Minor` are confirmed above to be read by the caller only on
      the rejected path, and this asymmetry only ever occurs on
      **accepted** paths, it has no observable effect. (2)
      `pimCompareShipcode()`'s own parameter names (`new_ship`/`old_ship`,
      `pim_util/pim_util_src/pimUtil.cxx:584`) don't reflect any enforced
      "new must be newer" contract — cross-checked against its only other
      call site (`pimEntitlement::GetSize()`, `pim_core/pim_core_src/pimEntitlement.cxx:2109`,
      which passes `this`'s own shipcode first and the product it's
      updating second, labeling `res == -1` "older version" without
      requiring a specific argument order) — confirming it is a generic,
      symmetric 3-way comparator with no baked-in role for either
      argument, so `pimIsVersionMatch()`'s `pimCompareShipcode(MOR_A,
      MOR_B)` call (`A` first, `B` second) is a valid, self-consistent
      usage, not a naming-driven bug. If a fix is ever made to close the
      optional-check gap (e.g. treating a missing shipcode on either side
      as a rejection, or logging when the comparison is skipped), it
      should not assume `pimCompareShipcode()`'s argument names imply
      anything about which side must be newer.

  pimsilentcanmatchneeds_platform_language_selection_diverges_from_validation:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCanMatchNeeds()`'s platform and language checks
      (`pim_core/pim_core_src/pimSilent.cxx:251-302`):
      ```cpp
      A_plat.GetInstallPlatformNames(A_wants);   // A's own install="Y" markings
      B_plat.GetAllPlatformNames(B_avail);
      ...
      A_lang.GetInstallLanguageNames(A_wants);   // A's own install="Y" markings
      B_lang.GetAllLanguageNames(B_avail);
      ```
      `pimPlatformMgr::GetInstallPlatformNames()`
      (`pim_core/pim_core_src/pimPlatformMgr.cxx:253-281`) and
      `pimLanguageMgr::GetInstallLanguageNames()`
      (`pim_core/pim_core_src/pimLanguageMgr.cxx:147-175`) are confirmed
      genuinely mode-free — plain, unconditional `install="Y"` attribute
      checks, no `pimGetBasePackMode()`/`pimGetCreoNGCRIMode()`/
      `pimGetAllPacksMode()`-style branching for either. But
      `pimSilentInstallFromXML()`'s post-creation code
      (`pim/pim_src/pimTop.cxx:1602-1635`, run **after**
      `pimSilentCreateEntitlement()` and therefore after this validation
      already ran) re-derives what actually gets selected on `Eb` from
      **entirely different inputs** than `A`'s `install="Y"` markings this
      check validates:
      ```cpp
      // pimTop.cxx:1608-1627 -- LANGUAGE driven by -LANG CLI / -allpacks
      if (pimShouldWeInitLanguageID("FR"))
          MyLang.SetLanguageInstallState("french", true);   // return value discarded
      ... // 8 more hardcoded languages, same pattern

      // pimTop.cxx:1629-1630 -- PLATFORM driven by the machine's own OS
      pimPlatformMgr MyPlats(SessionInfo.GetEntitlement(k)->GetXMLPtr());
      MyPlats.InitPlatformState(NULL);   // return value discarded
      ```
    consequence: >
      **Reachability, precisely characterized (found in a further,
      dedicated pass on this pair of checks specifically, not merely
      hypothetical)**: unlike the package check — where a separate rule
      (`pimsilentcreateentitlement_package_selection_matches_canmatchneeds`)
      confirms `pimSilentCreateEntitlement()`'s package-selection loop
      calls the **identical** `GetInstallPackageNames()` under the same
      mode flags this check uses, guaranteeing consistency — platform and
      language selection has **no such guarantee**.

      **CORRECTED (found in a further, dedicated pass on
      `pimSilentFixupPSF()`'s `Ea`/`Eb` reference-vs-copy semantics, which
      required re-reading `pimSilentCreateEntitlement()`'s full body):**
      the claim above is incomplete. `pimSilentCreateEntitlement()`
      (`pim_core/pim_core_src/pimSilent.cxx:549-569`) **does** mirror `A`'s
      platform/language onto `B` first, via the **identical**
      `GetInstallPlatformNames()`/`GetInstallLanguageNames()` calls this
      check uses — the same consistency pattern already confirmed for
      package selection, not an absent one. The real, narrower gap is that
      this internally-consistent mirroring is **subsequently undone** by a
      *second*, independent write: `pimTop.cxx`'s post-creation code
      (below) overwrites/expands the same 2 properties afterward using
      entirely different, never-validated inputs. Everything below this
      point (the `pimShouldWeInitLanguageID()`/`InitPlatformState()`
      analysis and the discarded-return-value downstream consequence)
      remains accurate and unchanged — it describes that *second* write,
      not a gap in `pimSilentCreateEntitlement()` itself.

      `pimShouldWeInitLanguageID(code)` (`pim/pim_src/pimGeneralInit.cxx:531-539`)
      returns `true` whenever `code` appears in the `-LANG <XX>`
      command-line list (`pim/pim_src/pimGeneralInit.cxx:269-273`) **or**
      `pimGetAllPacksMode()` is active — in which case **all 9** hardcoded
      languages are force-selected — entirely independent of whether `A`'s
      XML ever marked that language `install="Y"`.
      `pimPlatformMgr::InitPlatformState(NULL)`
      (`pim_core/pim_core_src/pimPlatformMgr.cxx:104-125`) derives the
      platform to select from `btkGetPlatform()` — the **current
      machine's own runtime OS platform** — falling back to `i486_nt` or
      `x86e_win64` if the exact detected platform isn't found in `B`,
      again entirely independent of what `A` requested or what this
      function validated. `pimSilentCanMatchNeeds()` has no access to the
      CLI args or the running machine's platform, so it structurally
      **cannot** validate what `-lang`/`-allpacks`/auto-detection will
      actually select against `B`'s real coverage — it only ever validates
      `A`'s own static XML markings.
    caution: >
      **Downstream consequence, newly traced in the same pass**: both
      `pimTop.cxx` call sites (`:1609-1627,1630`) discard the return value
      of `SetLanguageInstallState()`/`InitPlatformState()`.
      `pimLanguageMgr::SetLanguageInstallState()`
      (`pim_core/pim_core_src/pimLanguageMgr.cxx:41-82`) and
      `pimPlatformMgr::SetPlatformInstallState()`
      (`pim_core/pim_core_src/pimPlatformMgr.cxx:144-188`, called
      internally by `InitPlatformState()`) both return `false`
      **silently** — no log, no error — whenever
      `FindLangNode()`/`FindPlatNode()` fails to find a matching node in
      `B` at all. Confirmed consequences: a `-lang XX` (or `-allpacks`)
      request naming a language `B`'s media genuinely lacks is **silently
      dropped**, with zero diagnostic anywhere in the entire pipeline —
      neither this validation-time check (which never saw the CLI flag)
      nor the post-creation `SetLanguageInstallState()` call (whose
      failure is discarded) ever surfaces it; and if the auto-detected
      platform and **both** of `InitPlatformState()`'s fallbacks all fail
      to match anything in `B`, the resulting entitlement silently ends up
      with **no platform marked for install at all**, again completely
      undiagnosed. A fix would need to either have
      `pimSilentCanMatchNeeds()` validate the actual `-lang`/`-allpacks`/
      auto-detected selections (requiring it to receive the CLI context it
      currently lacks), or have `pimTop.cxx` check and log the
      `Set*InstallState()`/`InitPlatformState()` return values it
      currently discards.
      **CORRECTION, found in a further, dedicated pass verifying these 2
      proposed fixes**: "requiring it to receive the CLI context it
      currently lacks" **overstated the obstacle** — `pimShouldWeInitLanguageID()`/
      `pimGetAllPacksMode()` and `btkGetPlatform()` are all global,
      parameterless (or self-contained-state) accessors, already called
      this exact way from at least 8 other sites in this codebase; this
      function's own package half already reads
      `pimGetBasePackMode()`/`pimGetCreoNGCRIMode()`/`pimGetAllPacksMode()`
      the identical way. No signature change or CLI-context plumbing is
      needed — **confirmed architecturally feasible for both**, resolving
      this rule's own earlier hedge.
      **FIX (a) VERIFIED SUFFICIENT ONLY FOR DIAGNOSABILITY**: logging the
      silent failures makes the outcome visible but changes nothing about
      it — traced the zero-platform case one level further into
      `pimPackageMgr::RefreshAFeatureNode()`
      (`pim_core/pim_core_src/pimPackageMgr.cxx:883-980`): every
      `<CDSECTION>`/`<MSI>` node carrying a `platform` attribute is set
      `install="N"` whenever no platform is ever marked `install="Y"` — a
      near-total, silent install failure logging alone cannot prevent.
      **CORRECTION on the fallback mechanism itself**: `InitPlatformState()`'s
      "2-level fallback" is a **mutually exclusive, conditionally-chosen
      single fallback** (`pimPlatformMgr.cxx:104-125`) — `x86e_win64`/
      `arm64_win64` detected → try `i486_nt` only; anything else → try
      `x86e_win64` only — never both names tried in sequence.
      **FIX (b) CONFIRMED INCOMPLETE AS STATED**: a validating copy must
      replicate this exact single-fallback branch, or it produces
      **false-negative rejections** for A/B pairs that succeed today via
      the fallback; it would also create a **2nd, independent copy** of
      both the 9-hardcoded-language rule and the platform fallback,
      duplicating logic `pimTop.cxx` already owns with nothing keeping the
      2 in sync — and it raises an **unresolved policy question** this
      codebase never states an answer to: should a machine merely lacking
      the auto-detected platform have its whole install rejected outright,
      or proceed with just that piece silently missing, as today?

  pimsilentfixuppsf_ea_eb_reference_semantics:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentFixupPSF(pimEntitlement& Ea, pimEntitlement& Eb)`
      (`pim_core/pim_core_src/pimSilent.cxx:353-416`) declares both
      parameters as symmetric, non-`const` references, but a full call
      trace of the function body confirms **asymmetric roles**:
      every single `Ea`/`A_cmds` call is a read-only accessor
      (`GetCommandInfoByName()`/`GetAllCommandNames()`), never a mutator,
      while `Eb`/`B_cmds` is the **sole** read-write target
      (`DeleteCommand()`/`AppendAddCommand()`). `Ea` could safely be
      declared `const pimEntitlement&` — a minor, confirmed API-clarity
      gap, not a functional bug (nothing currently mutates `Ea` through
      this signature).
    consequence: >
      **Ephemeral vs. persistent lifetimes, confirmed by tracing the sole
      call site** (`pimSilentCreateEntitlement()`,
      `pim_core/pim_core_src/pimSilent.cxx:507-521,736`): `Ea` is a
      genuinely **ephemeral**, stack-allocated `pimEntitlement` —
      `Init()`'d fresh from `A`'s file path and destroyed (its `xmlPtr`
      explicitly deleted, `pimEntitlement::~pimEntitlement()`,
      `pim_core/pim_core_src/pimEntitlement.cxx:226-234`) the moment
      `pimSilentCreateEntitlement()` returns. `Eb` is **not a copy at
      all** — `pimEntitlement* Eb = pimGetSessionInfo()->GetEntitlement(entitlement_index)`
      points directly at the real, session-owned, **persistent** object
      `AddEntitlement(B)` just created, and `pimSilentFixupPSF(Ea, *Eb)`
      mutates that same object by reference — confirming why every
      already-documented downstream consumer (`pimScriptLoop`,
      `pimShortcutLoop`, `pimMSILoop`, etc.) genuinely reads the identical
      object this function wrote to, not a snapshot.
    caution: >
      **Reachability, precisely characterized (a real but confirmed
      UNREACHABLE structural hazard)**: `pimEntitlement` owns a raw
      `xmlPtr` pointer, explicitly `delete`d in its destructor, but
      defines **no custom copy constructor or assignment operator**
      anywhere in `pim_core/pim_core_src/pimEntitlement.cxx` — relying on
      compiler-generated (shallow-copy) defaults, which would double-free
      `xmlPtr` if 2 `pimEntitlement`s ever shared it via a by-value copy
      or assignment. An exhaustive search (every `pimEntitlement`
      local/parameter NOT declared as a pointer or reference, across the
      entire archive) confirms the **only 3** stack-allocated, value-type
      `pimEntitlement` instances anywhere in this codebase are all in this
      same file — `pimIsProductXmlMatch()`'s and `pimIsVersionMatch()`'s
      own `Ea`/`Eb` (`:110,150`), and `pimSilentCreateEntitlement()`'s own
      `Ea` (`:507`) — and every one confirmed used safely: default
      -constructed, `Init()`'d as a member call, never copy-constructed or
      assigned from another `pimEntitlement`. Every other entitlement
      anywhere in the codebase is held via `dsXArray<pimEntitlement*>`
      (`pim_core/includes/pimSessionInfo.h:96-97`) or a raw pointer, never
      by value — making the reference-parameter choice here the correct,
      load-bearing design decision that avoids ever triggering this latent
      hazard. If `pimEntitlement` is ever given a custom copy constructor
      or assignment operator, it **must** perform a deep copy of `xmlPtr`;
      this is currently safe only because no by-value usage exists
      anywhere in this archive. **Verified non-issue**: although `Ea` is
      destroyed immediately after this call, every value
      `pimSilentFixupPSF()` copies from it into `Eb` (desc/licIdentifiers/
      features, via `GetCommandInfoByName()`'s `btkString`/`StringXArray`
      out-parameters) is a genuine value copy, not a reference back into
      `Ea`'s own DOM tree — `Eb`'s resulting document holds no dangling
      reference to `Ea` after `Ea` disappears.
      **CONFIRMED NOT PURELY MECHANICAL, found in a further, dedicated pass
      verifying the `Ea` const-reference hardening suggested above**
      (`pim_core/includes/pimEntitlement.h:320`,
      `pim_core/includes/pimCommandMgr.h:54-118`): this function's only
      direct call on `Ea`, `Ea.GetXMLPtr()` (`:357`), depends on
      `pimEntitlement::GetXMLPtr()` — `pimXmlFile* GetXMLPtr() { return
      xmlPtr; }` — which is **not** declared `const`, so `const
      pimEntitlement& Ea` as literally proposed **fails to compile**, since
      a `const` object cannot call a non-`const` member function, even a
      logically read-only one. **Confirmed safe prerequisite**:
      `const`-qualifying `GetXMLPtr()` itself (same non-`const`
      `pimXmlFile*` return type, ordinary "shallow const," since its body
      never mutates `xmlPtr`) resolves this with **zero** behavior change
      anywhere — `pimCommandMgr`'s constructor already accepts a plain
      non-`const` `pimXmlFile*` regardless. An exhaustive search confirms
      **zero** existing `const pimEntitlement` usage anywhere in this
      codebase today, so this is a pure widening, never a narrowing of any
      existing call site. **Confirmed scope ceiling**: even with both
      changes applied, the `const` only blocks a non-`const`
      `pimEntitlement`-level call directly on `Ea` — reading
      `pimCommandMgr.h` in full confirms **none** of its public methods,
      including the 3 read-only accessors this function calls on `A_cmds`,
      are declared `const`, so `A_cmds` itself could still mutate `Ea`'s
      document with no compiler objection, before or after the fix
      (confirmed **zero** `const pimXmlFile` usage in any header either).
      The hardening is confirmed to be a documentation-only signal at this
      function's own signature, not a real guard against the realistic
      mistake one layer below.

  pimisproductxmlmatch_no_cross_schema_fallback:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimIsProductXmlMatch()` (`pim_core/pim_core_src/pimSilent.cxx:106-134`):
      ```cpp
      bool pimIsProductXmlMatch(const char* A, const char* B)
      {
          if (A && B)
          {
              pimEntitlement Ea, Eb;
              if (Ea.Init(A, NULL))                     // A parses as <PRODUCT>
              {
                  if (Eb.Init(B, NULL))                  // B tried the SAME way only
                      if (strcmp(Ea.GetTag(), Eb.GetTag()) == 0)
                          return true;
              }
              else if (Ea.Init(A, "EXTERNAL_INSTALLER")) // only if A's NULL-Init failed
              {
                  if (Eb.Init(B, "EXTERNAL_INSTALLER"))  // B tried the SAME way only
                      if (strcmp(Ea.GetTag(), Eb.GetTag()) == 0)
                          return true;
              }
          }
          return false;
      }
      ```
      `pimEntitlement::Init(path, root_match)`
      (`pim_core/pim_core_src/pimEntitlement.cxx:771-`) requires the XML's
      root element to be exactly `<PRODUCT>` when `root_match` is `NULL`, or
      exactly `<EXTERNAL_INSTALLER>` when `root_match` is that string — a
      single document can only satisfy one of the two. `pimIsVersionMatch()`
      (`pim_core/pim_core_src/pimSilent.cxx:143-215`) duplicates this exact
      `Ea`/`Eb` initialization pattern verbatim, so it carries the identical
      limitation.
    consequence: >
      Whichever schema hypothesis succeeds for `A` is the **only** one ever
      tried for `B` within that same call. If `B`'s `Init()` fails under
      that schema — because `B` actually uses the *other* root schema — the
      function returns `false` without ever attempting the other schema for
      `B`, even if `A`'s and `B`'s `<TAG>` values (or, for
      `pimIsVersionMatch()`, version/shipcode values) are otherwise
      identical. A mixed-schema `A`/`B` pair (one `<PRODUCT>`-rooted, one
      `<EXTERNAL_INSTALLER>`-rooted) is confirmed to always be reported as
      "no match," which `pimSilentTestXmlIsUseable()`'s caller then surfaces
      as `PIM_SOFTWARE_NOT_FOUND`
      (`pim_core/pim_core_src/pimSilent.cxx:98-101`) even though the two
      files may describe the same underlying product.
    caution: >
      The mechanism itself is fully confirmed from both functions' own
      control flow and `pimEntitlement::Init()`'s documented root-tag
      matching contract. **Reachability, more precisely characterized
      (found in a further, dedicated pass on this bug specifically, not
      merely hypothetical)**: this codebase's **own** other 2 product-XML
      resolution call sites do **not** assume a fixed schema for a single
      file — `pim_core/pim_core_src/pimEntitlement.cxx:634-635` (resolving a
      product's own installed `.p.xml`) tries
      `Init(file, NULL) || Init(file, "EXTERNAL_INSTALLER") || Init(file, "HIDDEN_PRODUCT")`
      in sequence, and `pimEntitlement.cxx:967-968` (resolving a
      `<PREREQUISITE>` product reference) tries
      `Init(x) || Init(x, "EXTERNAL_INSTALLER")`. Both confirm, elsewhere in
      this exact codebase, that a product's root schema is treated as
      unpredictable and deliberately checked for by trying multiple
      schemas — `pimIsProductXmlMatch()`/`pimIsVersionMatch()` are the only
      2 functions in this file that instead silently assume `A` and `B`
      share whichever single schema matched `A` first. This is direct,
      confirmed evidence — not mere speculation — that this codebase's own
      design does not guarantee a product's on-media XML (`B`) uses the
      same root schema as the user's silent-install request XML for that
      same product (`A`); the absence of a sample mixed-schema pair in this
      archive is a gap in available test data, not a reason to doubt the
      mechanism is real. Worth adding a 2nd fallback attempt (try `B` under
      the *other* schema when the first `Init()` fails, mirroring the 2
      call sites above) as a priority fix, not a speculative one.
      **Downstream consequence, newly traced in the same pass**:
      `pimIsProductXmlMatch()`'s only caller is
      `pimSilentTestXmlIsUseable()` (`pimSilent.cxx:54`), whose only caller
      in turn is `pimSilentInstallFromXML()`'s per-file loop
      (`pim/pim_src/pimTop.cxx:1532`). When a mixed-schema false-negative
      makes `pimSilentTestXmlIsUseable()` return `false`, the `pimTop.cxx`
      caller's `if` block at `:1532` is simply skipped for that
      `AskedToInstallThisList[i]` entry — no `else` branch, `abort` is
      **not** set `true`, and the outer loop (`:1530`) continues straight
      to the next `i`. Traced 2 further-downstream effects, neither
      previously examined: (1) that product silently receives **no
      entitlement at all** — dropped from the batch with nothing beyond a
      log line to mark it, while any other products in the same batch
      proceed normally; and (2) `pimHitError()`
      (`pim/pim_src/pimExit.cxx:16-19`) only appends to a process-wide
      static `Errors` array, and `pimSilentInstallFromXML()`'s own final
      `return pimGetLastError();` (`pimTop.cxx:2073`) resolves to
      `Errors[Errors.GetSize()-1]` — the **last** error ever hit in the
      whole run, not specifically this one. In a multi-XML batch silent
      install, if this mixed-schema false-negative fires on entry `i` but a
      later entry `j > i` in the same run hits any different error
      afterward, that later error **overwrites** this one in the process's
      final reported exit code — the batch's diagnostics silently lose
      which specific product XML failed the schema match, and why, in favor
      of whatever error happened to occur last.

  pimsilentcreateentitlement_session_index_leaks_on_later_failure:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCreateEntitlement(const char* A, const char* B, int&
      entitlement_index)` (`pim_core/pim_core_src/pimSilent.cxx:501-746`):
      ```cpp
      if (!pimGetSessionInfo()->AddEntitlement(B))
          { ...; return false; }                       // :510-517, entitlement_index untouched -- safe
      else
      {
          entitlement_index = pimGetSessionInfo()->GetEntitlementSize() - 1;  // :520 -- SET HERE
          Eb = pimGetSessionInfo()->GetEntitlement(entitlement_index);        // :521
          if (!Ea.Init(A))
              Ea.Init(A, "EXTERNAL_INSTALLER");
          if (!Ea.GetXMLPtr())
              { ...; return false; }                    // :524-530 -- returns false, but
      }                                                  // entitlement_index is LEFT SET from :520
      ```
      The `entitlement_index` out-parameter is set to a valid, non-negative
      index at `:520` — immediately after `AddEntitlement(B)` succeeds —
      but `A`'s own parseability isn't checked until `:522-524`. If
      `Ea.Init(A)` fails under **both** schemas (normal and
      `EXTERNAL_INSTALLER`), the function returns `false` at `:530`
      **without** resetting `entitlement_index`.
    consequence: >
      **CONFIRMED BUG, traced against the only caller**
      (`pim/pim_src/pimTop.cxx:1534-1540`):
      ```cpp
      k = -1;
      pimSilentCreateEntitlement(AskedToInstallThisList[i], str, k);   // return value never checked
      if (k < 0) { abort = true; return pimGetLastError(); }
      ```
      this function's own `bool` return value is **never inspected** by its
      only caller — `k`'s sign is the **sole** failure-detection channel.
      Since `k` is already overwritten to a valid, non-negative index at
      `:520` — before `A`'s parse is verified at `:522-524` — a failure on
      the `:524-530` path leaves `k >= 0` even though the function is
      reporting failure via its return value, so `if (k < 0)` **cannot**
      catch this specific failure mode. `B` remains, permanently, in the
      session's live `EntitlementArray` at that index (`AddEntitlement(B)`
      already succeeded and is never rolled back), but was never fixed up
      with `A`'s requested PSF/shortcut/package data — the function returns
      before ever reaching
      `pimSilentFixupPSF()`/`pimSilentFixupShortcuts()` (`:736,739`) — so
      the caller proceeds to treat a half-created, unrequested-content
      entitlement as if creation fully succeeded.
    caution: >
      **Reachability, precisely characterized (checked while tracing
      this)**: not confirmed reachable via this codebase's own single call
      site. `pimSilentTestXmlIsUseable()` (`pimTop.cxx:1532`, called
      immediately before, gating entry into this branch, on the
      **identical** `A` input) already requires `pimIsProductXmlMatch()`'s
      internal `Ea.Init(A, NULL) || Ea.Init(A, "EXTERNAL_INSTALLER")`
      (`pimSilent.cxx:112,122`) to succeed for the same file before this
      call is ever reached — so by the time `pimSilentCreateEntitlement()`
      runs, `A`'s parseability under one of the same 2 schemas is already
      established, synchronously, in the same process. This makes the bug a
      confirmed gap in the function's own error-handling design — a real
      defect if this function is ever called from a 2nd site, or if the
      `pimSilentTestXmlIsUseable()` guard is ever changed or removed — not
      a live crash/corruption risk given the current call graph.
      **Verified non-issue, related but distinct mechanism (checked while
      tracing why `GetEntitlementSize() - 1` reliably indexes the
      just-added entry)**: `pimSessionInfo::AddEntitlement(cStringT in)`
      (`pim_core/pim_core_src/pimSessionInfo.cxx:654-705`) has its own
      pre-existing-entry guard, `if (GetEntitlement(in) != NULL) return
      false;` (`:658`) — but `GetEntitlement(cStringT)` (`:760-774`)
      matches on `GetID()`, which is populated from the product's
      `<PRODUCT tag>` attribute (`pimEntitlement.cxx:874`), while `in` here
      is a filesystem path — the 2 values are never expected to be equal,
      so this guard is confirmed to never actually fire in practice. This
      means `AddEntitlement()` returning `true` always corresponds to a
      **brand-new** array entry actually just appended
      (`EntitlementArray += ptr`, `:683`), never a reused/pre-existing one
      — confirming the session-index lookup's own core arithmetic
      (`GetEntitlementSize() - 1` pointing at the entry `AddEntitlement()`
      just added) is otherwise sound; the confirmed bug above is strictly
      about when that valid index is reported back despite overall
      failure, not about the index ever being wrong while the function
      succeeds. A fix would either check this function's `bool` return
      value at its call site in addition to `entitlement_index`'s sign, or
      have the function itself reset `entitlement_index` (and roll back
      the session's `AddEntitlement(B)`, e.g. via `DropEntitlement(B)`) on
      every failure path after `:520`, not just before it.
      **FIX VERIFIED (SUFFICIENT, either one alone), found in a further,
      dedicated pass verifying these 2 proposed fixes**: confirmed there
      is exactly **1** failure path to fix (`:524-531`), not several — no
      other early return exists between `:520` and the final `return
      true;` at `:743`. Fix (a) (caller also checks the `bool` return)
      needs no change to `pimSilent.cxx`; fix (b) (reset
      `entitlement_index` internally) needs no change to `pimTop.cxx`.
      **NEW downstream consequence, traced one step further**: an
      undetected failure reaches `pimTop.cxx:1777`'s `SessionInfo.Save()`
      (once the whole `AskedToInstallThisList` loop completes without any
      *other* entry aborting), which calls `xmlPtr->DoSave()`
      (`pimSessionInfo.cxx:2220-2226`) and **persists** the corrupted
      session document — including the orphaned `<ENTITLEMENT>` node
      `AddEntitlement()` appended for the half-created `B` — to
      `sessioninfo.xml` on disk. Traced `pimXmlFile::PreWrite()`/
      `PostWrite()`/`~pimXmlFile()` to confirm none of them auto-persist
      pending changes, so `Save()` is the only path that could ever write
      this corruption to disk; either fix prevents it entirely, since both
      make the caller's existing `abort=true; return pimGetLastError();`
      fire before line 1777 is ever reached. **CONFIRMED BUG in the
      alternative wording's own literal phrasing**: "`DropEntitlement(B)`"
      is confirmed **non-functional** — `DropEntitlement(cStringT)`
      matches by `GetID()` (a product tag), and `B` is the same filesystem
      path already shown above to never match `GetID()` — the identical
      mismatch. A working rollback needs `DropEntitlement(entitlement_index)`
      (the `int` overload, `pimSessionInfo.cxx:803-814`, matching by array
      position) instead. **Verified non-issue, given the consequence traced
      above**: a full rollback is confirmed **not actually necessary** for
      correctness today, since either detection fix alone already makes
      the function return before `Save()` is ever reached.

  pimsilentcanmatchneeds_package_check_crashes_on_null_attribute:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCanMatchNeeds()`'s package check
      (`pim_core/pim_core_src/pimSilent.cxx:307-308`):
      ```cpp
      A_pkg.GetInstallPackageNames(A_wants);
      B_pkg.GetAllPackageNames(B_avail);
      ```
      Traced both into `pimPackageMgr`
      (`pim_core/pim_core_src/pimPackageMgr.cxx:611-666,550-575`):
      ```cpp
      // GetInstallPackageNames(), :611-666
      DOMNode *attribMatch = map->getNamedItem(pimname);
      DOMNode *attribInstall = map->getNamedItem(piminstall);
      DOMNode *attribRequired = map->getNamedItem(pimrequired);
      if (pimGetBasePackMode())
      {
          if (XMLString::compareString(attribRequired->getNodeValue(), ...   // no null-check
      }
      else if (pimGetCreoNGCRIMode())
      {
          if (XMLString::compareString(attribRequired->getNodeValue(), ...   // no null-check
          else
          {
              DOMNode* attribParent = map->getNamedItem(pimparent);
              if (XMLString::compareString(attribParent->getNodeValue(), ... // no null-check
          }
      }
      else if (XMLString::compareString(attribInstall->getNodeValue(), ...   // no null-check,
               || pimGetAllPacksMode())                                     // evaluated regardless of AllPacksMode
      {
          out += StrX(attribMatch->getNodeValue())...;                      // no null-check
      }
      ```
      Neither `GetInstallPackageNames()` nor `GetAllPackageNames()`
      null-checks `DOMNamedNodeMap::getNamedItem()`'s result before calling
      `->getNodeValue()` on it. `GetAllPackageNames()` does this for
      `name` only; `GetInstallPackageNames()` does it for `name`, and —
      depending on which of the 3 global mode flags is active — `install`,
      `required`, or `parent` as well.
    consequence: >
      **CONFIRMED BUG**: a `<PACKAGE>` node in either `A` (a user-supplied
      silent-install request XML) or `B` (the matched product definition on
      the install media) that is missing the attribute the currently
      active CLI mode depends on causes a **null pointer dereference
      crash** inside `pimSilentCanMatchNeeds()`'s package check — not a
      mis-selection, not a graceful `false` return, an unhandled crash of
      the entire silent-install process. **CONFIRMED DISCREPANCY, by direct
      contrast within the same class**: `pimPackageMgr::GetPackageInfoByName()`
      (`:113-170`), a sibling method in this exact file reading the exact
      same 4 attributes (`name`/`install`/`required`/`parent`) off the
      exact same `<PACKAGE>` node type, guards every one of them
      (`if (attribRequired) {...}`, `if (attribInstall) {...}`,
      `if (attribParent) {...}`, `if (attribLabel) {...}`) before
      dereferencing — direct, confirmed evidence that this class's own
      author anticipated these attributes can legitimately be absent on a
      real `<PACKAGE>` node, making the unguarded access in
      `GetInstallPackageNames()`/`GetAllPackageNames()` an inconsistency,
      not a deliberate "always present" assumption.
    caution: >
      **Reachability, precisely characterized (which attribute crashes
      depends on the active CLI mode, traced node-by-node through the
      `if`/`else if` chain)**: `install` is dereferenced unconditionally in
      **both default mode and `-allpacks` mode** — it is the *left*
      operand of `||`, so C++'s left-to-right short-circuit evaluation
      means it is always evaluated *before* `pimGetAllPacksMode()` is ever
      consulted, defeating the natural assumption that "install everything"
      mode would tolerate a missing `install` attribute. `required` is
      dereferenced unconditionally whenever `-basepack` or `-releaselink`
      is active, for **every** `<PACKAGE>` node, not just ones ultimately
      selected. `parent` is dereferenced additionally under `-releaselink`
      specifically, whenever that same node's `required` isn't `"Y"`.
      `name` (`attribMatch`) is dereferenced only for a node that the
      active mode's condition has already decided to select. Since no
      `<PACKAGE>`-node authoring or schema-validation code exists anywhere
      in this archive (`ai-context/xml_schema.yaml` confirms no XSD is
      present and closest real validation is root-element name matching
      with "silent tolerance of missing elements/attributes elsewhere"),
      this is **not confirmed reachable** against a real product/media XML
      pair — none exists in this archive — but the crash mechanism itself,
      and the internal inconsistency against this same class's own
      defensively-coded sibling, are fully confirmed from source.
      **Confirmed narrower than the platform/language checks' analogous
      risk**: `pimPlatformMgr::GetInstallPlatformNames()`/`GetAllPlatformNames()`
      and `pimLanguageMgr`'s equivalents share the identical unguarded
      `name`/`install` pattern (2 vulnerable attributes each), but lack
      this function's extra `-basepack`/`-releaselink` branching — so the
      package check specifically has the **widest** exposure of the 3
      sibling checks (4 distinct vulnerable attributes vs. 2). This is
      also the *first* exposure point in the pipeline for a given `A`/`B`
      pair: `pimSilentCreateEntitlement()`'s own package-selection loop
      (`:576-577`) calls the identical `GetInstallPackageNames()`/
      `GetAllPackageNames()` on the same, unchanged files afterward, so if
      a crash were going to happen it already happened here, inside
      `pimSilentCanMatchNeeds()`, before `pimSilentCreateEntitlement()` is
      ever reached. A fix would add `if (attrib)` null-checks before every
      `->getNodeValue()` call in all 4 affected functions
      (`GetInstallPackageNames()`/`GetAllPackageNames()` and their
      platform/language counterparts), matching the pattern
      `GetPackageInfoByName()` already uses.

  pimsilentcreateentitlement_quality_agent_disable_silently_overridden:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCreateEntitlement()`'s quality-agent flag copy
      (`pim_core/pim_core_src/pimSilent.cxx:593-599`):
      ```cpp
      bool tf;
      if (Ea.IsQualityAgentEnabled(tf))
      {
          if (tf)
              Eb->SetQualityAgent(true);    // always succeeds if Eb's <QUALITYAGENT> node exists
          else
              Eb->SetQualityAgent(false);   // return value discarded -- can silently fail
      }
      ```
      Traced into `pimEntitlement::SetQualityAgent()`
      (`pim_core/pim_core_src/pimEntitlement.cxx:3225-3248`):
      ```cpp
      bool pimEntitlement::SetQualityAgent(bool in)
      {
          ...
          if (node)
          {
              ret = true;
              if (in)
                  ...set enable="Y"...
              else if (xmlPtr->FindNodelistAttribMatch(pimQUALITYAGENT, pimrequired, "Y") == NULL) // not required
                  ...set enable="N"...
              else
                  ret = false;   // asked to make FALSE; but it is required -- SILENTLY REFUSED
          }
          return (ret);
      }
      ```
      **Enabling** (`in==true`) always succeeds whenever `Eb`'s
      `<QUALITYAGENT>` node exists at all — no restriction. **Disabling**
      (`in==false`) is silently **refused** — the function's own `bool`
      return stays `false`, `enable` is left unchanged — whenever `Eb`'s
      own node is marked `required="Y"`, a business rule about `B`'s own
      media definition, entirely unrelated to what `A` requested.
    consequence: >
      **CONFIRMED BUG**: `pimSilentCreateEntitlement()` discards
      `SetQualityAgent()`'s return value at both call sites (`:596,598`),
      so a user's explicit "disable quality agent" request in `A` can be
      silently overridden by `B`'s own required flag, with **zero
      diagnostic anywhere** — no log, no property, no error. **CONFIRMED,
      by direct contrast with this codebase's own GUI path**:
      `pim_ui/pim_ui_src/pimCustomDlg.cxx:1630-1655` (building the
      "Customize" dialog's QualityAgent checkbox) calls
      `IsQualityAgentRequired()` *first* and, when required, disables
      ("greys out") the "QualityAgentOptIn" checkbox control entirely
      (`ui_do_operation(..., "QualityAgentOptIn", UI_check_sensitive_Attr, false, ...)`,
      `:1650-1654`) — structurally preventing a live user from ever
      attempting the disable `pimSilentCreateEntitlement()` blindly
      attempts. `uiCustomTree::OnUpdate()` (`:1727-1730`) only ever calls
      `CurrentApp->SetQualityAgent(State)` when the checkbox was actually
      interactive, i.e. never on a required entitlement. No equivalent
      precondition check exists in the silent-install path.
    caution: >
      **Reachability, precisely characterized**: unlike the package check
      (protected by `pimSilentCanMatchNeeds()`'s own earlier validation),
      nothing in this pipeline pre-validates QualityAgent state at all —
      `pimSilentCanMatchNeeds()` (`:227-346`) never inspects
      `<QUALITYAGENT>` in either `A` or `B`. A plausible, real-world
      trigger: `A` is an older saved/exported install-request XML with
      quality agent explicitly disabled, applied against `B`, a newer
      product release whose media definition has since made quality agent
      `required="Y"` (a policy change) — the user's prior, explicit
      opt-out is silently discarded on reapplication, with no upstream
      gate to catch it. **CONFIRMED DOWNSTREAM CONSEQUENCE, traced for the
      first time**: `Eb`'s final `enable` state is read at real
      install-execution time by `pimEntitlement::OnInstall()`
      (`:6499-6509`) and `OnReconfigure()` (`:7051-7060`) to write
      (`pimAppendValue(PtcKey, "QualityAgentOptIn", "1")`) or remove
      (`pimRemoveName(PtcKey, "QualityAgentOptIn")`) a real Windows
      registry value. The GUI's own "PHM" (Product Health Monitoring)
      message key and "legal text" control naming
      (`pimUICustomDlgEnablePHM`/`CustomizeScreenQualityAgentLegalText`)
      confirm this is a genuine, user-facing telemetry/usage-reporting
      opt-in setting with consent implications — not merely a latent
      XML-consistency concern. **Verified non-issue**: the enable
      direction carries no equivalent restriction — a request to *turn on*
      quality agent, or a `B` with no `<QUALITYAGENT>` node at all
      (nothing to set, `SetQualityAgent()` harmlessly returns `false`), is
      never a live corruption risk; only a *disable* request against a
      *required* `B` silently fails. A fix would check
      `SetQualityAgent()`'s return value at both call sites and log or
      record the override, or check `Eb->IsQualityAgentRequired()` before
      attempting a disable, mirroring the GUI's own proactive precondition
      check.

  pimsilentcreateentitlement_package_disable_silently_overridden:
    doc: docs/classes/pimSilent.md
    rule: >
      `pimSilentCreateEntitlement()`'s package-selection loop
      (`pim_core/pim_core_src/pimSilent.cxx:571-586`) — directly
      analogous to `pimsilentcreateentitlement_quality_agent_disable_silently_overridden`
      above, applied to packages instead of quality agent:
      ```cpp
      A_pkg.GetInstallPackageNames(A_wants);
      B_pkg.GetAllPackageNames(B_avail);

      for (int i = 0; i < (int)B_avail.GetSize(); i++)
      {
          if (A_wants.Find(B_avail[i]) != -1)
              B_pkg.SetPackageInstallState(B_avail[i], true);
          else
              B_pkg.SetPackageInstallState(B_avail[i], false);   // return value discarded
      }
      B_pkg.Refresh();
      ```
      Traced into `pimPackageMgr::SetPackageInstallState()`'s disable
      branch (`pim_core/pim_core_src/pimPackageMgr.cxx:304-332`):
      ```cpp
      if (install)
          ...set install="Y"...
      else
      {
          if (attribRequired && attribRequired->getNodeValue() == "Y")
              { xml->PostWrite(); return false; }   // required -- SILENTLY REFUSED
          if (attribInstalled && strcmp("prime_converter", name) &&
              attribInstalled->getNodeValue() == "Y")
              { xml->PostWrite(); return false; }   // already installed -- ALSO REFUSED
          ...set install="N"...
      }
      ```
      **Enabling** (`install=true`) always succeeds when the node exists —
      no restriction. **Disabling** (`install=false`) is silently
      **refused** whenever the package is marked `required="Y"`, **or**
      already marked `installed="Y"` (with a single named exception,
      `"prime_converter"`, carved out of the 2nd check) — 2 independent
      guard conditions, both unrelated to what `A` requested.
    consequence: >
      **CONFIRMED BUG**: `pimSilentCreateEntitlement()` discards
      `SetPackageInstallState()`'s return value at both call sites
      (`:582,584`), so a required or already-installed `B` package
      silently keeps whatever install state it already had, contrary to
      `A`'s explicit non-request, with **zero diagnostic anywhere**.
      **CONFIRMED, by direct contrast with this codebase's own GUI path,
      mirroring the quality-agent precedent exactly**:
      `pim_ui/pim_ui_src/pimCustomDlg.cxx`'s `uiCustomTree::RefreshPkg()`
      (`:1819-1904`) reads the identical `req`/`installed` flags via
      `GetPackageInfoByName()` and, when either is true
      (`if (req || installed)`, `:1900`), proactively **disables the
      checkbox** (`ui_do_operation(..., UI_check_sensitive_Attr, false, ...)`,
      `:1903`) — structurally preventing a live user from ever attempting
      the disable this function blindly attempts. No equivalent
      precondition check exists in the silent-install path.
    caution: >
      **New nuance, found in the same trace**: even on a refused disable,
      the function's own special-case handling for 2 hardcoded package
      names — `"prime_converter"`/`"creo_simulate"`
      (`pimPackageMgr.cxx:276-302`) — runs **before** the required/installed
      check and toggles their respective global mode flags
      (`pimSetPrimeInWSMode()`/`pimSetSimulateInMode()`) to the
      *attempted* (refused) value regardless — a confirmed state
      divergence between the persisted XML attribute (unchanged) and
      these 2 global flags (updated), for those 2 packages only.
      **Reachability, precisely characterized**: unlike quality agent
      (where nothing pre-validates it at all), package selection *is*
      validated earlier by `pimSilentCanMatchNeeds()` — but that check
      only confirms every package `A` *wants* exists in `B`; it never
      inspects whether a package `A` *doesn't* want is
      required/installed in `B`, so this bug's trigger condition is
      entirely outside that check's scope. A plausible, real-world
      trigger: `B`'s media has since made a package `required="Y"` (or
      the machine already has it `installed="Y"` from a prior run) that
      `A`'s older request XML doesn't select — the user's implicit "I
      don't want this" is silently discarded. **Confirmed downstream
      consequence**: whatever this loop settles as each package's final
      `install` attribute feeds directly into
      `pimPackageMgr::Refresh()`/`RefreshAFeatureNode()`
      (`pimPackageMgr.cxx:883-980`, already documented elsewhere in this
      set), which governs real `<CDSECTION>`/`<MSI>` feature
      install-eligibility — so a silently-retained required/installed
      package continues to have its real features installed, contrary to
      `A`'s explicit non-request, exactly mirroring the quality-agent
      bug's own real-world consequence. **Verified non-issue, confirmed
      wasteful but not incorrect**: this function's own `B_pkg.Refresh()`
      call (`:586`) computes `<CDSECTION>`/`<MSI>`/`<SFX>` install
      eligibility using platform/language selections mirrored from `A`'s
      static XML markings moments earlier in this same function — but
      `pimSilentInstallFromXML()`'s post-creation code
      (`pim/pim_src/pimTop.cxx`), which runs unconditionally right after
      this function returns, overwrites platform/language via
      auto-detection/CLI flags and then calls its **own**, separate
      `pimPackageMgr::Refresh()` (a freshly-constructed `MyPkg` on the
      same document) — confirmed to supersede this function's own
      `Refresh()` output entirely before anything ever reads it. 100%
      wasted computation, but harmless. **Cross-referenced finding**:
      `GetAllPackageNames()` (`:577`) shares `GetInstallPackageNames()`'s
      already-confirmed unguarded null-attribute-dereference crash risk
      (see `pimsilentcanmatchneeds_package_check_crashes_on_null_attribute`).
      A fix would check `SetPackageInstallState()`'s return value at
      `:584` and log or record the override, or check each package's
      required/installed state before attempting a disable, mirroring the
      GUI's own proactive precondition check.
  pimsessioninfo_tryauthorize_infinite_loop_on_transport_failure:
    doc: docs/classes/pimSessionInfo.md
    rule: >
      `pimSessionInfo::TryAuthorize()` (`pim_core/pim_core_src/pimSessionInfo.cxx:1911-1984`)
      is a `do`/`while` credential-retry loop:
      ```cpp
      do {
          if (!GetSecurity(url, User, Passwd) || User.IsEmpty() || Passwd.IsEmpty()) {
              if (out && pimAuthorizeFailedDirectCall(out)) {
                  pimAuthorizeFailedMsgDirectCall(out, str);   // return value discarded
                  if (!pimNonBrowserAuthenticationCB(this, url, str))
                      { do_continue = false; did_cancel = true; }
                  else
                      GetSecurity(url, User, Passwd);          // return value discarded
              }
              else { /* same shape, NULL retry msg */ }
          }
          if (do_continue) {
              if (pimAuthorizeToPTC(pimGetLocaleShort(false), User, Passwd, ret_http, &out)) {
                  if (!pimAuthorizeFailedDirectCall(out))
                      { do_continue = false; delete out; out = NULL; }   // success
                  else
                      DelSecurity(url);   // server REJECTED -- out kept
                  // NO else for pimAuthorizeToPTC() returning FALSE at all
              }
          }
          if (!do_continue) { delete out; /* ... */ }
      } while (do_continue);
      ```
      There is no branch at all for `pimAuthorizeToPTC()` returning `false`
      (a transport/network failure, distinct from the server rejecting
      credentials) — `do_continue` stays `true` from the top of the loop,
      so control simply falls through to the next iteration and re-prompts
      for credentials indefinitely.
    consequence: >
      **CONFIRMED BUG, HIGH SEVERITY**: on a transport/network failure,
      this loop never terminates and never surfaces an error — it keeps
      re-invoking `pimNonBrowserAuthenticationCB()`/`GetSecurity()` forever,
      even though re-entering correct credentials cannot help, since the
      failure is not a credentials problem. **Confirmed by direct
      contrast**: the sibling caller `pimGetAvailable::GetSecurity(bool retry)`
      (`pim_core/pim_core_src/pimGetAvailable.cxx:50-94`) calls the
      identical `pimAuthorizeToPTC()` and returns `-3` to its own caller
      when it returns `false` — the correct, abort-on-transport-failure
      handling this function's own loop lacks entirely. **Confirmed matching
      memory leak**: `pimAuthorizeToPTC()` (`pim_core/pim_core_src/pimPTCDotCom.cxx:540-679`)
      unconditionally does `(*out) = XNew pimXmlFile();` at `:651` with no
      delete of the prior `*out` — so every loop iteration where the server
      rejects the credentials (the `DelSecurity(url)` branch, `out` kept)
      leaks one `pimXmlFile`.
    caution: >
      **Confirmed discarded-return-value / stale-reused-variable pattern**
      (the same template already found repeatedly elsewhere in this
      codebase, e.g. `pimsilentcreateentitlement_package_disable_silently_overridden`
      above): `pimAuthorizeFailedMsgDirectCall(out, str)`'s return value is
      discarded and `str` is read immediately afterward regardless of
      whether the call actually populated it. **Confirmed credential
      aliasing**: `SetSecurity()`/`GetSecurity()`/`DelSecurity()`
      (`pimSessionInfo.cxx:544-617`) each contain a `// HACK - pimMediaProductionUrl
      to use pimProductionUrl` comment followed by `if (ptc2 != url) ptc1 = url;`,
      mapping the media URL and the PTC.com production URL to the SAME
      `SecurityArray` slot — so this function's credential lookups/deletes
      alias (not merely mirror) `pimGetAvailable::GetSecurity()`'s. **Verified
      non-issues found in the same trace**: the function-local
      `static pimXmlFile* out` looks suspicious but is not independently
      confirmed to carry stale state across separate `TryAuthorize()` calls
      in a way that matters, given the loop's own control flow; `SetSecurity()`
      taking only a read lock while mutating (`:560,567`) is a locking-pattern
      inconsistency, flagged but not independently confirmed exploitable. A
      structurally identical, disabled duplicate of this exact loop exists
      behind `#if 0` at `pimSessionInfo.cxx:2005` onward, with its own
      compile-breaking double-declaration of `str`/`str2` — a further
      instance of this project's recurring dead `#if 0` pattern. A fix
      would add an explicit `else { do_continue = false; /* surface
      transport failure */ }` for `pimAuthorizeToPTC()` returning `false`,
      matching `pimGetAvailable::GetSecurity()`'s own `-3` abort, and free
      the prior `*out` before `pimAuthorizeToPTC()` reassigns it.
  piminstallmgrdlg_eula_decline_order_bug:
    doc: docs/classes/pimInstallMgrDlg.md
    rule: >
      `pimInstallMgrDlg::OnPushButtonActivate(uiPushButton&)`
      (`pim_ui/pim_ui_src/pimInstallMgrActions.cxx:643-1193`, 551 lines) has
      2 independent dispatch chains plus a common `Refresh()` tail; the
      2nd chain (the `&pushed==&NextStepBtn` branch, `:782-1041`) is a
      per-screen if/else-if over `CurrentLayout`. The EULA screen's arm
      calls `EulaNextPreAction()` (kicks off license acquisition) BEFORE
      checking whether the user declined the license, while the Beta EULA
      arm in the SAME function checks decline FIRST, then only calls its
      own pre-action if not declined.
    consequence: >
      **CONFIRMED BUG, HIGH SEVERITY**: on the standard EULA screen,
      license acquisition is already underway by the time the decline
      check runs, the reverse of the Beta EULA screen's correct order in
      the identical function — a direct, in-file asymmetry between 2
      screens that should behave identically with respect to declining a
      license agreement.
    caution: >
      **Confirmed by control-flow trace, in the same pass**:
      `OnFinishFromEula()`/`OnFinishFromBetaEula()`
      (`pim_ui/pim_ui_src/pimInstallMgrDlg.cxx:813-911`) both end with
      `uiDialog::Exit(0); uiDialog::Destroy(); return UI_SUCCESS;`, but
      their call sites in `OnPushButtonActivate()` (`:899,957`) have no
      matching `return`, so execution falls through to the common tail's
      `Refresh()` call on an already-destroyed dialog; severity is hedged
      since it depends on `uiDialog`'s own post-`Destroy()` semantics,
      outside this archive. **Confirmed**: answering "No" to the
      exit-confirmation prompt leaves `NextStepBtn` disabled even though
      the comment beside that branch reads "we are exiting" — the label is
      on the non-exiting branch. **Confirmed re-entrancy**: `pimTextDlg`'s
      "proceed anyway" response (`pim_ui/pim_ui_src/pimTextDlg.cxx:82-98`)
      re-enters this same method via
      `GetMainUIDialog()->OnPushButtonActivate(NextStepBtn)` after setting
      `skip_ports_modification="Y"`, which is never reset. Also confirmed,
      lower severity: chain 2's missing final `else`; a `last_license_btn`
      set-order asymmetry; asymmetric undo of `mCmdEdt`; a `currentProduct`
      null-deref risk; `MultipleHostIDButton`'s array-size mismatch; the
      busy cursor never being cleared on some paths; dual
      reconfigure-mode-read sources; and `ResetPort`/`EportReset` covering
      only 2 of the 3 ports. A fix would reorder the EULA arm to check
      decline before calling `EulaNextPreAction()`, matching the Beta EULA
      arm; add a `return` after both `OnFinishFrom*()` call sites; and
      reset `skip_ports_modification` after it is consumed.
  pimtranslatemgr_translatefrom_mismatched_guard_wrong_object_path:
    doc: docs/classes/pimTranslateMgr.md
    rule: >
      `pimTranslateMgr::TranslateFrom(pimXmlFile *ptr)`
      (`pim_core/pim_core_src/pimTranslateMgr.cxx:22-30`):
      ```cpp
      bool pimTranslateMgr::TranslateFrom(pimXmlFile *ptr)
      {
          bool ret = false;
          if (ptr && xmlProduct)
          {
              if (ptr->getFilePath())
              {
                  filename = btkFSEntry(xmlProduct->getFilePath()).GetTail();
              }
              ...
      ```
      The guard checks `ptr->getFilePath()` — the **translation** document's
      own file path — but the value assigned to `filename` is read from
      `xmlProduct->getFilePath()` — a **different object**, the **product**
      document this instance was constructed with. The code checks one
      object's path presence and unconditionally dereferences the other,
      unguarded, inside the guarded block.
    consequence: >
      **CONFIRMED BUG**: when `xmlProduct`'s own file path is unset (a
      default-constructed, never-`SetXml()`'d `btkFSEntry`), `filename` is
      computed from that unset path anyway (since only `ptr`'s path was
      checked), typically yielding an empty string. `filename` then feeds
      the `file`-scoped `<TRANSLATION>` entry filter
      (`pimTranslateMgr.cxx:44-46`): `if (AttribFile) if (XMLString::compareString(...) != 0) continue;`
      — every entry that names a specific product file no longer matches
      an empty `filename`, so it is silently skipped, while entries with no
      `file` attribute at all (applying to every product) are unaffected.
      **CONFIRMED REACHABLE** via 2 of
      `pimEntitlementTree::OnOptionMenuSelect()`'s (`pim_ui/pim_ui_src/pimEntitlementTree.cxx`)
      3 near-identical call sequences — the "sibling shares this parent"
      arm (`:1940-1956`) and the "this is the parent" arm (`:1982-2006`):
      `eptr_new_xml` there comes straight from
      `pimGetMediaDetails::GetProductXml()`
      (`pim_core/pim_core_src/pimGetMediaDetails.cxx:143-238`, confirmed to
      build its returned `pimXmlFile` purely via `DoRead(*memblock)` against
      a downloaded in-memory byte buffer — `SetXml()` is never called on it
      internally, so its own file path starts unset). The following
      `aPtr->Init(eptr_new_xml, new_xml, mediaid)`
      (`pimEntitlement::Init(pimXmlFile*, ...)`,
      `pim_core/pim_core_src/pimEntitlement.cxx:1038-1085`) only aliases
      `aPtr`'s own `xmlPtr` to `eptr_new_xml` (`xmlPtr = application_definition`,
      a plain pointer assignment) on its **normal** path — but when
      `DownloadXmlBackups.Lookup(MediaID, backup)` finds an existing backup
      for this `MediaID` (`:1050-1066`, an early return), `xmlPtr` is set to
      `backup->GetXml()` instead, a **different** object, leaving
      `eptr_new_xml` itself un-aliased and with no file path ever set, 2
      lines before it is passed directly into `pimTranslateMgr`'s
      constructor.
    caution: >
      **Precisely characterized as NOT reachable** via the archive's other 4
      constructor call sites: `pim/pim_src/pimTop.cxx:477`,
      `pim_core/pim_core_src/pimGetAvailable.cxx:582`, and
      `OnOptionMenuSelect()`'s own 1st arm (`pimEntitlementTree.cxx:1885`,
      the "this application itself changed" case) all set `xmlProduct`'s
      file path (via `SetXml()` or loading from a real file) immediately
      before constructing `pimTranslateMgr` — a within-function asymmetry:
      3 near-identical call sequences in the SAME method, only 1 of which
      is correctly wired. **Confirmed real-world trigger**: a MediaID this
      session has already downloaded/cached once before (e.g. a sibling or
      parent entitlement's media ID being bumped a 2nd time, or one sharing
      a MediaID already seen via another product). **Unrelated, adjacent
      finding from the same trace**: `OnOptionMenuSelect()`'s
      already-documented `eptr_new_xml->SetXml()` unconditional-dereference
      null-crash bug (see `pimGetMediaDetails.md`'s Risk Analysis) actually
      occurs 3 times in this function, not once as previously documented —
      at `:1875-1881` (already known) and 2 further near-identical
      occurrences at `:1940-1946` and `:1982-1988`. A fix would guard
      `filename`'s computation on `xmlProduct->getFilePath()` (the object
      the value is actually read from), not `ptr->getFilePath()`; a
      caller-side fix would have every construction site explicitly call
      `SetXml()` on its own product `pimXmlFile` first, mirroring the 1st
      arm's already-correct pattern rather than relying on aliasing through
      a 2nd object's `Init()`.
  pimentitlement_onreconfigure_erases_cache_file_as_path_side_effect:
    doc: docs/classes/pimEntitlement.md
    rule: >
      `pimEntitlement::OnReconfigure()`'s very first block
      (`pim_core/pim_core_src/pimEntitlement.cxx:6880-6896`) computes the
      path to `RollbackMe` (the original, as-shipped `.p.xml` under
      `[LP]/bin/pim/xml/`) by taking a local copy of `xmlPtr`'s own current
      cache-file path (`pimGetAppData/pim/<name>.xml`, per the code's own
      `// this is the cache` comment) and, purely as a side effect of
      extracting its bare filename (`.GetTail()`), unconditionally deletes
      that cache file from disk first:
      ```cpp
      src = xmlPtr->getFilePath();// this is the cache
      if (src.IsFile())
          src.Erase();
      path /= src.GetTail();
      ```
      `Erase()` is confirmed, by its consistent usage pattern across dozens
      of other call sites in this codebase
      (`pimFrictionlessTrialLicenseGet.cxx`, `pimPsfLoop.cxx`,
      `pimShortcutLoop.cxx`, `pimCustomActions.cxx`, etc.), to delete the
      file at the given path — not merely clear an in-memory string.
      `GetTail()`'s correctness does not depend on the file existing on
      disk, so there is no functional need for this deletion.
    consequence: >
      **CONFIRMED BUG, HIGH SEVERITY**: `xmlPtr`'s own internal file-path
      member (`xmlfile`, set via `SetXml()`, written by
      `DoSave()`→`DoWrite(xmlfile)`) is unaffected by this `Erase()` — `src`
      is a separate local copy — so the deleted cache file is only restored
      once `xmlPtr->DoSave()` next runs. **2 confirmed early-return paths**
      exist between this `Erase()` and the function's next `DoSave()` call,
      both leaving the cache file **permanently deleted with nothing to
      replace it**: (1) `PerformServiceAction(pimServices::StopAction)`
      returning `false` (`:6921-6925`, a service-stop failure — no
      `DoSave()` anywhere before this `return;`), and (2)
      `OnInstallCustomActions("PreReconfigure")` returning `false`
      (`:7023-7024` — likewise no `DoSave()` before this `return;`, and
      reachable via an ordinary custom-action failure with no cancellation
      needed, making it the more easily reachable of the 2).
    caution: >
      **Reachability**: `OnReconfigure()` only runs against an entitlement
      already installed and cached (per `docs/04_installation_flow.md` §4),
      so `src.IsFile()` is confirmed true in the realistic common case —
      this `Erase()` almost always actually executes. **Confirmed by
      direct contrast**: `OnRollback()`'s own mirror-image "relocate the
      cache file" block (`pim_core/pim_core_src/pimEntitlement.cxx:7317-7325`,
      moving the reference back from `.p.xml` to Application Data) computes
      an equivalent new path via `SetXml()` with **no** preceding `Erase()`
      — the 2 sibling relocation blocks are asymmetric, reinforcing that
      this `Erase()` call looks like an erroneous side effect rather than
      an intentional design element. **Related, confirmed design note**:
      this same path-computation idiom is duplicated near-verbatim a 2nd
      time later in the same function (`:7067-7082`, gated by
      `NoLPXmlLog`), where it IS followed by `xmlPtr->SetXml(src)` — that
      2nd `Erase()` is a no-op in practice by the time it runs (the file
      was already removed by the 1st occurrence), but the duplication
      itself is a maintainability smell independent of the bug above. A fix
      would drop the `Erase()` call in the 1st block entirely, or, if
      deleting the old cache location really is intended as part of a
      relocation, defer it until after the new location has been confirmed
      written.

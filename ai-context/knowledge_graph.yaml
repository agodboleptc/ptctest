    - "2026-09 (first pim_ui extension, pimShortcutMgr): full source read of this pim_ui-module helper class (also called directly from pim_core) surfaced a confirmed coverage gap in AreChangesPending() -- it cannot detect a shortcut added or removed entirely between two compared XML snapshots, only one that changed while present in both -- with a real consequence in pimEntitlement.cxx's update/reconfigure decision logic. Also surfaced a confirmed array-indexing bug in a CALLER, pimSilent.cxx's pimSilentFixupShortcuts(), found while tracing this class's usage. Flagged on the pimShortcutMgr node and its calls edges; see docs/classes/pimShortcutMgr.md."
    - "2026-09 (second pim_ui extension, pimInstallMgrDlg): full source read of the main wizard dialog class (header + pimInstallMgrDlg.cxx + pimInstallMgrActions.cxx, 5,575+ lines, the largest class in this documentation effort -- with an explicit Scope note disclosing which large method bodies, notably the ~550-line OnPushButtonActivate(), were not traced to the same depth) surfaced the largest set of confirmed findings in a single class in this effort: a StepForward()/StepBack() wizard-step guard-condition asymmetry; a duplicated UpdateParentEntitlements()/UpdateChildEntitlements() implementation shared verbatim (modulo one stray comment) with the nested uiCustomAppTree class; a permanently no-op RefreshFeatureTab(); an unreachable RefreshHelpTab() branch; a message-ID bug in SetPortError(); a 3-way duplicated exit/cleanup path across OnClose()/OnFinishFromEula()/OnFinishFromBetaEula(); and pimCustomDlg flagged (not confirmed) as a likely-superseded parallel class with a near-identical method-name set. Flagged on the pimInstallMgrDlg and pimCustomDlg nodes and the new calls/parallel_to edges above; see docs/classes/pimInstallMgrDlg.md."
    - "2026-09 (third pim_ui extension, pimCustomDlg): full source read of this class's own header + .cxx (2,276 lines) plus the shared pim_ui_src/pimSAB.cxx (589 lines) CORRECTS the prior pass's likely_superseded speculation -- pimCustomDlg is confirmed LIVE, with 2 confirmed call sites (pimInstallMgrDlg::OnPushButtonActivate()'s CustomizeBtn branch, and the newly-added pimEntitlementTree::OnPushButtonActivate()'s per-row customize-icon handler), and pim_ui_src.cxx directly #includes pimCustomDlg.cxx into the unity build. This pass surfaced its own confirmed bug: SetSABPath()/DisableSAB()/EnableSAB() all guard on main_dlg_sab_handle (a static owned by pimInstallMgrDlg) instead of this class's own help_dlg_sab_handle, currently masked only because pimInstallMgrDlg::InitSAB() has always already run before either confirmed caller reaches Display(). Also surfaced a confirmed UX gap (pimEntitlementTree's per-row customize icon does not pre-select that row's product, since Initialize() has no target-entitlement parameter) and extensive structural duplication with pimInstallMgrDlg's embedded Customize tab-set, including 3 renamed-but-structurally-identical nested table classes. Updated the pimCustomDlg node from likely_superseded to confirmed_bug/verified:direct_read; added the pimEntitlementTree node and its calls/creates_transiently edges; corrected the pimInstallMgrDlg->pimCustomDlg edge from parallel_to(likely_superseded) to creates_transiently + parallel_to(duplicated implementation, confirmed live); added the pimCustomDlg->pimInstallMgrDlg shares_lock_with edge for the pimSAB.cxx statics. See docs/classes/pimCustomDlg.md."
    - "2026-09 (fourth pim_ui extension, pimEntitlementTree): full source read of this class's header + .cxx (2,323 lines total) upgraded the pimEntitlementTree node from a stub (added only as an edge target while documenting pimCustomDlg) to full verified:direct_read/confirmed_bug status. Surfaced 2 confirmed bugs: OnOptionMenuSelect() unconditionally dereferences eptr_new_xml via ->SetXml() immediately after an if(eptr_new_xml) guard covering only the 2 preceding lines (a null-pointer-dereference crash risk when pimGetMediaDetails::GetProductXml() returns NULL); and ReconfigureDisplay_low()'s only_one branch strips one character too many from a computed family-group node id ('_Creo_app' -> '_Cre' instead of '_Creo'), confirmed by contrast with the correctly-computed sibling extraction in UpdateGroupStatus() in the same file. Also discovered a previously-uncatalogued 3rd .cxx file for pimInstallMgrDlg's own method bodies, pim_ui_src/pimEntitlementRefresh.cxx (1,514 lines, at the time not itself traced -- added as an external node/edge; see the later correction_history entry below where it was read in full). Added calls edges to pimSessionInfo, pimEntitlement, pimGetMediaDetails, and pimTranslateMgr; changed the pimInstallMgrDlg->pimEntitlementTree edge from a bare calls to owns (with detail on the bidirectional friend-based coupling). See docs/classes/pimEntitlementTree.md."
    - "2026-09 (eighth pim_ui extension, pim_ui_src/pimEntitlementRefresh.cxx): full source read (all 1,514 lines) of the previously-uncatalogued 3rd .cxx file for pimInstallMgrDlg's own method bodies, resolving the external:pimEntitlementRefresh.cxx placeholder node/edge added in the fourth pim_ui extension. Replaced that external node with a direct pimInstallMgrDlg->pimEntitlementTree calls edge (driving ~35 call sites via the EntitlementRefresh() family) and added a pimInstallMgrDlg->pimGetAvailable calls edge for EntitlementDownloadPreAction(). Surfaced 4 confirmed findings, folded into the pimInstallMgrDlg node's warning field: (1) the School- and Beta-mode trial-license wait loops in EntitlementRefresh() use `while (test == NULL || ++max >= 40)` instead of the correct sibling Trial-mode loop's `&&`/`<=` -- because `||` short-circuits, the retry counter never advances while the license fails to parse, so the loop never terminates, hanging the wizard with no timeout and no error dialog (this pass's highest-severity finding); (2) IsSufficientSpace() has a missing else before an unconditional GetSize(dbl) call that silently discards its own 'same version installed = 0 bytes' and 'parent-only = flat 300MB' special cases, confirmed by contrast with the correctly-guarded sibling logic in EntitlementRefresh_updateSpace() in the same file; (3) the nested uiCheckButtonCell class's entire implementation (constructor/destructor/AddDynamicComponent/DelDynamicComponent/both SetAlignedLabel() overloads) is confirmed dead code -- its only would-be caller lives inside a class-wide #if 0-disabled uiApplicationsList class, and no other construction site exists anywhere in the archive; (4) the PIM_HIDE_CUSTOMIZE_SCREEN env var is checked with directly contradictory effect (hide vs. show/enable) across 4 distinct sites in this file. See docs/classes/pimInstallMgrDlg.md's Risk Analysis."
    - "2026-09 (fifth pim_ui extension, pimFrictionlessTrialDlg): full source read of this class's header + .cxx (410 lines) plus its companion worker pimFrictionlessTrialLicenseGet (843 lines, read in full but not given its own node/class doc) upgraded the pimFrictionlessTrialDlg node from a bare stub to full verified:direct_read/confirmed_bug status. Surfaced the single highest-severity confirmed finding among the pim_ui classes documented so far: Display()'s in-house-mode branch (pimGetInHouseMode()==1 or 2 -- confirmed to be the ONLY real usage, since pimFrictionlessTrialRun(), the sole confirmed construction site, always sets one of exactly these 2 values before calling Display()) calls FrictionlessLicenseGenerate() then blocks on a raw Sleep(60000) instead of calling uiDialog::Activate() -- so the armed LicenseGenerateTimer never fires, so OnTimerExpired() (confirmed by archive-wide grep to be the ONLY call site for pimFrictionlessTrialLicenseGet::HeartBeat() anywhere in this codebase) never runs, so HeartBeat()'s license-save/PSF-update completion logic never executes and the worker object itself leaks. Also confirmed dead: a reentrancy guard in OnTimerExpired() checked but never set true, plus SetURL()/the URL member, GetAuth(), and the private Refresh() method, all with zero confirmed callers. Added the external:pimTop.cxx creates_transiently edge and calls/creates_transiently edges to pimSessionInfo/pimFrictionlessTrialLicenseGet/pimPTCLicenseGet. See docs/classes/pimFrictionlessTrialDlg.md."
    - "2026-09 (sixth pim_ui extension, rpimDlg): full source read of this class's header + .cxx (351 lines total) upgraded the rpimDlg node from a bare stub to full verified:direct_read/comparison_reference status. This pass's primary value is comparative rather than a new bug: rpimDlg::Display() correctly calls uiDialog::Activate() unconditionally, with no mode-dependent branch and no Sleep() call, confirming by direct contrast that pimFrictionlessTrialDlg::Display()'s Sleep(60000) bug (see that class's own node/correction_history entry) is a genuine, avoidable defect, not an inherent limitation of their shared dialog design -- the 2 classes are structurally near-identical and rpimDlg is 3 years older (2015 vs. 2018), strongly suggesting pimFrictionlessTrialDlg was cloned from it. rpimDlg shares 2 of pimFrictionlessTrialDlg's smaller confirmed-dead-code findings (SetURL()/the URL member/GetAuth() with zero callers; the rDlg static self-pointer with no accessor, same idiom as frictionlessDlg; the identical dead static in_timer reentrancy guard shape in OnTimerExpired()) but NOT its Refresh() finding -- rpimDlg::Refresh() is confirmed actively used (called from OnInputPanelInput() to gate RenewLicenseButton's sensitivity), unlike the fully-dead pimFrictionlessTrialDlg::Refresh(). Also added a new pimAuthDlg node, identified as the likely original template both rpimDlg and pimFrictionlessTrialDlg partially copied: pimAuthDlg alone fully wires the shared RetryMsg member (declared but never used in either sibling) through to a visible AuthRetryLabel via a real SetRetryMsg() method. Added the external:pimTop.cxx creates_transiently edge, calls/creates_transiently edges to pimSessionInfo/pimPTCRenewLicenseGet, and parallel_to edges rpimDlg->pimAuthDlg and pimFrictionlessTrialDlg->rpimDlg. See docs/classes/rpimDlg.md."
    - "2026-09 (seventh pim_ui extension, pimAuthDlg): full source read of this class's header + .cxx (308 lines total) upgraded the pimAuthDlg node from an identified-but-unread stub to full verified:direct_read/confirmed_bug status, completing the 3-class dialog family investigation. Confirmed pimAuthDlg is the oldest of the 3 (2011) and is called directly from pim_core (pimSessionInfo.cxx, pimGetAvailable.cxx), not just pim_ui. Surfaced a confirmed structural gap: Initialize() has no idempotency guard, yet this class's AuthDialog singleton is confirmed to be genuinely REUSED -- re-Initialize()d across multiple authentication challenges within one process, via a confirmed do/while retry loop in pimSessionInfo::TryAuthorize() plus 2 further confirmed call paths (pimGetAvailable::GetSecurity(), pimPTCLicenseGet.cxx) -- exactly the one class in this family that needed the guard rpimDlg/pimFrictionlessTrialDlg both have. Also refined (not contradicted) the prior pass's framing: SetURL() genuinely IS called on pimAuthDlg (twice, unlike its 2 dead copies), but the URL member it sets is STILL never read anywhere, even in this original template -- so the 'dead URL member' pattern traces back to 2011, not something introduced by copying; RetryMsg, by contrast, is the one member fully wired end-to-end. Also confirmed GetAuth()'s bool return value is always false and ignored by both confirmed callers, and a commented-out //AuthDialog->SetBadInputs() reveals a confirmed never-implemented retry-feedback feature (no SetBadInputs() method exists anywhere in this codebase). Added calls edges to pimSessionInfo and the 3 confirmed pim_core/pim_ui callers. See docs/classes/pimAuthDlg.md."
    - "2026-09 (ninth extension, back into pim_core, pimGetAvailable): full source read of this class's header + .cxx (66 + 649 lines) plus its companion pimGetAvailableProduct.h/.cxx (74 + 163 lines), discovered while tracing pimEntitlementRefresh.cxx's EntitlementDownloadPreAction(). Added the pimGetAvailable node, upgrading it from an edge-target-only reference to full verified:direct_read/confirmed_bug status -- and CORRECTING every prior 'all 9 Loop subclasses' claim in this documentation set: pimGetAvailable (`class pimGetAvailable : public pimLoop`) is a 10th confirmed pimLoop subclass. Surfaced 2 confirmed memory leaks in OnExecute() (ImageXml never freed on the success path; ProductDefinitionXml never freed on 2 filtered-out paths), a confirmed wrong declaring comment on auth_status ('-3 abort, 0 success' -- 0 is actually failure, not success), a confirmed zero-caller dead public method (IsAuthorized()), and a cross-module raw-pointer alias in pim_core/pimLocate.cxx (the same architectural pattern already flagged as a confirmed LIVE bug for pimSAB.cxx's statics -- see pimCustomDlg's shares_lock_with edge -- but here confirmed currently safe given the exact call sites that exist today). Converted the external:pimGetAvailable.GetSecurity placeholder edge into a direct pimGetAvailable->pimAuthDlg calls edge, and added a new external:pim_core/pimLocate.cxx aliases edge documenting the raw-pointer coupling. See docs/classes/pimGetAvailable.md."
    - "2026-09 (tenth extension, staying in pim_core, pimGetMediaDetails): full source read of this class's header + .cxx (36 + 240 lines), the shared media-details cache/fetcher pimGetAvailable itself depends on and a singleton called from at least 7 confirmed files across pim_core and pim_ui. Added the pimGetMediaDetails node at full verified:direct_read/confirmed_bug status. CONFIRMED, highest severity: GetDetails()'s cache-hit fast path reads the shared DetailRecords/IDs arrays with NO lock at all, while every mutating path holds Mutex -- called from both the UI thread and a background pimLoop thread (pimGetAvailable::OnExecute()), a genuine cross-thread race. CONFIRMED: GetProductXml()'s single-retry-on-timeout path refreshes the details cache (logging 'Replacing download URLs') but retries with the SAME pre-refresh URL string, confirmed by direct contrast with the correct pimEntitlement::UpdateMediaUrls() pattern (refresh, then actually apply the refreshed data via UpdateUrls()). CONFIRMED, severity unknown (depends on an external, unconfirmed dsXArray::Replace() ownership contract): a 2nd, likely-redundant Replace() call on that same retry path. CONFIRMED, directly relevant to an existing finding: GetProductXml()'s NULL-return conditions (no matching <url> entry; 2 consecutive -418 timeouts) are the exact root cause of pimEntitlementTree::OnOptionMenuSelect()'s already-documented null-dereference bug -- folded into that node's warning field. Also surfaced a confirmed-dead near-duplicate of that exact bug pattern inside uiApplicationsList::OnOptionMenuSelect() (pim_ui_src/pimInstallMgrActions.cxx:1806-1858), wrapped in #if 0 along with the rest of that disabled class's method bodies (:1672-2019) -- strong evidence the bug predates pimEntitlementTree. Converted the external:pimGetMediaDetails placeholder edge from pimEntitlementTree into a direct calls edge, and added pimGetAvailable->pimGetMediaDetails and pimEntitlement->pimGetMediaDetails calls edges. See docs/classes/pimGetMediaDetails.md."
    - "2026-09 (eleventh extension, back into the pim module, pimGetApplicationsList): full source read of pimGetApplicationsList/pimAddApplicationsToList/IsApplicationInInstallList (pim/pim_src/pimGeneralInit.cxx, targeted lines) plus pimCommandLineArgs' -APPLICATIONS/-XML/-XMLALL/-FLEX handling, discovered while tracing pimGetAvailable::OnExecute()'s use of pimGetApplicationsList(). Added the pimGetApplicationsList node -- explicitly typed free_function_group, NOT class, since there is no class here, only a file-scope static StringXArray (applications_list) and 3 free functions -- at full verified:direct_read/confirmed_bug status. CONFIRMED BUG, highest severity found in this pass: InstallPreReqSilent() (pim/pim_src/pimTop.cxx:904-966, called from the silent-install path at :1780) uses the application list's .GetSize() alone -- never its content -- to bound a loop indexing a completely unrelated array (pimGetSessionInfo()->GetEntitlement(i)), so its entire prerequisite-installation loop silently never runs whenever no application-limiting command-line flag was passed, the common case for a silent install. CONFIRMED BUG: applications_list is populated in 2 incompatible formats depending on which of 3 flags is used (-APPLICATIONS: bare tags; -XML/-XMLALL: full filesystem paths, also injected unconditionally on every silent install by AddMandatoryAppsForSilentInstall()), with no record of which populated a given entry -- 2 of 3 confirmed consumers (pimGetAvailable::OnExecute(), an unnamed pimTop.cxx:390 local-image loader) filter via exact match and can never recognize a path-format entry; only IsApplicationInInstallList()'s substring search is format-agnostic, and pimSilentInstallFromXML() correctly treats every entry as a path. Added a pimGetAvailable->pimGetApplicationsList calls edge and an external:pim/pim_src/pimTop.cxx calls edge covering its 3 confirmed call sites. See docs/classes/pimGetApplicationsList.md."
    - "2026-09 (twelfth extension, promoting pimAvailableProduct out of pimGetAvailable's companion mention): pimAvailableProduct/pimGetAvailableProducts (pim_core/includes/pimGetAvailableProduct.h + .cxx, both already fully read while documenting pimGetAvailable) were given their own dedicated pass and node, upgraded from a companion mention folded into the pimGetAvailable node's warning field to full verified:direct_read/confirmed_bug status in their own right. CONFIRMED BUG the earlier lighter treatment missed: AddInstance(const char *V, const char *shipcode, const char *media_id) never references its own shipcode parameter -- it builds and dedups its VerShipcodes entry from V (the bare version string) alone, despite the member name and Sort()'s pimCompareVerShipcode() comparator both implying a combined version+shipcode identifier is intended. A 2nd AddInstance() call for the same version under a different shipcode is silently treated as a duplicate and its media_id is dropped -- since GetVerShipcodes()/GetMedia() feed pimEntitlementTree's version/shipcode dropdown (via pimGetMediaDetails), a shipcode option can silently go missing from that dropdown. Also confirmed, low severity: every pimAvailableProduct* Create() allocates is never freed, a 3rd instance of the leak-per-web-media-search pattern already confirmed in pimGetAvailable::OnExecute() itself. Corrected the annotated pimGetAvailableProduct.h's class-level and AddInstance() comments to reflect this (previously described the intended, not actual, behavior) and regenerated its patch. Added a pimGetAvailable->pimAvailableProduct owns edge. See docs/classes/pimAvailableProduct.md."
    - "2026-09 (thirteenth extension, Cmp_cStrings): a dedicated pass on the btkMap comparator pimAvailableProduct's own entry flagged as 'declared but not defined in either of this class's 2 files.' An exhaustive case-insensitive grep for Cmp_cStrings across every file in pim/, pim_core/, pim_ui/, and pim_util/ returns exactly 8 lines total -- confirming NO implementation exists anywhere in this archive. Added the Cmp_cStrings node -- typed external_function, confidence confirmed_bug for what CAN be confirmed about its declaration/usage, not for a traced implementation (there is none). CONFIRMED: independently forward-declared via a local `extern int Cmp_cStrings(void *, void *);` in 4 separate .cxx files (upimDlg.cxx, pimsilentDlg.cxx, pimEntitlement.cxx, pimGetAvailableProduct.cxx) with no shared header -- a maintenance hazard with no compiler-enforced single source of truth. CONFIRMED: pimsilentDlg.cxx's declaration is dead/unused -- no construction in that file references it. Its likely purpose (a strcmp()-style char* comparator) is explicitly labeled INFERRED, not confirmed, per this project's 'no invented behavior' rule. Added calls edges from pimAvailableProduct and pimEntitlement (both confirmed real callers) and an external:pim_ui/upimDlg.cxx edge for the 3rd. See docs/classes/Cmp_cStrings.md."
    - "2026-09 (fourteenth extension, Print() specifically): a dedicated pass on pimAvailableProduct::Print()/pimGetAvailableProducts::Print() (both already fully read while documenting pimAvailableProduct) confirmed both are dead code -- an exhaustive grep for .Print( across pim/, pim_core/, and pim_ui/ finds exactly 2 matches, both commented out (pimGetAvailable.cxx:474,478, `//AvailableProductsArray.Print(pimDbgLog);`), plus one unrelated Test.Print() call on a different object in pim/pim_src/pimTop.cxx:3042. pimDbgLog itself is referenced nowhere else in this codebase outside those same 2 disabled lines and a 3rd commented `//pimDbgLog << endl;` at pimGetAvailable.cxx:564 -- not confirmed to be a real, live logger object. Folded into the existing pimAvailableProduct node's warning field (risk_level unchanged -- the AddInstance() bug remains the more significant finding). Corrected the annotated pimGetAvailableProduct.h's Print() comments on both classes (previously uncommented) and regenerated its patch. No new nodes or edges required -- this is an enrichment of the existing pimAvailableProduct node. See docs/classes/pimAvailableProduct.md."
    - "2026-09 (fifteenth extension, IsApplicationInInstallList() specifically): a dedicated pass on this one free function (already fully read while documenting pimGetApplicationsList) re-confirmed its call-site list is unchanged -- still exactly the 2 calls, both inside AddMandatoryAppsForSilentInstall(), its only caller -- and added a CONFIRMED STRUCTURAL RISK in the opposite direction from this node's existing warning: its substring search (.Pos(), not exact match), while confirmed the one consumer robust to the bare-tag-vs-full-path format split, can itself false-positive whenever one product's filename is a literal substring of another entry already in applications_list (e.g. a hypothetical 'newcreobase.xml' entry would make a check for 'creobase.xml' return true even though 'creobase.xml' itself was never requested). Checked pairwise against the 3 real confirmed arguments used in this codebase today (creobase.xml, creobase.p.xml, qualityagent.xml) -- none collides, so this is recorded as a confirmed structural risk, not a demonstrated live bug. Folded into the existing pimGetApplicationsList node's warning field; corrected the annotated pimGeneralInit.h's IsApplicationInInstallList() comment and regenerated its patch. No new nodes or edges required -- this is an enrichment of the existing pimGetApplicationsList node. See docs/classes/pimGetApplicationsList.md."
    - "2026-09 (sixteenth extension, AddMandatoryAppsForSilentInstall() specifically, pim/pim_src/pimTop.cxx:1282-1316): a dedicated pass on this function (already fully read while documenting pimGetApplicationsList) corrected the earlier framing of the InstallPreReqSilent() loop-bound bug's 'commonly EMPTY' characterization -- since AddMandatoryAppsForSilentInstall() always runs first in the one confirmed call path and unconditionally attempts to inject creobase.xml (and, if present, qualityagent.xml), the list is typically non-empty; the real, more precisely confirmed consequence is a size MISMATCH, not usually a fully-empty list. Added 2 new CONFIRMED BUGS: (1) qualityagent.xml's injection block, including its own independent qualityagent.xml Exists() check, is nested entirely inside `if (creobaseXml.Exists())`, so on any media shipping qualityagent.xml without creobase.xml, quality agent is silently not auto-installed -- contradicting this function's own name and the 'Mandatory Installation of Quality Agent' intent independently recorded in pimGeneralInit.h's and pimTop.cxx's own 13-Aug-26 changelog entries ($$34/$$148); and (2) -allpacks mode's utility-XML entries are appended only to pimSilentInstallFromXML()'s own LOCAL AskedToInstallThisList (pimTop.cxx:1430-1474), never via pimAddApplicationsToList(), so they never reach the shared applications_list InstallPreReqSilent() later independently re-reads (pimTop.cxx:913) -- their prerequisites are silently never checked; confirmed no out-of-range GetEntitlement(i) access results in this specific call path (allpacks entries are appended after the flag/mandatory ones in creation order), but noted pimSessionInfo::GetEntitlement(int) (pim_core_src/pimSessionInfo.cxx:776-782) returns NULL out of range with no NULL check at its call site -- a latent crash risk if a future change ever made the shared list larger than the entitlement count, not a demonstrated live bug today. Confirmed this function has no header declaration anywhere in this archive (no pimTop.h exists) -- no Doxygen patch was created for it, the same situation as Cmp_cStrings. Folded into the existing pimGetApplicationsList node's warning field and the external:pim/pim_src/pimTop.cxx edge's detail. No new nodes or edges required -- this is an enrichment of the existing pimGetApplicationsList node. See docs/classes/pimGetApplicationsList.md."
    - "2026-09 (seventeenth extension, pimSilentTestXmlIsUseable and its 5 sibling free functions, pim_core/includes/pimSilent.h + pim_core/pim_core_src/pimSilent.cxx, both read in full): a new free-function-group node, discovered while tracing pimSilentInstallFromXML()'s per-entry validation loop (see the eleventh/sixteenth extension entries above) -- the same caller pimGetApplicationsList/AddMandatoryAppsForSilentInstall already document from the population side; this file is the validate-and-merge side run immediately after. Added the pimSilentTestXmlIsUseable node at full verified:direct_read/confirmed_bug status. CONFIRMED BUG: pimSilentTestXmlIsUseable() (pimSilent.cxx:29-104) leaks a pimXmlFile object on its XML-syntax-error path -- the delete on the success path (:49) is placed after the error-check block, so the early return false; inside it (:47) skips it. CONFIRMED BUG, more severe: pimSilentCanMatchNeeds() (:227-346) leaks BOTH of its 2 internal pimXmlFile objects (A_tmp/B_tmp) whenever either input file fails to parse -- every internal early-return (:271-273, :298-300, :335-337) and the final success return (:342) correctly delete both first, only the outer failure fallthrough (:345) does not, a clean, well-evidenced contrast. pimSilentFixupShortcuts() in this same file was already partly documented from the caller side in the pimShortcutMgr node's warning (a confirmed caller-side indexing bug) -- this pass adds the callee-side view, no new finding there. Added an external:pim/pim_src/pimTop.cxx->pimSilentTestXmlIsUseable calls edge (covering its 2 confirmed call sites), a pimGetApplicationsList->pimSilentTestXmlIsUseable precedes edge (sibling-under-the-same-caller relationship, not a direct call), a pimSilentTestXmlIsUseable->pimEntitlement calls edge, and a pimSilentTestXmlIsUseable->pimShortcutMgr calls edge. No header/patch gaps -- pimSilent.h exists and was fully annotated (all 7 declarations, small header). See docs/classes/pimSilent.md."
    - "2026-09 (eighteenth extension, pimSilentFixupPSF() specifically, pim_core/pim_core_src/pimSilent.cxx:353-416): a dedicated pass on this one free function (already fully read while documenting pimSilentTestXmlIsUseable) re-confirmed its call-site list is unchanged -- still exactly 1 call, inside pimSilentCreateEntitlement(), its only caller -- and traced its dependency on pimCommandMgr::DeleteCommand()/CanDeleteCommand() (pim_core_src/pimCommandMgr.cxx:405-451,454-515) to confirm 2 new findings. CONFIRMED BUG: CanDeleteCommand() explicitly refuses deletion (an inline comment at :405 reads 'you can not delete the last command of a type') whenever fewer than 2 commands in the whole entitlement XML share a target command's LICTYPE. pimSilentFixupPSF() creates a pDiUmMMY<N> dummy command specifically to satisfy this rule so a name colliding with a different license type in Eb can be removed -- but if none of Ea's final wanted commands happen to also be of that same license type, the dummy itself becomes the LAST command of that type by the time the function's final cleanup loop runs, and DeleteCommand() silently fails the same check on the dummy (neither of this function's 2 relevant DeleteCommand() calls checks the boolean return value) -- a spurious pDiUmMMY<N> PSF command, carrying Ea's description/license-identifiers/features data mislabeled under Eb's old license type, can permanently persist in the merged entitlement. CONFIRMED DISCREPANCY: the same collision-handling block's own inline comment says it removes 'the foobar command' (singular), but the code calls GetAllCommandNamesByType() and deletes EVERY command sharing that license type, not just the one colliding name -- any of Eb's other, non-colliding commands of that type are dropped too unless Ea's wanted set happens to re-add them. Folded into the existing pimSilentTestXmlIsUseable node's warning field and added a new pimSilentTestXmlIsUseable->external:pim_core/pim_core_src/pimCommandMgr.cxx calls e
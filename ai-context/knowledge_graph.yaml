# Unified knowledge graph: nodes + typed edges spanning modules, classes, ownership,
# dependency, call, and state-transition relationships. Synthesizes
# architecture.yaml, modules.yaml, classes.yaml, ownership.yaml, dependencies.yaml,
# flows.yaml, runtime_states.yaml into one graph structure for programmatic traversal.
#
# node.type in: [module, class, external_dependency, executable, entitlement_state]
# edge.type in: [depends_on, owns, wraps, creates_transiently, references_not_owned,
#                inherits, calls, consumed_by, transitions_to, singleton_of]

nodes:
  # Modules
  - {id: pim, type: module}
  - {id: pim_core, type: module}
  - {id: pim_ui, type: module}
  - {id: pim_util, type: module}

  # External executables (not in archive)
  - {id: "pim.exe", type: executable, in_archive: false}
  - {id: "pim_rm.exe", type: executable, in_archive: false}
  - {id: "pim_re.exe", type: executable, in_archive: false, confidence: inferred}
  - {id: "pim_rl.exe", type: executable, in_archive: false, confidence: inferred}

  # Core classes
  - {id: pimLoop, type: class, module: pim_core}
  - {id: pimEntitlement, type: class, module: pim_core, verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED BUG, HIGH SEVERITY: OnReconfigure() (pim_core_src/pimEntitlement.cxx:6866-7222) unconditionally Erase()s the entitlement's own cached XML file (pimGetAppData/pim/<name>.xml) at the very top of the function, purely as a side effect of extracting a filename for an unrelated path (RollbackMe's, the original as-shipped .p.xml) -- 2 confirmed early-return paths (PerformServiceAction(StopAction) failing, :6921-6925; OnInstallCustomActions(\"PreReconfigure\") failing, :7023-7024) leave the deleted cache file permanently un-recreated, since neither calls xmlPtr->DoSave() first. Confirmed by direct contrast: OnRollback()'s own mirror-image cache-relocation block (:7317-7325) has no such Erase() side effect. Also confirmed: OnRollback(bool from_during_install) (:7287-7565) has zero early-return points (a single uninterrupted sequential teardown run) and exactly 2 from_during_install-specific branches (Copier Rollback() vs Uninstall(), and a creobase.xml-only final directory cleanup) -- see docs/classes/pimEntitlement.md"}
  - {id: pimSessionInfo, type: class, module: pim_core, verified: direct_read, confidence: confirmed_bug, warning: "TryAuthorize() (pim_core_src/pimSessionInfo.cxx:1911-1984) is a do/while credential-retry loop with a CONFIRMED HIGH-SEVERITY infinite loop: no handling for pimAuthorizeToPTC() returning false (transport failure), confirmed by contrast with pimGetAvailable::GetSecurity()'s correct -3 abort on the same failure; a matching pimXmlFile leak on pimAuthorizeToPTC()'s reject path; a discarded-return-value/stale-reused-str pattern in pimAuthorizeFailedMsgDirectCall(); and confirmed credential-store aliasing with pimGetAvailable::GetSecurity() via SetSecurity()/GetSecurity()/DelSecurity()'s own `// HACK`-commented shared SecurityArray slot for the media and production URLs -- see docs/classes/pimSessionInfo.md"}
  - {id: pimXmlFile, type: class, module: pim_core}
  - {id: pimTranslateMgr, type: class, module: pim_core, verified: direct_read, confidence: confirmed_bug, warning: "TranslateFrom(pimXmlFile*) (pim_core_src/pimTranslateMgr.cxx:22-30) guards computing its filename member on ptr->getFilePath() (the TRANSLATION document) but assigns the value from xmlProduct->getFilePath() (the PRODUCT document -- a different object) -- CONFIRMED REACHABLE via 2 of pimEntitlementTree::OnOptionMenuSelect()'s 3 near-identical call sequences (:1956,2006), where eptr_new_xml comes straight from pimGetMediaDetails::GetProductXml() (never calls SetXml() internally) and, on a DownloadXmlBackups cache hit, pimEntitlement::Init() aliases xmlPtr to the cached backup instead, leaving eptr_new_xml's own file path unset -- every file-scoped <TRANSLATION> entry is then silently skipped for those 2 arms. Also confirmed: a compile-breaking Eptr/EPtr typo inside pim_core_src/pimEntitlement.cxx:995's #ifdef PIM_TRANSLATE_XML block, permanently dead since that macro is #define'd only in pim/pim_src/pimTop.cxx, a separate unity-build translation unit -- see docs/classes/pimTranslateMgr.md"}

0 of pimScriptLoop::OnInstall()'s unconditional GetAllCommandNames() read, [LM_LICENSE_FILE] would be populated from a license type the user's A never selected at all. CONFIRMED BUG, found in a further dedicated pass specifically on this function's AppendAddCommand() return-value check (pimSilent.cxx:389,403, depends on pimCommandMgr.cxx:270-403,923-929): there are exactly 2 AppendAddCommand() call sites, both discarding the return value. Traced AppendAddCommand()'s own implementation: it is ADD-OR-UPDATE -- an existing name is simply updated (always succeeds), but creating a genuinely NEW node depends on FindPsfTempateNode(LicType) finding a matching <PSF_TEMPLATE> -- if none exists, no node is ever created and the function returns false with ZERO trace anywhere. SITE 1 (:389), the dummy -- confirmed LOWER reachability: lictype2 is read from an EXISTING live B command, plausibly (though not certainly) already templated. SITE 2 (:403), the main re-add loop -- CONFIRMED, more severe and more clearly reachable: when A_wants[i] is a name genuinely new to B, its lictype comes from A's OWN document, entirely independent of B's template set -- if B's media lacks a template for that type (a plausible cross-version/cross-product mismatch), A's entire request for that named command is DROPPED WITHOUT A TRACE, not stuck like a dummy, simply ABSENT from Eb. CONFIRMED by this function's own reasoning: its inline comment introducing this loop shows the author reasoned through name/type collisions but never considered template availability -- a genuine blind spot, not an accepted risk. DOWNSTREAM CONSEQUENCE: the failed command never even appears in the final cleanup loop's re-fetch, so there is nothing to strand -- the user's requested licensed feature is simply never provisioned, with no dummy, no log, and no error anywhere in the pipeline, arguably harder to diagnose than either DeleteCommand() finding since there is no leftover artifact to notice. FIX VERIFIED (PARTIALLY), found in a further dedicated pass specifically verifying pimSilentCreateEntitlement()'s already-proposed <MSI>-node fix (\"match by node identity, e.g. the pimname/pimPRODUCTCODE attribute, instead of collapsing all nodes' values into one pair of shared variables\"): traced pimMSIExec()'s own attribute reads (pimMSILoop.cxx:202-207) off the IDENTICAL <MSI> nodelist this function iterates -- CONFIRMS both `name` and `PRODUCTCODE` genuinely exist on real <MSI> nodes in this codebase. BUT the fix's own \"either\" phrasing is UNDER-SPECIFIED -- the 2 keys have OPPOSITE tradeoffs: PRODUCTCODE (a Windows Installer GUID conventionally expected to change on most new MSI builds) would likely find NO correspondence between A's older request and B's newly matched media in this function's realistic use case, silently degrading the fix to \"no customization ever survives\"; `name` (a stable label) is the practically workable key but isn't schema-enforced unique. A robust fix needs both, PRODUCTCODE tried first and name as fallback -- neither the original finding nor the proposed fix specified this. NEW ASYMMETRY, found while verifying, orthogonal to the name-collapsing bug: the existing write loop's format-attribute handling (pimSilent.cxx:654-661) only overwrites B's attribute if it already exists (no creation fallback), while the <MSIARGUMENT> handling (:663-673) does create a missing child -- any correctly-scoped per-node fix must address this too. FIX VERIFIED (COSMETIC), found in a further dedicated pass specifically verifying pimSilentCreateEntitlement()'s PROPERTY-copy loop's proposed hardening fix (\"initialize the loop's name variable fresh each iteration\"): CONFIRMED still cosmetic today -- traced precisely which guard does the real work: the inner for-loop's own attribName != NULL condition (:712) is the SOLE, always-present safety net for a nameless <PROPERTY> node, regardless of what the outer skip-list `continue` (:710-711) does with a stale name. The fix's real value is closing a LATENT MAINTENANCE TRAP: a plausible future refactor weakening the inner guard (mistakenly assuming the outer continue already handles nameless nodes) would silently reintroduce exactly the kind of stale-value corruption already confirmed live in pimSilentFixupShortcuts()'s Program Menu bug. CONFIRMED BUG, found in the same pass, by tracing this loop's full return-value chain -- a NEW, distinct finding: pimXmlFile::GetProperty()'s own return value is ALSO discarded at both value-copy sites (:719,:725); if A ever has 2+ <PROPERTY> nodes sharing the same name (not schema-prevented in this archive), GetPropertyNode()'s document-order-first-match search could return a DIFFERENT node than the one being iterated, and a missing attribute there would leave `value` stale -- silently written to Eb regardless. The general-attribute branch could avoid this entirely by reading its already-in-hand attrib node directly (attrib->getNodeValue()) instead of re-searching Ea's whole document by name. See docs/classes/pimSilent.md. FIX VERIFIED (SUFFICIENT), found in a further dedicated pass specifically verifying pimSilentFixupShortcuts()'s already-known array-index bug's proposed fix (pimSilent.cxx:447-460, depends on pim_ui/pim_ui_src/pimShortcutMgr.cxx:417-454,295-320,29-101): replacing B_avail[i] with A_wants[i] in the 4 SetShortcut*State() calls is CONFIRMED SUFFICIENT to eliminate the wrong-shortcut risk with no residual gap -- the enclosing if (B_avail.Find(A_wants[i]) != -1) guard already proves A_wants[i] exists in Eb's document, and B_avail is captured once, before either loop begins, from a document this function never mutates structurally, so the snapshot stays valid throughout. NEW LIMITATION, generalized from the Program-Menu-fix pass above (which traced SetShortcutState() only as the primitive behind SetShortcutProgramsMenuState()): all 4 of SetShortcutStartMenuState()/SetShortcutProgramsMenuState()/SetShortcutDesktopState()/SetShortcutQuicklaunchState() delegate identically to this one shared primitive, each passing only a different Match tag; since all 4 corresponding child elements are independently optional per shortcut, SetShortcutState() can legitimately return false for a CORRECTLY IDENTIFIED shortcut whenever that one specific location option was never offered by Eb's template, and none of the 4 array-index call sites check this return value, fix or no fix -- the same silent, by-design ceiling as the Program-Menu fix, now confirmed to span all 4 toggles instead of 1. VERIFIED NON-ISSUE, found while tracing this same call chain: GetShortcutInfoByID()'s own discarded return value and its once-outside-the-loop sm/pm/dt/ql output booleans are NOT reachable as a staleness bug -- A_wants[i] is sourced from the same document's own GetAllShortcutIDs() scan by the same id attribute FindShortcutNode() matches on, so the node is always found, and the function pre-initializes all 4 output booleans to false before scanning children, unlike its GetShortcutProgramMenu() sibling. ADJACENT PRE-EXISTING RISK, found in the same trace: GetAllShortcutIDs() (pim_ui/pim_ui_src/pimShortcutMgr.cxx:312-313) dereferences its id-attribute node's getNodeValue() with no null check -- a latent crash if any SHORTCUT node in either document ever lacks an id attribute, underlying both A_wants and B_avail alike. FIX VERIFIED (SUFFICIENT, EITHER ONE ALONE), found in a further dedicated pass specifically verifying pimSilentCreateEntitlement()'s already-known session-index lookup bug's 2 proposed fixes: (a) the caller also checking this function's bool return value, or (b) this function resetting entitlement_index to -1 on its own failure path -- confirmed there is exactly 1 such path (:524-531), not several. NEW DOWNSTREAM CONSEQUENCE, traced one step further than the original finding: an undetected failure reaches pimTop.cxx:1777's SessionInfo.Save() (traced to xmlPtr->DoSave(), pimSessionInfo.cxx:2220-2226), which PERSISTS the corrupted session document, including the orphaned ENTITLEMENT node AddEntitlement(B) appended for the half-created B, to sessioninfo.xml on disk -- confirmed pimXmlFile::PreWrite()/PostWrite()/~pimXmlFile() never auto-persist, so Save() is the only path that could ever write this corruption to disk. Either fix eliminates it, since both make the caller's abort=true; return pimGetLastError(); fire before line 1777 is ever reached, discarding the corrupted state when the caller's stack-local SessionInfo object is destroyed on return. CONFIRMED BUG in fix (b)'s own alternative literal wording: 'call DropEntitlement(B) to roll back' is NON-FUNCTIONAL as written -- DropEntitlement(cStringT) matches by GetID() (a product tag), and B is a filesystem path, the identical mismatch already confirmed dead code in AddEntitlement()'s own guard; a working rollback needs DropEntitlement(entitlement_index) (the int overload) instead. VERIFIED NON-ISSUE: given the traced consequence, a full rollback is confirmed NOT NECESSARY for correctness today, since either detection fix alone already prevents ever reaching Save(). CONFIRMED NOT PURELY MECHANICAL, found in a further dedicated pass specifically verifying pimSilentFixupPSF()'s already-suggested Ea const-reference hardening: Ea.GetXMLPtr() (:357), this function's only direct call on Ea, is itself not declared const (pimEntitlement.h:320), so `const pimEntitlement& Ea` as literally proposed fails to compile without also const-qualifying GetXMLPtr() -- confirmed a safe prerequisite (trivial body, zero existing const pimEntitlement usage anywhere in this codebase to regress). CONFIRMED SCOPE CEILING: even fully applied, the hardening only blocks a non-const pimEntitlement-level call directly on Ea; read pimCommandMgr.h in full and confirmed NONE of its public methods, including the 3 read-only accessors this function calls on A_cmds, are declared const, so A_cmds itself could still mutate Ea's document with no compiler objection, before or after the fix -- confirmed zero const pimXmlFile usage anywhere in this codebase either. The hardening is confirmed to be a documentation-only signal at this function's own signature, not a real guard against the realistic mistake one layer below. FIX (a) VERIFIED SUFFICIENT ONLY FOR DIAGNOSABILITY, found in a further dedicated pass specifically verifying pimSilentCanMatchNeeds()'s platform/language checks' 2 proposed fixes: checking SetLanguageInstallState()/InitPlatformState()'s return values and logging the failure makes the outcome visible but changes nothing about it -- traced the zero-platform case one level further into pimPackageMgr::RefreshAFeatureNode() (pimPackageMgr.cxx:883-980), confirming it sets install=\"N\" on every <CDSECTION>/<MSI> node carrying a platform attribute whenever no platform is ever selected, a near-total silent install failure logging alone cannot prevent. CORRECTION: InitPlatformState()'s fallback (pimPlatformMgr.cxx:104-125) is a mutually exclusive, conditionally-chosen single fallback (x86e_win64/arm64_win64 detected -> try i486_nt only; else -> try x86e_win64 only), not both names tried in sequence. FIX (b) CONFIRMED ARCHITECTURALLY FEASIBLE for both language and platform, resolving the original 'if feasible' hedge: pimShouldWeInitLanguageID()/pimGetAllPacksMode() and btkGetPlatform() are all global, parameterless accessors already read this same way elsewhere in this file. NEW nuance: a validating copy must replicate the corrected single-fallback branch exactly, or it produces false-negative rejections. NEW maintenance-hazard: implementing fix (b) creates a 2nd, independent copy of the 9-hardcoded-language rule and the platform fallback, duplicating logic that already lives in pimTop.cxx, with nothing keeping the 2 copies in sync. NEW unresolved policy question: extending validation to auto-detected platform would let a machine merely lacking that platform have an otherwise valid install rejected outright rather than proceeding with that piece silently missing, as today -- this codebase states no policy on which behavior is intended. FIX VERIFIED (PARTIALLY), found in a further dedicated pass specifically verifying pimSilentFixupPSF()'s already-documented stuck-dummy-placeholder bug's proposed fix -- either pimSilentFixupPSF() must guarantee no dummy survives, or pimScriptLoop must select the license command by type/role rather than array position 0: OPTION 1 CONFIRMED ALREADY TRUE IN HALF THE CASES, STRUCTURALLY UNACHIEVABLE IN THE OTHER HALF -- when another A-wanted command independently shares the dummy's license type, today's code already cleans it up correctly (that entry's own AppendAddCommand() call restores the type's live count to >=2 before the final cleanup loop); when none does, CanDeleteCommand()'s absolute floor (count > 1, no override anywhere in pimCommandMgr) makes it structurally impossible to remove via any operation ordering, requiring a genuinely new in-place \"retype\" pimCommandMgr capability (reusing AppendAddCommand()'s own template-cloning machinery via FindPsfTempateNode()) rather than a change to pimSilentFixupPSF() itself. OPTION 2 CONFIRMED ARCHITECTURALLY PRECEDENTED, BUT CONCRETELY UNDER-SPECIFIED -- pimScriptLoop::OnInstall() itself already performs exactly this kind of role-based lookup a few lines below the arr[0] lookup (FindNodelistAttribMatch(pimPSF, pimid, \"parametric\"), pimScriptLoop.cxx:135), but no canonical selector value for \"the license-bearing command\" is confirmed to exist anywhere in this archive. FURTHER CONFIRMED: AppendEditCommand() never creates a missing <FEATURE_NAME> child, only updates an existing one, deepening the doc's already-flagged uncertainty over whether the dummy can even reach pimScriptLoop's arr at all. NEW, dummy-independent design smell: arr[0]'s \"just take the first command\" assumption is fragile on its own terms, since this same function already relies on multiple, role-distinct PSF commands coexisting. CONFIRMED BUG, found in a fresh, dedicated pass on pimSilentCreateEntitlement()'s package-selection loop specifically, directly analogous to the already-documented quality-agent bug applied to packages: SetPackageInstallState(name, false) (pimPackageMgr.cxx:304-332) silently refuses -- leaving the package's install attribute unchanged -- whenever that package is required=\"Y\" or already installed=\"Y\" (except \"prime_converter\"), and pimSilentCreateEntitlement() discards the return value at both call sites (pimSilent.cxx:582,584). Confirmed by direct contrast with uiCustomTree::RefreshPkg() (pim_ui/pim_ui_src/pimCustomDlg.cxx:1819-1904), which proactively disables the checkbox for the identical req || installed condition -- structurally preventing a live user from ever attempting the disable this function blindly attempts. NEW NUANCE: even on a refused disable, 2 hardcoded package names (\"prime_converter\"/\"creo_simulate\") still have their global mode flags toggled to the attempted value regardless, diverging from the unchanged XML attribute. VERIFIED NON-ISSUE, confirmed wasteful: this function's own B_pkg.Refresh() call (pimSilent.cxx:586) computes CDSECTION/MSI/SFX install eligibility using platform/language values that pimTop.cxx's post-creation code immediately overwrites and recomputes via its own, separate Refresh() call afterward -- 100% superseded, harmless. CROSS-REFERENCED: GetAllPackageNames() shares GetInstallPackageNames()'s already-confirmed unguarded null-attribute crash risk. See docs/classes/pimSilent.md."}


  - {id: pimEntitlementTree, type: class, module: pim_ui, verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED BUGS: (1) OnPushButtonActivate()'s per-row customize icon resolves the clicked row's pimEntitlement but never passes it to pimCustomDlg -- see docs/classes/pimCustomDlg.md Risk Analysis #2; (2) OnOptionMenuSelect() unconditionally dereferences eptr_new_xml via ->SetXml() right after an if(eptr_new_xml) guard that covers only the 2 preceding lines -- a null-pointer-dereference crash risk, confirmed root cause: pimGetMediaDetails::GetProductXml() returning NULL on no URL match or 2 consecutive timeouts (see docs/classes/pimGetMediaDetails.md), with a confirmed-dead near-duplicate of this exact bug in the #if 0-disabled uiApplicationsList::OnOptionMenuSelect() -- CORRECTED, found while giving pimTranslateMgr its own pass: this exact shape occurs 3 TIMES in this function (:1875-1881, :1940-1946, :1982-1988), not once; (3) ReconfigureDisplay_low()'s only_one branch strips one char too many from a computed family-group node id ('_Creo_app' -> '_Cre' instead of '_Creo'); (4) only the FIRST of those same 3 call sequences correctly sets xmlProduct's file path before constructing pimTranslateMgr -- the other 2 trigger pimTranslateMgr's own confirmed mismatched-guard bug, silently skipping file-scoped translation entries -- see docs/classes/pimEntitlementTree.md and docs/classes/pimTranslateMgr.md"}
  - {id: pimInstallMgrDlg, type: class, module: pim_ui, pattern: "global pointer set once in constructor, never cleared (not a true GetInstance() singleton)", verified: direct_read, confidence: confirmed_bug, warning: "StepForward()/StepBack() wizard-step guard-condition asymmetry, plus UpdateParentEntitlements()/UpdateChildEntitlements() duplicated verbatim with nested uiCustomAppTree class; pim_ui_src/pimEntitlementRefresh.cxx (now read in full) adds: School/Beta-mode trial-license wait loops that never terminate on failure (`||`/`>=` where the correct sibling uses `&&`/`<=`), a missing-else bug in IsSufficientSpace() that discards 2 special-case size calculations, a fully dead nested uiCheckButtonCell class, and a self-contradictory PIM_HIDE_CUSTOMIZE_SCREEN env-var check; OnPushButtonActivate() (pim_ui_src/pimInstallMgrActions.cxx:643-1193, now fully traced) adds: a CONFIRMED HIGH-SEVERITY EULA-decline-order bug (EulaNextPreAction() called before the decline check, reverse of the Beta EULA arm's correct order); a control-flow-confirmed Refresh()-after-Destroy() gap (no `return` after OnFinishFromEula()/OnFinishFromBetaEula()); a disabled-Finish-button bug on exit-confirmation 'No'; and a confirmed re-entrancy bug via pimTextDlg's 'proceed anyway' flow re-entering this same method -- see docs/classes/pimInstallMgrDlg.md"}
  - {id: pimFrictionlessTrialDlg, type: class, module: pim_ui, verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED HIGH-SEVERITY BUG: Display()'s in-house-mode branch (pimGetInHouseMode()==1 or 2, the ONLY confirmed real usage) calls FrictionlessLicenseGenerate() then blocks on Sleep(60000) instead of calling uiDialog::Activate() -- the armed LicenseGenerateTimer never fires, so OnTimerExpired() (the ONLY call site anywhere in this codebase for pimFrictionlessTrialLicenseGet::HeartBeat()) never runs, so the license-save/PSF-update completion logic inside HeartBeat() never executes -- see docs/classes/pimFrictionlessTrialDlg.md"}
  - {id: rpimDlg, type: class, module: pim_ui, verified: direct_read, confidence: comparison_reference, warning: "Display() correctly calls uiDialog::Activate() unconditionally -- confirms by direct contrast that pimFrictionlessTrialDlg::Display()'s Sleep(60000) bug is a genuine defect, not inherent to the shared dialog design. Confirmed dead: SetURL()/URL member/GetAuth() (zero callers), the rDlg static self-pointer (no accessor), and OnTimerExpired()'s reentrancy guard (checked but never set true). Confirmed NOT dead (unlike its sibling): Refresh(), actively called from OnInputPanelInput() -- see docs/classes/rpimDlg.md"}
  - {id: pimCustomDlg, type: class, module: pim_ui, verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED LIVE (correction of an earlier likely_superseded speculation): 2 confirmed call sites (pimInstallMgrDlg's CustomizeBtn, pimEntitlementTree's per-row customize icon). Duplicates pimInstallMgrDlg's embedded Customize tab-set via an independent code path. CONFIRMED BUG: SetSABPath()/DisableSAB()/EnableSAB() guard on the wrong static SAB handle (main_dlg_sab_handle instead of its own help_dlg_sab_handle) in pimSAB.cxx -- see docs/classes/pimCustomDlg.md"}
  - {id: pimShortcutMgr, type: class, module: pim_ui, verified: direct_read, confidence: confirmed_bug_in_caller, warning: "AreChangesPending() cannot detect an added/removed shortcut, only a changed one; also exposed a confirmed indexing bug in pimSilent.cxx's caller code -- see docs/classes/pimShortcutMgr.md"}
  - {id: pimAuthDlg, type: class, module: pim_ui, verified: direct_read, confidence: confirmed_bug, warning: "The confirmed original template rpimDlg/pimFrictionlessTrialDlg were partially copied from (oldest of the 3, 2011); called directly from pim_core. CONFIRMED STRUCTURAL GAP: Initialize() has no idempotency guard, yet its AuthDialog singleton is confirmed genuinely REUSED (re-Initialize()d across multiple auth challenges per process) via pimSessionInfo::TryAuthorize()'s retry loop -- the one class in this family that needed the guard and doesn't have it. Also confirmed: URL member write-only even here (SetURL() IS called, unlike its 2 dead copies, but the value is never read); GetAuth() always returns false, ignored by both confirmed callers; RetryMsg is the one member fully wired end-to-end -- see docs/classes/pimAuthDlg.md"}
  - {id: pimGetAvailable, type: class, module: pim_core, pattern: "10th confirmed pimLoop subclass -- corrects every prior 'all 9 Loop subclasses' claim in this documentation set", verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED: 2 memory leaks in OnExecute() -- ImageXml never freed on the success path, ProductDefinitionXml never freed when filtered as HIDDEN_PRODUCT or not-a-product-definition-file. CONFIRMED: auth_status's declaring comment ('-3 abort, 0 success') is wrong -- 0 is set on authentication FAILURE, not success. CONFIRMED: IsAuthorized() has zero callers anywhere in this archive. CONFIRMED, not a bug but fragile: pim_core/pimLocate.cxx holds its own static pimGetAvailable* alias (set via LocateAllowPTCDotCom()) -- the same pattern already flagged as a LIVE bug for pimSAB.cxx's statics, here confirmed currently safe given the exact call sites that exist today -- see docs/classes/pimGetAvailable.md"}
  - {id: pimGetMediaDetails, type: class, module: pim_core, pattern: "GetInstance()-style singleton, structurally identical to the 7 owner-wrapper singletons but functionally unrelated (wraps no install-step pimLoop)", verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED, HIGH SEVERITY: GetDetails()'s cache-hit fast path reads the shared DetailRecords/IDs arrays with NO lock at all, while every mutating path holds Mutex -- called from both the UI thread and a background pimLoop thread (pimGetAvailable::OnExecute()), a genuine cross-thread race. CONFIRMED: GetProductXml()'s timeout-retry path refreshes the details cache but retries with the stale pre-refresh URL, confirmed by contrast with the correct pimEntitlement::UpdateMediaUrls() pattern. CONFIRMED, severity unknown: a 2nd, likely-redundant DetailRecords.Replace() call on that same retry path (depends on an external, unconfirmed dsXArray::Replace() ownership contract). CONFIRMED: GetProductXml()'s NULL returns are the exact root cause of pimEntitlementTree's null-deref bug -- see docs/classes/pimGetMediaDetails.md"}
  - {id: pimGetApplicationsList, type: free_function_group, module: pim, pattern: "NOT a class -- pimGetApplicationsList/pimAddApplicationsToList/IsApplicationInInstallList share a file-scope static StringXArray (applications_list) populated by pimCommandLineArgs()'s -APPLICATIONS/-XML/-XMLALL/-FLEX handling", verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED BUG, HIGH SEVERITY: InstallPreReqSilent() (pim_src/pimTop.cxx:904-966, silent-install path) uses this list's .GetSize() alone, never its content, to bound a loop indexing a completely different array (session entitlements). CORRECTED in a later dedicated pass on AddMandatoryAppsForSilentInstall(): the list is NOT usually empty in the one real call path (AddMandatoryAppsForSilentInstall() always runs first and unconditionally attempts to inject creobase.xml/qualityagent.xml) -- the real, more precise consequence is a SIZE MISMATCH, not usually a fully-empty list. CONFIRMED BUG: applications_list is populated in 2 incompatible formats (bare tags via -APPLICATIONS; full filesystem paths via -XML/-XMLALL) with no record of which -- 2 of 3 confirmed consumers (pimGetAvailable::OnExecute(), a pimTop.cxx:390 local-image loader) filter via exact match and can never recognize a path-format entry; only IsApplicationInInstallList()'s substring search is format-agnostic -- see docs/classes/pimGetApplicationsList.md. CONFIRMED BUG (AddMandatoryAppsForSilentInstall(), pim_src/pimTop.cxx:1282-1316, no header anywhere in this archive so no Doxygen patch exists for it): qualityagent.xml's 'mandatory' injection is nested inside creobase.xml's existence check, so it is silently skipped on media without creobase.xml, contradicting the function's name and its own changelog's 'Mandatory Installation of Quality Agent' intent. CONFIRMED BUG (same function/pass): -allpacks' utility-XML entries are added only to pimSilentInstallFromXML()'s own local list, never to the shared applications_list, so InstallPreReqSilent()'s later independent pimGetApplicationsList() call never sees them -- their prerequisites are silently never checked. CONFIRMED STRUCTURAL RISK (opposite direction, found in a later dedicated pass on IsApplicationInInstallList() itself): its substring search can itself false-positive whenever one product's filename is a literal substring of another entry already in applications_list -- checked pairwise against the 3 real confirmed arguments used in this codebase today (creobase.xml, creobase.p.xml, qualityagent.xml), none collides, so this is a confirmed risk, not a demonstrated live bug."}
  - {id: pimAvailableProduct, type: class, module: pim_core, pattern: "value object + its keyed collection pimGetAvailableProducts, both used internally by pimGetAvailable; promoted from a brief companion mention to its own full-depth doc", verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED BUG: AddInstance(const char *V, const char *shipcode, const char *media_id) never references its own `shipcode` parameter -- builds and dedups its VerShipcodes entry from V (bare version) alone, despite the member name and Sort()'s pimCompareVerShipcode() comparator both implying a combined version+shipcode identifier is intended. A 2nd AddInstance() call for the same version under a different shipcode is silently treated as a duplicate and its media_id is dropped. Also confirmed, low severity: every pimAvailableProduct* Create() allocates is never freed (~pimGetAvailableProducts() is empty); and both Print() overloads (pimAvailableProduct's and pimGetAvailableProducts', which fans out to it) are confirmed dead code -- zero live callers, their only 2 references (pimGetAvailable.cxx:474,478) are both commented out -- see docs/classes/pimAvailableProduct.md"}
  - {id: Cmp_cStrings, type: external_function, module: unknown, pattern: "NOT DOCUMENTABLE AT FULL DEPTH -- a btkMap comparator with NO implementation anywhere in this archive; independently forward-declared via a local `extern` in 4 separate .cxx files with no shared header", verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED: redeclared independently 4 times (upimDlg.cxx, pimsilentDlg.cxx, pimEntitlement.cxx, pimGetAvailableProduct.cxx), no single source of truth if its signature ever changes. CONFIRMED: pimsilentDlg.cxx's declaration is dead/unused. UNKNOWN and unconfirmable: actual comparison semantics (inferred, not confirmed, to be a strcmp()-style char* comparator from name and usage pattern alone) -- see docs/classes/Cmp_cStrings.md"}
  - {id: pimSilentTestXmlIsUseable, type: free_function_group, module: pim_core, pattern: "NOT a class -- pimSilentTestXmlIsUseable/pimIsProductXmlMatch/pimIsVersionMatch/pimSilentCanMatchNeeds/pimSilentFixupPSF/pimSilentFixupShortcuts/pimSilentCreateEntitlement (pim_core/includes/pimSilent.h, 7 functions) implement the silent-install XML-match-and-merge pipeline pimSilentInstallFromXML() drives per entry", verified: direct_read, confidence: confirmed_bug, warning: "CONFIRMED BUG: pimSilentTestXmlIsUseable() (pim_core_src/pimSilent.cxx:29-104) leaks a pimXmlFile on its XML-syntax-error path -- the delete that runs on the success path (:49) is skipped by the early return false; inside the error block (:47). CONFIRMED BUG, more severe: pimSilentCanMatchNeeds() (:227-346) leaks BOTH of its 2 internal pimXmlFile objects whenever either input file fails to parse -- every internal early-return and the final success return correctly delete both first, only the outer failure fallthrough does not. Both leaks confirmed by direct contrast with each function's own consistent cleanup pattern elsewhere. CONFIRMED BUG (pimSilentFixupPSF(), :353-416, depends on pimCommandMgr::DeleteCommand()/CanDeleteCommand()'s documented 'cannot delete the last command of a type' rule, pimCommandMgr.cxx:405-451,454-515): the pDiUmMMY<N> dummy placeholder this function creates to work around that rule can itself become permanently stuck/undeletable in Eb's final PSF/command set, if no other surviving command shares its license type by the time the final cleanup loop runs -- silently, since neither relevant DeleteCommand() call checks the return value. CONFIRMED DISCREPANCY (same function): its collision-handling comment says it removes 'the foobar command' (singular) but the code deletes EVERY command of the colliding license type via GetAllCommandNamesByType(). REACHABILITY, precisely characterized (found in a further, dedicated pass specifically on this collision-deletes-entire-type discrepancy): this function's own opening 'Drop' step (pim_core/pim_core_src/pimSilent.cxx:361-365) already deletes every original command in B before the collision-handling block ever runs -- but pimCommandMgr::CanDeleteCommand()'s live 'last of a type' count (pim_core/pim_core_src/pimCommandMgr.cxx:454-515, counting <PSF> nodes by <LICTYPE> AT CALL TIME) makes that Drop loop deterministically leave EXACTLY 1 surviving command per originally distinct license type. A given lictype2's FIRST collision can therefore only ever delete that ONE straggler -- matching the comment's singular framing; the discrepancy only actually manifests when 2+ A_wants entries in the SAME call independently collide against different B commands that originally shared the SAME lictype2, a real but narrower scenario than 'any non-colliding command of that type' suggests. DOWNSTREAM CONSEQUENCE, newly traced (same pass) -- an internal interaction with the stuck-dummy bug, not an external consumer: because AppendAddCommand() (:389) runs BEFORE the b_cmd_names delete loop (:390-391), and b_cmd_names was captured BEFORE that new dummy existed, a 2nd (or later) collision on the same lictype2 deletes the PREVIOUS iteration's straggler/dummy while its own brand-new dummy survives -- an unintentional cleanup mechanism for every dummy but the LAST one created per shared lictype2. This NARROWS, without retracting, the stuck-dummy finding below: the pimScriptLoop [LM_LICENSE_FILE] corruption risk is confirmed to apply to at most 1 dummy per originally-distinct license type per call. REACHABILITY, precisely characterized (found in a further dedicated pass on this stuck-dummy bug specifically): the dummy survives exactly when no entry in Ea's final wanted command set independently declares its own license type as the colliding name's OLD type in Eb -- a plausible, non-degenerate scenario (e.g. a single command's license type changing between product versions), not merely a contrived edge case. DOWNSTREAM CONSEQUENCE, newly traced (same pass): pimEntitlement::InstallScripts() (pimEntitlement.cxx:5627-5631) constructs a pimScriptLoop directly on the SAME pimXmlFile* document (Eb's xmlPtr) at real install-execution time -- confirmed object identity. pimScriptLoop::OnInstall() (pimScriptLoop.cxx:71-127) reads GetAllCommandNames()'s arr[0] UNCONDITIONALLY (no type-based selection, :111) to populate [LM_LICENSE_FILE] for that entitlement's generated install scripts, so a stuck dummy landing at index 0 would corrupt [LM_LICENSE_FILE] for the entire entitlement using its own internally-mismatched license-identifier data. Whether the dummy reliably reaches index 0 (or even appears in arr at all, given GetAllCommandNames()'s default feature-name filter) is not confirmed either way in this archive; the mechanism connecting the 2 functions via the shared XML document is fully confirmed. CONFIRMED, but CORRECTED (pimSilentCanMatchNeeds(), :307-339, depends on pimPackageMgr::GetInstallPackageNames(), pimPackageMgr.cxx:611-666): its package-availability check silently changes meaning depending on 3 global, process-wide command-line mode flags (pimGetBasePackMode()/pimGetCreoNGCRIMode()/pimGetAllPacksMode()) unrelated to the specific A/B XML pair -- its own header comment ('returns false if any packages marked for install in A are not known in B') only describes the default, no-special-mode case, confirmed by direct contrast with its platform/language sibling checks in the same function, which have no such dependency. -allpacks makes the check stricter (every declared package, not just requested ones, must exist in B); -basepack makes it looser (only required packages checked, ignoring the user's actual selections). A LATER dedicated pass on pimSilentCreateEntitlement() itself corrected the original '-allpacks overly strict'/'-basepack validation gap' framing: pimSilentCreateEntitlement()'s own package-selection loop (:576-586) calls the IDENTICAL GetInstallPackageNames() under the same mode flags on the same A, always immediately after a successful pimSilentCanMatchNeeds() call on the same A/B pair in the same process -- so the 2 functions are guaranteed consistent (what pimSilentCanMatchNeeds() validates is exactly what pimSilentCreateEntitlement() will install), and both modes' behavior is confirmed to be by design, not a bug. Only the shared header-comment imprecision remains an accurate part of the finding. REACHABILITY, more precisely characterized (found in a further, dedicated pass on this bug specifically): the 3 mode flags are NOT cleanly mutually exclusive -- -allpacks/-basepack ARE enforced mutually exclusive by the CLI parser itself (pim/pim_src/pimGeneralInit.cxx:309-320, each else-if branch clears the other), but -releaselink (sets pimGetCreoNGCRIMode() via pimSetCreoNGCRIMode(1), pimGeneralInit.cxx:291-293) has NO such interaction with either -- a real command line can freely combine -releaselink -basepack, silently making BasePack's definition win in GetInstallPackageNames()'s if/else-if chain (pimGetBasePackMode() checked FIRST, pimGetCreoNGCRIMode() SECOND) while pimGetCreoNGCRIMode() remains fully active for every OTHER purpose elsewhere in the codebase (10+ independent pim_ui call sites) -- a confirmed, reachable interaction via ordinary command-line flags, not hypothetical. DOWNSTREAM CONSEQUENCE, newly traced (same pass): pimPackageMgr::SetPackageInstallState() (pimPackageMgr.cxx:250-336) writes this mode-dependent selection directly onto the <PACKAGE> node's own install='Y'/'N' attribute on Eb's shared xmlPtr. pimMSILoop::IsEligibleForInstall() (pim_core/pim_core_src/pimMSILoop.cxx:937-969) reads that SAME attribute at real install-execution time -- via pimEntitlement::InstallMSI() (:5293-5330) constructing a pimMSILoop (already a fully documented pimLoop subclass) through pimMSICopier::MSIInstall()/MSICopy_low() on this same xmlPtr -- to decide whether a package's MSI feature/CDSECTION is ACTUALLY, PHYSICALLY INSTALLED. This confirms the mode-dependent logic is the literal, unbroken, real-world determinant of installed product features, not merely a validation/documentation-accuracy concern. pimSilentFixupShortcuts() in this same file is separately already documented from the caller side in the pimShortcutMgr node's warning (a confirmed caller-side B_avail[i]-vs-A_wants[i] indexing bug). CONFIRMED BUG (pimSilentFixupShortcuts(), :447-467, depends on pimShortcutMgr::GetShortcutProgramMenu()/SetShortcutProgramMenu(), pim_ui_src/pimShortcutMgr.cxx:169-211), a 2nd, distinct bug in this same function found in a later dedicated pass: GetShortcutProgramMenu()'s return value is silently ignored and SetShortcutProgramMenu() is called unconditionally, so a stale Program Menu group name from an earlier, unrelated shortcut in the same loop can be copied onto the current shortcut (or blanked to empty on the first iteration) -- confirmed by direct contrast with the correctly return-value-guarded GetShortcutStartDir()/SetShortcutStartDir() call 3 lines later in the same function. REACHABILITY, confirmed in a further dedicated pass on this bug specifically (not merely hypothetical): <PROGRAMSMENU> is confirmed to be an INDEPENDENTLY OPTIONAL per-shortcut child element -- pimShortcutLoop.cxx:88-341 parses PROGRAMSMENU/STARTMENU/DESKTOP/QUICKLAUNCH as sibling children of SHORTCUT in the same else-if chain, each independently present-or-absent -- so a shortcut offered only via Desktop/Quicklaunch legitimately has no PROGRAMSMENU node, making this bug's trigger condition a normal configuration, not a contrived edge case. DOWNSTREAM CONSEQUENCE, newly traced (same pass), concrete and deterministic: pimEntitlement::InstallShortcuts() (pimEntitlement.cxx:5778-5787) calls pimShortcuts::GetInstance().Create(xmlPtr) on the SAME pimXmlFile* document at real install-execution time -- confirmed object identity. pimShortcutLoop::OnInstall() (pimShortcutLoop.cxx:324-326,654-671) reads the shortcut's PROGRAMSMENU text an